apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespaces 가 먼저다. 네임스페이스가 없으면 그 안에 넣는 것이 전부 실패하고,
# Pod Security Admission 라벨은 파드가 뜨기 전에 붙어 있어야 한다 (소급 안 됨).
# ⚠️ **이 파일은 `kubectl kustomize governance/` 로 전체를 한 번에 보기
# 위한 것이다. ArgoCD 는 이걸 안 쓴다.** Application 이 둘로 갈려 있고
# 각각 `namespaces/` 와 `policies/` 를 따로 가리킨다 — 선행 조건이 달라서다
# → governance/policies/kustomization.yaml
resources:
  - namespaces
  - policies
