apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disallow-default-namespace.yaml
  - disallow-latest-tag.yaml
  - generate-default-network-policies.yaml
  # ClusterPolicy 가 아니라 NetworkPolicy 다. generate 정책이 만든 기본 차단에
  # apiserver → 웹훅 구멍 하나를 내는 짝이라 같은 디렉터리에 둔다
  # → governance/secops/external-secrets-webhook-ingress.yaml
  - external-secrets-webhook-ingress.yaml
  - external-secrets-metrics-ingress.yaml
  - require-image-registry.yaml

# require-run-as-nonroot.yaml 은 지웠다. Pod Security Admission 의
# restricted 등급이 같은 것을 더 강하게 한다 (상속 덮어쓰기까지 막는다).
# → governance/namespaces/ · governance/README.md 「왜 둘로 나누나」
