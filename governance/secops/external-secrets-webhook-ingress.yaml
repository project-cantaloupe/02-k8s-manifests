# kube-apiserver 가 ESO 의 ValidatingWebhook 을 호출할 수 있게 구멍 하나를 낸다.
#
# `external-secrets` 에는 generate 정책이 만든 `default-deny-ingress` 가 있고,
# 웹훅 호출자는 **파드가 아니라 컨트롤플레인의 apiserver** 라 podSelector 로
# 허용할 수 없다. 막히면 `SecretStore`·`ExternalSecret` 생성이 이렇게 죽는다.
#
#   Error from server (InternalError): failed calling webhook
#   "validate.secretstore.external-secrets.io": context deadline exceeded
#
# ── 왜 제외 목록이 아니라 allow 인가 ────────────────────────────
#
# cert-manager·Kyverno·calico-apiserver 는 `generate-default-network-policies`
# 의 제외 목록에 넣어 해결했다. **여기서는 그 길이 막혔다** — Kyverno 가
# generate 규칙의 match/exclude 변경을 거부한다(immutable fields). 정책을
# 지우고 다시 만들어야 하는데 `orphanDownstreamOnPolicyDelete` 가 꺼져 있어
# 삭제하면 **9개 네임스페이스의 NetworkPolicy 가 같이 사라지고**, 재생성해도
# 네임스페이스가 이미 있어 트리거가 안 돌아 자동 복구되지 않는다.
#
# 결과적으로 이쪽이 더 안전하다. 제외는 그 네임스페이스의 ingress 차단을
# **통째로** 없애는 반면, 여기서는 apiserver → 웹훅 한 경로만 연다.
#
# ── 출발지는 추측이 아니라 실측이다 ─────────────────────────────
#
# 노드의 `InternalIP` 는 Tailscale 주소(`100.x`)지만, 파드로 가는 트래픽은
# Calico VXLAN 을 타면서 **터널 인터페이스 주소로 SNAT 된다.** cp-01 에서
# 커널에 물어본 값이다.
#
#   $ ip route get <웹훅 파드 IP>
#   10.244.179.139 via 10.244.179.128 dev vxlan.calico src 10.244.119.71
#                                                          ^^^^^^^^^^^^^
#
# ⚠️ **cp-01 을 다시 만들면 이 주소가 바뀌고 웹훅이 조용히 막힌다.**
# 증상은 위의 `context deadline exceeded` 다. 다시 구할 때는
#
#   kubectl get node cntlp-aws-cp-01 \
#     -o jsonpath='{.metadata.annotations.projectcalico\.org/IPv4VXLANTunnelAddr}'
#
# ⚠️ **컨트롤플레인을 3대로 늘리면 나머지 둘의 터널 주소도 추가해야 한다.**
# → decisions/20260803_control-plane-single-node.md
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes: [Ingress]
  ingress:
    - from:
        # cp-01 의 Calico VXLAN 터널 주소.
        - ipBlock:
            cidr: 10.244.119.71/32
      ports:
        # 서비스 포트(443)가 아니라 **파드의 containerPort** 다.
        # NetworkPolicy 는 서비스를 모르고 파드만 본다.
        - protocol: TCP
          port: 10250
