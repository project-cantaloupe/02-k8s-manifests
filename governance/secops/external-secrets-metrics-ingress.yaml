# Prometheus is the only cross-namespace caller permitted to scrape the
# External Secrets controller metrics endpoint. The generated default-deny
# policy otherwise prevents the ServiceMonitor targets from being reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-external-secrets-metrics
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
