# 우리 이미지는 ECR 에서만 당긴다.
#
# `decisions/20260803_registry-harbor-to-ecr.md` 를 **어드미션에서 강제한다.**
# 그 결정은 Harbor 가 원본이자 스캔 지점이고 ECR 이 런타임 pull 대상이라고
# 정했다. 문서로만 두면 급할 때 사람이 Harbor 에서 직접 당기고, 그 이미지는
# Trivy 를 통과하지 않은 것이다.
#
# ── 왜 apps 네임스페이스만인가 ──────────────────────────────────
#
# 이 규칙이 강제하는 것은 **우리가 빌드한 이미지**의 출처다.
# `platform/*` 의 ArgoCD·Harbor·Prometheus 는 업스트림 차트에서 오고
# docker.io·quay.io·registry.k8s.io 를 당긴다. 거기에 ECR 을 요구하면
# 플랫폼이 전부 막힌다.
#
# 지금 우리 이미지를 쓰는 것은 `apps/audio/` 뿐이고 `platform: aws` 에
# 고정돼 있다 → 위 결정문 「그 외」 3번째 항목.
#
# **온프렘 워크로드가 우리 이미지를 당기게 되면 이 정책을 고쳐야 한다.**
# 그때는 Harbor 도 허용 목록에 들어간다 (결정문 본문).
#
# ── 계정 ID 를 안 박은 이유 ─────────────────────────────────────
#
# `*.dkr.ecr.ap-northeast-2.amazonaws.com/*` 로 **계정을 와일드카드**로 뒀다.
# AWS 계정 ID 는 이 프로젝트가 의도적으로 git 밖에 두는 값이다
# (`terraform.tfvars` 는 gitignore, `.example` 은 `123456789012` 플레이스홀더).
#
# 대가 — 같은 리전의 *다른* 계정 ECR 도 통과한다. 좁히려면 계정 ID 를 넣어야
# 하고, 그건 이 리포의 기존 방침을 뒤집는 일이다. **판단이 필요하면 여기다.**
# 좁히기로 하면 ConfigMap 참조나 kustomize replacement 로 값을 주입하는 방법이
# 있다 — 어느 쪽이든 값이 어딘가에는 커밋된다.
#
# → references/20260803_secops-admission-and-network-policy.md 3절
# ── Audit → Enforce 로 전환했다 (2026-08-18) ────────────────────
#
# 08-06 에 이 정책을 쓸 때 `apps` 파드 넷이 전부 GHCR 을 당기고 있어서
# `Audit` 로 시작했다. 그 전제는 끝났다 — 실측 기준 `apps` 의 워크로드
# 컨트롤러 **아홉 개가 전부 ECR** 이다.
#
#     Deployment  audio-api · audio-events · audio-transcode ·
#                 audio-transcode-burst · audio-web   → app-audio-*
#     CronJob     audio-finops-{steady,scheduled-peak,
#                 unexpected-burst,web-validation}    → mirror-python
#
# 마지막까지 남아 있던 것은 FinOps loadtest 의 `python:3.12-alpine` 이었고,
# ECR 미러를 만들어 옮겼다 (`mirror-python`, IMMUTABLE, 8개 아키텍처 보존).
#
# ⚠️ **PolicyReport 는 아직 0 이 아니다.** 08-18 기준 14건이 남아 있다 —
# 전부 **이미 끝난** Job 10개와 그 Pod 4개다 (`smoke-20260810*`,
# `baseline-20260817*`). 어드미션은 **생성 시점에만** 보므로 템플릿을 고쳐도
# 과거 객체는 소급해서 안 고쳐지고, 지워야 사라진다. FinOps 실험 기록이라
# 여기서 지우지 않는다 → `tasks/todo/013_finops-actionable-scenarios.md`
#
# **그 14건은 Enforce 의 위험이 아니다.** 완료된 객체는 파드를 새로 만들지
# 않는다. Enforce 가 거는 것은 앞으로의 생성뿐이고, 그것을 만드는 컨트롤러는
# 위 아홉 개가 전부다.
#
# ⚠️ **진짜 위험은 여전히 "이미 도는 파드"다.** 어드미션은 생성 시점에만
# 보므로 지금 도는 파드는 살아 있고, 규칙에 안 맞는 것이 섞여 있다면
# **노드 드레인·OOM·이미지 재푸시 같은 무관해 보이는 사건에서** 터진다.
# 원인이 안 드러나는 종류의 고장이라, 위의 아홉 개를 실측으로 확인한 것이
# 전환의 근거다 → governance/README.md 의 Audit 우선 절차
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-registry
  annotations:
    policies.kyverno.io/description: >-
      apps 네임스페이스의 이미지는 ECR 에서만 온다.
      Harbor 는 빌드 경로 전용이고 런타임 pull 대상이 아니다.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: images-from-ecr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps]
      validate:
        message: >-
          apps 의 이미지는 ECR 에서만 당긴다
          (*.dkr.ecr.ap-northeast-2.amazonaws.com).
          Harbor 는 빌드 경로 전용이다
          → decisions/20260803_registry-harbor-to-ecr.md
        pattern:
          spec:
            containers:
              - image: "*.dkr.ecr.ap-northeast-2.amazonaws.com/*"
            =(initContainers):
              - image: "*.dkr.ecr.ap-northeast-2.amazonaws.com/*"
            =(ephemeralContainers):
              - image: "*.dkr.ecr.ap-northeast-2.amazonaws.com/*"
