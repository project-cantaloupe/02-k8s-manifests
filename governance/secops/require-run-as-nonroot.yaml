# 예시 정책. 실제로 적용된다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-nonroot
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "컨테이너는 runAsNonRoot: true 로 실행해야 한다."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
