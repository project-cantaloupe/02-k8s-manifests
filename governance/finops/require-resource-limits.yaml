# CPU·Memory requests와 Memory limit은 스케줄링·용량·비용 분석의 기준이다.
# 실제 비용이 발생하고 우리가 배포 설정을 소유하는 서비스 영역을 Audit 한다.
# 비어 있던 finops·messaging Namespace는 제거했고, 별도 Namespace로 분리된
# audio-ingress·Harbor를 비용 관측 범위에 포함한다.
# **Argo CD 자신이 목록에 있다.** Enforce 로 두면 Argo CD 가 재시작할 때
# 자기가 못 뜨고, 그걸 고칠 수 있는 것이 Argo CD 다. 자기잠금이다.
#
# 이 정책은 강제 전환을 목표로 하지 않는다. Grafana의 실제 사용량과
# PolicyReport를 함께 보고 조정 근거로 사용한다. initContainer도
# `=(initContainers)` 패턴으로 같은 기준을 관찰한다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - apps
                - devops
                - monitoring
                - logging
                - secops
                - audio-ingress
                - harbor-system
      validate:
        message: >-
          모든 컨테이너에 CPU·Memory requests와 Memory limit이 필요하다.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
