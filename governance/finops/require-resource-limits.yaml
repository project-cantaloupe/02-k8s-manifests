# CPU·Memory requests와 Memory limit은 스케줄링·용량·비용 분석의 기준이다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - apps
                - devops
                - monitoring
                - messaging
                - logging
                - finops
      validate:
        message: >-
          모든 컨테이너에 CPU·Memory requests와 Memory limit이 필요하다.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
