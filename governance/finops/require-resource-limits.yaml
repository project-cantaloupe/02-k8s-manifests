# requests·limits 가 없으면 Opencost 가 비용을 워크로드에 귀속시키지 못한다.
# 비용 가시성이 목표라면 이건 선택이 아니다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "모든 컨테이너에 resources.requests 와 limits 가 필요하다."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
