# KEDA operator, metrics API server, admission webhook 전용 네임스페이스.
#
# KEDA 구성요소는 특권 또는 host 접근이 필요하지 않으므로 restricted 경계를
# 유지한다. 다른 플랫폼 네임스페이스와 동일하게 Argo CD Application이 직접
# 만들지 않고 governance-namespaces가 먼저 생성하고 관리한다.
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    area: autoscaling
    platform: aws
    cost-allocation: shared
    app.kubernetes.io/part-of: cantaloupe-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
