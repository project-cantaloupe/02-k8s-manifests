# Istio 인그레스 게이트웨이. `applications/istio-ingress.yaml`(wave -10).
#
# **istiod 와 다른 네임스페이스다.** 차트의 `gateway` 릴리스가 여기로 간다.
#
# 게이트웨이 파드는 이미 restricted 에 맞게 잡혀 있다 — `runAsNonRoot: true`,
# `runAsUser: 1337`, `allowPrivilegeEscalation: false`,
# `readOnlyRootFilesystem: true`, `capabilities.drop: [ALL]`.
# 노드 :443 을 직접 잡는 대신 **NodePort 30443** 을 쓰기 때문에 특권이
# 필요 없다. 인그레스 컨트롤러가 보통 hostNetwork 로 특권을 먹는 것을
# 이 구성이 피해간다.
#
# 그래도 enforce 는 baseline 으로 시작한다. 차트가 만드는 다른 자원까지
# restricted 를 지나는지 확인하지 않았다. warn 이 조용하면 올린다.
#
# ⚠️ 여기서 `apps` 로 가는 트래픽은 **교차 네임스페이스 인그레스**라
# `default-deny-ingress` 에 막힌다. 허용 규칙이 생성 정책에 들어 있다
# → governance/secops/generate-default-network-policies.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    area: apps
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
