# istiod — 메시 컨트롤플레인 (Istio 1.30.3, **ambient 모드**).
#
# ⚠️ **여기는 컨트롤플레인만이다. 데이터플레인은 다른 네임스페이스에 산다.**
# ambient 의 특권 부분인 istio-cni 와 ztunnel 은 각각 전용 네임스페이스로
# 봉쇄했다 → governance/namespaces/{istio-cni,ztunnel}.yaml
# 여기 넣었으면 istiod 가 하드닝 없는 곳에서 돌게 된다.
#
# `applications/istio-base.yaml`(wave -30)과 `applications/istiod.yaml`
# (wave -20)이 여기로 배포한다. 그 Application 들이 `CreateNamespace=true` 로
# 만들고 있어서 **PSA 라벨이 안 붙는 상태였다.** 이 파일이 소유자가 된다.
#
# baseline 인 이유 — istiod 차트가 `seccompProfile: RuntimeDefault` 를 넣고
# 있어 restricted 도 지날 가능성이 높지만 확인하지 않았다. warn/audit 을
# restricted 로 둬서 격차가 보이게 하고, 위반이 없으면 enforce 를 올린다.
#
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    area: apps
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
