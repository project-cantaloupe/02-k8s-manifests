# OpenSearch · OpenSearch Dashboards.
#
# baseline 인 이유 — OpenSearch 는 `vm.max_map_count` 를 올려야 뜨고, 보통
# 특권 initContainer 로 sysctl 을 만진다. 노드에서 미리 설정해 두면 이
# initContainer 를 없앨 수 있고, 그러면 restricted 로 올릴 수 있다.
# → 그 판정은 logging 스택을 세울 때 한다.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
