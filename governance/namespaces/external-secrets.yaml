# External Secrets Operator. `applications/external-secrets.yaml` 이 여기로 배포한다.
#
# 외부 비밀 저장소(여기서는 AWS Secrets Manager)를 감시해 Kubernetes Secret
# 으로 동기화한다. **매니페스트에는 "어디서 가져올지"만 남고 값이 안 들어간다**
# — `decisions/20260731_secret-access-no-fallback.md` 를 지키는 방식이다.
#
# 첫 사용처는 Keycloak 의 RDS 비밀번호다. RDS 가 관리하는 마스터 비밀번호가
# Secrets Manager 에 있고, 노드 인스턴스 프로파일로 그걸 읽는다
# → decisions/20260807_keycloak-database-placement.md
#
# 차트 기본 네임스페이스(`external-secrets`)를 그대로 쓴다. cert-manager·
# kyverno 와 같은 패턴 — 오퍼레이터마다 전용 네임스페이스에 `area: secops`.
#
# 특권이 필요 없어 restricted 다.
#
# ⚠️ ESO 의 **ValidatingWebhook 둘**(`secretstore-validate`·
# `externalsecret-validate`)을 kube-apiserver 가 **컨트롤플레인의 호스트
# 네트워크에서** 호출한다. 파드 셀렉터로 허용할 수 없는 출처라
# `default-deny-ingress` 대상에서 제외돼 있다 — cert-manager·Kyverno 와
# 같은 이유다 → governance/secops/generate-default-network-policies.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    area: secops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
