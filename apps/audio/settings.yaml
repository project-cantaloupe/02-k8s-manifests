# 세 워크로드가 공유하는 설정이다. 비밀 값은 여기 두지 않는다.
#
# SQS Queue URL에는 AWS 계정 ID가 들어간다. 계정 ID는 모든 ARN에 나타나는 식별자
# 이며 자격증명이 아니므로 매니페스트에 둔다. 값을 Git 밖에 두면 클러스터를 다시
# 만들 때마다 수동 생성이 필요해지고, 그런 수동 상태가 이 프로젝트에서 반복된
# 사고 원인이었다.
#
# 이 값들은 terraform/aws/audio 의 queue_urls, cloudfront_base_url,
# cloudfront_key_pair_id output과 일치해야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-settings
  namespace: apps
data:
  AWS_REGION: ap-northeast-2

  QUARANTINE_BUCKET: cntlp-aws-quarantine
  ARTIFACT_BUCKET: cntlp-aws-transcode

  SCAN_RESULT_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/764553891928/cntlp-aws-queue-scan-result
  TRANSCODE_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/764553891928/cntlp-aws-queue-transcode
  TRANSCODE_RESULT_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/764553891928/cntlp-aws-queue-transcode-result

  # CloudFront 배포 도메인과 Key Pair ID는 서명된 URL에 그대로 노출되는 공개
  # 값이므로 Git에서 관리해도 된다. 개인키만 Secret으로 마운트한다.
  #
  # CLOUDFRONT_KEY_PAIR_ID는 cloudfront-signing-key Secret의 개인키와 반드시
  # 짝이어야 한다. 어긋나면 서명은 정상 생성되지만 CloudFront가 403을 낸다.
  # 값을 바꾼 뒤에는 아래 두 지문이 같은지 확인한다.
  #
  #   kubectl -n apps get secret cloudfront-signing-key \
  #     -o jsonpath='{.data.cloudfront-private-key\.pem}' | base64 -d \
  #     | openssl rsa -pubout -outform DER | openssl dgst -sha256
  #
  #   aws cloudfront get-public-key --id <ID> \
  #     --query 'PublicKey.PublicKeyConfig.EncodedKey' --output text \
  #     | openssl rsa -pubin -outform DER | openssl dgst -sha256
  PLAYBACK_URL_MODE: cloudfront
  CLOUDFRONT_BASE_URL: https://d8htm75hft1yx.cloudfront.net
  CLOUDFRONT_KEY_PAIR_ID: KX2K2HOOI3JM5
  CLOUDFRONT_PRIVATE_KEY_FILE: /var/run/secrets/cntlp/cloudfront-private-key.pem

  # Worker 조정값. transcode Queue의 Visibility Timeout과 일치시킨다.
  SQS_VISIBILITY_TIMEOUT_SECONDS: "900"
  SQS_POLL_WAIT_SECONDS: "20"
  TRANSCODE_MAXIMUM_ATTEMPTS: "3"
  AUDIO_MAXIMUM_DURATION_SECONDS: "7200"
  METRICS_PORT: "9090"

  # Cognito JWT 검증이 없는 동안 X-Cantaloupe-Subject 헤더를 신뢰한다.
  # 이 값으로는 공개 경로에 노출하지 않는다. NLB Security Group을 사용자 IP로
  # 제한한 상태에서만 외부 접근을 허용한다.
  AUTH_MODE: development
