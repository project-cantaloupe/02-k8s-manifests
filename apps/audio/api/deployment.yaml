# audio-api와 audio-events는 같은 Go Module과 Docker Image를 쓰지만 실행 Binary가
# 다르다. Image는 하나만 빌드하고 command로 진입점을 나눈다.
#
# nodeSelector는 apps/audio/kustomization.yaml이 일괄 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-api
  namespace: apps
  labels:
    app: audio-api
    area: apps
    platform: aws
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-api
  template:
    metadata:
      labels:
        app: audio-api
        area: apps
        platform: aws
        component: api
        # Mesh 참여는 Namespace의 `istio.io/dataplane-mode: ambient`가 한다.
        # 여기에 라벨을 적지 않는다 → governance/namespaces/apps.yaml
        #
        # ⚠️ 예전의 `sidecar.istio.io/inject: "true"`를 뺐다. `apps`가 PSA
        # `restricted`라 `istio-init`의 NET_ADMIN·NET_RAW가 어드미션에서
        # 거부된다. ambient는 그 특권을 노드 DaemonSet으로 옮긴 방식이다.
    spec:
      containers:
        - name: api
          image: audio-api
          # GitHub Actions가 Harbor에 푸시한 커밋 SHA 태그를 사용한다.
          # 이후 digest 고정으로 전환하면 태그 재지정 가능성까지 제거할 수 있다.
          imagePullPolicy: Always
          # Dockerfile이 바이너리를 루트에 둔다. ENTRYPOINT도 /audio-api다.
          command: ["/audio-api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Git이 관리하는 비민감 설정
            - configMapRef:
                name: audio-settings
            # RDS 자격증명으로 만든 DATABASE_URL. 클러스터에서 직접 생성한다.
            - secretRef:
                name: audio-database
          # 기동 시 DB 연결과 필수 환경변수를 검사하므로 startup을 넉넉히 준다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # CloudFront Signed URL 서명용 개인키. Secret은 Git에 넣지 않는다.
            - name: cloudfront-key
              mountPath: /var/run/secrets/cntlp
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: cloudfront-key
          secret:
            secretName: cloudfront-signing-key
            items:
              - key: cloudfront-private-key.pem
                path: cloudfront-private-key.pem
