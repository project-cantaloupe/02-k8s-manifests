# audio-api와 audio-events는 같은 Go Module과 Docker Image를 쓰지만 실행 Binary가
# 다르다. Image는 하나만 빌드하고 command로 진입점을 나눈다.
#
# nodeSelector는 apps/audio/kustomization.yaml이 일괄 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-api
  namespace: apps
  labels:
    app: audio-api
    area: apps
    platform: aws
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-api
  template:
    metadata:
      labels:
        app: audio-api
        area: apps
        platform: aws
        component: api
        # Gateway에서 오는 Mesh 트래픽을 받으므로 Sidecar를 주입한다.
        # 어노테이션이 아니라 라벨이어야 Webhook의 objectSelector가 인식한다.
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: audio-api
          # newTag가 dev라는 가변 태그다. IfNotPresent면 노드에 같은 이름의
          # 이미지가 있는 한 레지스트리를 조회하지 않아, 재푸시해도 파드가
          # 계속 옛 이미지를 쓴다. rollout restart로도 갱신되지 않는다.
          # CI가 digest를 커밋하게 되면 그때 고정 digest로 바꾼다.
          imagePullPolicy: Always
          # Dockerfile이 바이너리를 루트에 둔다. ENTRYPOINT도 /audio-api다.
          command: ["/audio-api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Git이 관리하는 비민감 설정
            - configMapRef:
                name: audio-settings
            # RDS 자격증명으로 만든 DATABASE_URL. 클러스터에서 직접 생성한다.
            - secretRef:
                name: audio-database
          # 기동 시 DB 연결과 필수 환경변수를 검사하므로 startup을 넉넉히 준다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # CloudFront Signed URL 서명용 개인키. Secret은 Git에 넣지 않는다.
            - name: cloudfront-key
              mountPath: /var/run/secrets/cntlp
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: cloudfront-key
          secret:
            secretName: cloudfront-signing-key
            items:
              - key: cloudfront-private-key.pem
                path: cloudfront-private-key.pem
