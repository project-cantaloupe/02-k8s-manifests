# 외부 노출은 Ingress Gateway가 담당하므로 ClusterIP로 둔다.
# audio-events는 Mesh 안에서 들어오는 트래픽이 없어 Service가 없다.
apiVersion: v1
kind: Service
metadata:
  name: audio-api
  namespace: apps
  labels:
    app: audio-api
    area: apps
    platform: aws
    component: api
spec:
  selector:
    app: audio-api
  ports:
    - name: http
      port: 80
      targetPort: http
