apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - deployment-events.yaml
  - service.yaml

# 03-app-audio의 GitHub Actions가 이미지를 Harbor에 Push하고 Trivy 검사를 수행한다.
# 검사를 통과한 이미지를 Amazon ECR로 승격한 뒤, 이 ECR 이미지의 태그를
# 애플리케이션 커밋 SHA로 갱신한다.
# audio-api와 audio-events가 동일한 이미지를 사용하므로 images 항목은 하나다.
images:
  - name: audio-api
    newName: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/app-audio-api
    newTag: 8bfdcdbb608f202d652008b44ca82e791885a2a3
