apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: audio-transcode-burst
  namespace: apps
  labels:
    app: audio-transcode-burst
    area: apps
    platform: aws
spec:
  scaleTargetRef:
    name: audio-transcode-burst
    envSourceContainerName: transcode
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 0
  # FinOps 비교에서 동일한 Queue 부하로 Baseline 2개 Node와
  # Right-sized Candidate 1개 Node의 실제 사용시간을 측정한다.
  maxReplicaCount: 6
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
    # 화~목 21시의 예측 가능한 Peak보다 15분 먼저 Burst Worker 6개를 요청한다.
    # Baseline은 Karpenter Node 2대, Right-sized Candidate는 1대가 준비되는지
    # 확인한다. 실험 종료 뒤에는 반복 비용을 막기 위해 이 Trigger를 제거한다.
    - type: cron
      metadata:
        timezone: Asia/Seoul
        start: 45 20 * * 2-4
        end: 30 21 * * 2-4
        desiredReplicas: "6"
    - type: aws-sqs-queue
      metadata:
        # Base Worker가 처리하는 한 건은 확장하지 않고 Visible과 In-flight의 합이
        # 2건 이상일 때 활성화한다. 활성화 후에는 합계 1건당 Burst Worker 한 개를
        # 목표로 하되 위 maxReplicaCount를 넘지 않는다.
        queueURLFromEnv: TRANSCODE_QUEUE_URL
        queueLength: "1"
        activationQueueLength: "1"
        scaleOnInFlight: "true"
        scaleOnDelayed: "false"
        awsRegion: ap-northeast-2
        # KEDA 2.20에서 Operator의 AWS SDK 기본 자격 증명을 사용한다. Operator는
        # 최소 Queue 조회 권한이 붙은 AWS Control Plane Node에 고정한다.
        identityOwner: operator
