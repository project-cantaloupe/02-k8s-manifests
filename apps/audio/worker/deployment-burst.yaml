# SQS 적체가 Base Worker 한 대의 처리량을 넘을 때만 KEDA가 0개에서 최대 6개로
# 확장한다. Pod는 Karpenter NodePool만 선택하므로 Pending 상태가 Node 증설을
# 유발하고 Queue가 줄면 다시 0개가 된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-transcode-burst
  namespace: apps
  annotations:
    cantaloupe.io/finops-profile: baseline
    cantaloupe.io/finops-request: "cpu=250m,memory=256Mi"
    cantaloupe.io/finops-rationale: conservative-initial-sizing-before-controlled-load
  labels:
    app: audio-transcode-burst
    area: apps
    platform: aws
    component: transcode
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audio-transcode-burst
  template:
    metadata:
      labels:
        app: audio-transcode-burst
        area: apps
        platform: aws
        component: transcode
        istio.io/dataplane-mode: none
    spec:
      terminationGracePeriodSeconds: 120
      tolerations:
        - key: cantaloupe.io/audio-burst
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: transcode
          image: audio-worker
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: audio-settings
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /tmp
          resources:
            requests:
              # Base Worker와 동일한 Baseline을 사용해 Scheduled/Unexpected Run을
              # 같은 기준으로 비교한다. Candidate도 두 Deployment에 함께 적용한다.
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: work
          emptyDir: {}
