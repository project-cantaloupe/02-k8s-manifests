# FFmpeg로 MP3와 waveform을 만든다. SQS를 long polling하고 메시지를 한 건씩
# 처리한다.
#
# Mesh에 넣지 않는다. 통신 대상이 S3와 SQS뿐이라 Mesh 이득이 없고,
# 트랙당 처리 비용에 Mesh 비용을 섞지 않기 위해서다. 이 결정은 FinOps 측정
# 기준선의 일부다.
#
# ⚠️ **ambient에서는 "라벨을 안 붙이는 것"으로는 안 빠진다.** Namespace에
# `istio.io/dataplane-mode: ambient`가 걸려 있으면 그 안의 파드가 전부
# ztunnel에 잡힌다. 사이드카 때와 정반대로 **빼는 쪽을 명시**해야 한다 —
# 아래 Pod 라벨 `istio.io/dataplane-mode: none`이 그것이다.
# → governance/namespaces/apps.yaml
#
# DB에 직접 접속하지 않으므로 DATABASE_URL이 필요 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-transcode
  namespace: apps
  annotations:
    cantaloupe.io/finops-profile: baseline
    cantaloupe.io/finops-request: "cpu=250m,memory=256Mi"
    cantaloupe.io/finops-rationale: conservative-initial-sizing-before-controlled-load
  labels:
    app: audio-transcode
    area: apps
    platform: aws
    component: transcode
spec:
  replicas: 1
  # FFmpeg 작업 중 교체되면 메시지가 Visibility Timeout까지 묶이므로 순차 교체한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audio-transcode
  template:
    metadata:
      labels:
        app: audio-transcode
        area: apps
        platform: aws
        component: transcode
        # FinOps 기준선. 위 주석 참조.
        istio.io/dataplane-mode: none
    spec:
      # Base Worker는 Terraform이 유지하는 고정 AWS Worker에서만 실행한다.
      # Karpenter Node는 같은 platform·role 라벨을 가지므로 명시적으로 제외한다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: DoesNotExist
      # SQS 메시지를 처리 중일 때 강제 종료되지 않도록 여유를 준다.
      terminationGracePeriodSeconds: 120
      containers:
        - name: transcode
          image: audio-worker
          # GitHub Actions가 Harbor에 푸시한 커밋 SHA 태그를 사용한다.
          # 이후 digest 고정으로 전환하면 태그 재지정 가능성까지 제거할 수 있다.
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: audio-settings
          # HTTP 헬스 엔드포인트가 없다. Prometheus metrics 포트로 기동을 확인한다.
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # FFmpeg가 중간 산출물을 디스크에 쓴다. 읽기 전용 루트이므로 작업
          # 공간을 별도로 준다.
          volumeMounts:
            - name: work
              mountPath: /tmp
          resources:
            requests:
              # 정식 FinOps 실험의 보수적 초기 용량이다. 사용량 이력이 없는
              # FFmpeg Worker의 안정성을 먼저 확보하고, 동일 부하에서 수집한
              # VPA·P95·최대값으로 Candidate를 결정한다.
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: work
          emptyDir: {}
