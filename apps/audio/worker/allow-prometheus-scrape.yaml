apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audio-transcode-allow-prometheus-scrape
  namespace: apps
  labels:
    app: audio-transcode
    area: apps
    component: transcode-metrics
    platform: aws
spec:
  podSelector:
    matchLabels:
      app: audio-transcode
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
