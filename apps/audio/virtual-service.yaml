# Gateway로 들어온 요청의 경로 분기를 한 곳에서 관리한다. VirtualService를
# 서비스별로 나누면 같은 Gateway와 host에 대해 매칭 순서가 불분명해진다.
#
# 더 구체적인 /v1 을 먼저 두고 나머지를 Web이 받는다.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: audio
  namespace: apps
spec:
  hosts:
    - "*"
  gateways:
    - audio-ingress/audio-gateway
  http:
    - match:
        - uri:
            prefix: /v1/
      # 외부에서 넣은 개발용 Subject를 API까지 전달하지 않는다. 공개 트랙은
      # 익명 조회가 가능하고 비공개 트랙은 API가 Not Found로 처리한다.
      headers:
        request:
          remove:
            - x-cantaloupe-subject
      route:
        - destination:
            host: audio-api.apps.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /healthz
        - uri:
            prefix: /readyz
      route:
        - destination:
            host: audio-api.apps.svc.cluster.local
            port:
              number: 80
    - route:
        - destination:
            host: audio-web.apps.svc.cluster.local
            port:
              number: 80
