# Audio FinOps Runner의 Client Credentials를 AWS Secrets Manager에서 가져온다.
# 값은 Git에 두지 않고 terraform/keycloak의 cntlp/oidc/audio-finops가 소유한다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: audio-finops-aws-secrets-manager
  namespace: apps
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audio-finops-oidc
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: audio-finops-aws-secrets-manager
    kind: SecretStore
  target:
    name: audio-finops-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: cntlp/oidc/audio-finops
        property: client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: cntlp/oidc/audio-finops
        property: client_secret
