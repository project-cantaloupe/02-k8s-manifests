apiVersion: v1
kind: ServiceAccount
metadata:
  name: audio-finops-load-runner
  namespace: apps
  labels:
    app: audio-finops-load-runner
    experiment: audio-finops
---
# AWS Pod에서 GCP Service ClusterIP로 직접 접근하지 않고 API Server가 두 개의
# monitoring Service만 중계한다. Secret, Pod, 다른 Service 접근 권한은 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audio-finops-monitoring-proxy
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - monitoring-prometheus
      - cantaloupe-finops-pushgateway
      # Service proxy URL의 name 필드는 scheme과 port를 포함해 인가된다.
      - http:monitoring-prometheus:9090
      - http:cantaloupe-finops-pushgateway:9091
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audio-finops-monitoring-proxy
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: audio-finops-load-runner
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: audio-finops-monitoring-proxy
