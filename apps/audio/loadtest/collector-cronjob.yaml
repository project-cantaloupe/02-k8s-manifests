apiVersion: batch/v1
kind: CronJob
metadata:
  name: audio-finops-result-collector
  namespace: monitoring
  labels:
    app: audio-finops-result-collector
    experiment: audio-finops
spec:
  # CloudWatch SQS의 120초 지연 뒤에도 5분 Guard를 확보하고, Due가 된 Run을
  # 한 시간씩 기다리지 않도록 실험 시간대에는 10분마다 재수집한다.
  schedule: "*/10 14-23 * * 2-5"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: audio-finops-result-collector
        experiment: audio-finops
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: audio-finops-result-collector
            experiment: audio-finops
        spec:
          serviceAccountName: audio-finops-result-collector
          restartPolicy: Never
          # `platform: aws` 라벨은 **설명일 뿐 스케줄링에 영향이 없다.**
          # 이미지가 ECR 로 바뀌는 순간 이 nodeSelector 가 필수가 된다 —
          # GCP·온프렘 노드는 ECR pull 권한이 없어 ImagePullBackOff 로 죽고,
          # CronJob 이라 그 사실은 **다음 스케줄에야** 드러난다.
          nodeSelector:
            platform: aws
          containers:
            - name: collector
              image: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/mirror-python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: [python, /opt/collector/collector.py]
              env:
                - name: EXPERIMENT_END_DATE
                  value: "2026-08-14"
                - name: COLLECTION_DELAY_SECONDS
                  value: "300"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: collector
                  mountPath: /opt/collector
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: collector
              configMap:
                name: audio-finops-result-collector
            - name: tmp
              emptyDir: {}
