apiVersion: batch/v1
kind: CronJob
metadata:
  name: audio-finops-result-collector
  namespace: monitoring
  labels:
    app: audio-finops-result-collector
    experiment: audio-finops
spec:
  # CloudWatch SQS의 120초 지연 뒤에도 5분 Guard를 확보하고, Due가 된 Run을
  # 한 시간씩 기다리지 않도록 실험 시간대에는 10분마다 재수집한다.
  schedule: "*/10 14-23 * * 2-5"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: audio-finops-result-collector
        experiment: audio-finops
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: audio-finops-result-collector
            experiment: audio-finops
        spec:
          serviceAccountName: audio-finops-result-collector
          restartPolicy: Never
          containers:
            - name: collector
              # **ECR 로 바꾸지 않는다.** 이 CronJob 은 monitoring 네임스페이스라
              # Kyverno ECR-only 범위(apps) 밖이고, kustomization 이
              # `platform: gcp / role: monitoring` 으로 보낸다. GCP 노드에는
              # ECR pull 권한이 없다 (worker_ecr_pull 은 AWS 노드 롤 전용).
              # 바꾸면 다음 스케줄에 ImagePullBackOff 로만 드러난다.
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: [python, /opt/collector/collector.py]
              env:
                - name: EXPERIMENT_END_DATE
                  value: "2026-08-14"
                - name: COLLECTION_DELAY_SECONDS
                  value: "300"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: collector
                  mountPath: /opt/collector
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: collector
              configMap:
                name: audio-finops-result-collector
            - name: tmp
              emptyDir: {}
