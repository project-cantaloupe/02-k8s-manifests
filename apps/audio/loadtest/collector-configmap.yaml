apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-finops-result-collector
  namespace: monitoring
data:
  collector.py: |
    import datetime as dt
    import json
    import os
    import ssl
    import urllib.parse
    import urllib.request

    KUBE = "https://kubernetes.default.svc"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    # Prometheus is served with --web.route-prefix=/prometheus.
    PROM = "http://monitoring-prometheus.monitoring.svc:9090/prometheus"
    PUSH = "http://cantaloupe-finops-pushgateway.monitoring.svc:9091"
    END_DATE = os.getenv("EXPERIMENT_END_DATE", "2026-08-14")

    def kube_get(path):
        with open(SA + "/token", encoding="utf-8") as handle:
            token = handle.read().strip()
        request = urllib.request.Request(KUBE + path, headers={"Authorization": "Bearer " + token})
        context = ssl.create_default_context(cafile=SA + "/ca.crt")
        with urllib.request.urlopen(request, context=context, timeout=20) as response:
            return response.read().decode()

    def prom(query, when):
        url = PROM + "/api/v1/query?" + urllib.parse.urlencode({"query": query, "time": when})
        with urllib.request.urlopen(url, timeout=20) as response:
            payload = json.load(response)
        values = payload.get("data", {}).get("result", [])
        return float(values[0]["value"][1]) if values else None

    def esc(value):
        return str(value).replace("\\", "\\\\").replace('"', '\\"')

    def push(result, metrics):
        labels = f'profile="{esc(result["profile"])}",phase="{esc(result["phase"])}"'
        ready = result.get("status_counts", {}).get("READY", 0)
        failed = result.get("upload_errors", 0) + sum(value for key, value in result.get("status_counts", {}).items() if key != "READY")
        valid = 1 if failed == 0 and metrics.get("deployment_changed") == 0 else 0
        samples = {
            "cantaloupe_audio_finops_run_info": valid,
            "cantaloupe_audio_finops_run_requested": result["requested"],
            "cantaloupe_audio_finops_run_submitted": result["submitted"],
            "cantaloupe_audio_finops_run_ready": ready,
            "cantaloupe_audio_finops_run_failed": failed,
        }
        samples.update({"cantaloupe_audio_finops_run_" + key: value for key, value in metrics.items() if value is not None})
        body = "\n".join(f'{name}{{{labels}}} {value}' for name, value in samples.items()) + "\n"
        path = "/metrics/job/audio_finops_experiment/run_id/" + urllib.parse.quote(result["run_id"], safe="")
        request = urllib.request.Request(PUSH + path, data=body.encode(), method="PUT", headers={"Content-Type": "text/plain; version=0.0.4"})
        with urllib.request.urlopen(request, timeout=20) as response:
            if response.status // 100 != 2:
                raise RuntimeError(f"Pushgateway HTTP {response.status}")

    def collect(result):
        start = dt.datetime.fromisoformat(result["started_at"])
        finish = dt.datetime.fromisoformat(result["finished_at"])
        evaluate = finish + dt.timedelta(seconds=90)
        window = max(180, int((finish - start).total_seconds()) + 180)
        step_range = f"[{window}s:30s]"
        generation_query = 'sum(kube_deployment_status_observed_generation{namespace="apps",deployment=~"audio-api|audio-transcode|audio-transcode-burst"})'
        before = prom(generation_query, start.timestamp())
        after = prom(generation_query, evaluate.timestamp())
        return {
            "cpu_p95_cores": prom('quantile_over_time(0.95, (sum(rate(container_cpu_usage_seconds_total{namespace="apps",container="transcode"}[1m])))' + step_range + ')', evaluate.timestamp()),
            "memory_p95_bytes": prom('quantile_over_time(0.95, (sum(container_memory_working_set_bytes{namespace="apps",container="transcode"}))' + step_range + ')', evaluate.timestamp()),
            "queue_max": prom('max_over_time((max(cantaloupe:aws_sqs_messages_visible{queue_name="cntlp-aws-queue-transcode"}))' + step_range + ')', evaluate.timestamp()),
            "transcode_completed": prom(f'sum(increase(audio_transcode_completed_total{{namespace="apps"}}[{window}s]))', evaluate.timestamp()),
            "transcode_failed": prom(f'sum(increase(audio_transcode_failed_total{{namespace="apps"}}[{window}s]))', evaluate.timestamp()),
            "worker_cost_usd": prom(f'sum(sum_over_time(cantaloupe:container_allocated_cost_per_hour{{namespace="apps",container="transcode"}}[{window}s:1m])) / 60', evaluate.timestamp()),
            "worker_request_cpu_cores": prom('max(kube_pod_container_resource_requests{namespace="apps",container="transcode",resource="cpu",unit="core"})', evaluate.timestamp()),
            "worker_request_memory_bytes": prom('max(kube_pod_container_resource_requests{namespace="apps",container="transcode",resource="memory",unit="byte"})', evaluate.timestamp()),
            "elapsed_seconds": (finish - start).total_seconds(),
            "deployment_generation_before": before,
            "deployment_generation_after": after,
            "deployment_changed": 1 if before is None or after is None or before != after else 0,
        }

    def main():
        today = dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
        if today > END_DATE:
            print("Experiment ended; no collection required")
            return
        jobs = json.loads(kube_get("/apis/batch/v1/namespaces/apps/jobs?labelSelector=experiment%3Daudio-finops")).get("items", [])
        pushed = 0
        for job in jobs:
            if job.get("status", {}).get("succeeded") != 1:
                continue
            name = job["metadata"]["name"]
            pods = json.loads(kube_get("/api/v1/namespaces/apps/pods?labelSelector=" + urllib.parse.quote("job-name=" + name))).get("items", [])
            if not pods:
                continue
            log = kube_get(f'/api/v1/namespaces/apps/pods/{pods[0]["metadata"]["name"]}/log')
            lines = [line for line in log.splitlines() if line.startswith("FINOPS_RUN_RESULT=")]
            if not lines:
                continue
            result = json.loads(lines[-1].split("=", 1)[1])
            push(result, collect(result))
            pushed += 1
        print(f"Collected {pushed} completed audio FinOps run(s)")

    if __name__ == "__main__":
        main()

