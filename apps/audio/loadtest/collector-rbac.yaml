apiVersion: v1
kind: ServiceAccount
metadata:
  name: audio-finops-result-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audio-finops-result-reader
  namespace: apps
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audio-finops-result-reader
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: audio-finops-result-collector
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: audio-finops-result-reader

