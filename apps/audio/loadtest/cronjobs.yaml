apiVersion: batch/v1
kind: CronJob
metadata:
  name: audio-finops-steady
  namespace: apps
  labels:
    app: audio-finops-load-runner
    area: apps
    platform: aws
    experiment: audio-finops
spec:
  schedule: "0 14 * * 2-4"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 18000
      template:
        metadata:
          labels:
            app: audio-finops-load-runner
            area: apps
            platform: aws
            experiment: audio-finops
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: default
          restartPolicy: Never
          # `platform: aws` 라벨은 **설명일 뿐 스케줄링에 영향이 없다.**
          # 이미지가 ECR 로 바뀌는 순간 이 nodeSelector 가 필수가 된다 —
          # GCP·온프렘 노드는 ECR pull 권한이 없어 ImagePullBackOff 로 죽고,
          # CronJob 이라 그 사실은 **다음 스케줄에야** 드러난다.
          nodeSelector:
            platform: aws
          containers:
            - name: runner
              image: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/mirror-python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: [python, /opt/loadtest/runner.py]
              env:
                - name: LOAD_PROFILE
                  value: steady
                - name: EXPERIMENT_PHASE
                  value: baseline
                - name: LOAD_COUNT
                  value: "48"
                - name: LOAD_CONCURRENCY
                  value: "1"
                - name: LOAD_INTERVAL_SECONDS
                  value: "300"
                - name: AUDIO_VISIBILITY
                  value: public
                - name: EXPERIMENT_END_DATE
                  value: "2026-08-14"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
              volumeMounts:
                - name: runner
                  mountPath: /opt/loadtest
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: runner
              configMap:
                name: audio-finops-load-runner
            - name: tmp
              emptyDir: {}
---
