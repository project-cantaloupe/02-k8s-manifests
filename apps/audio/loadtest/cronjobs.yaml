apiVersion: batch/v1
kind: CronJob
metadata:
  name: audio-finops-steady
  namespace: apps
  labels:
    app: audio-finops-load-runner
    area: apps
    platform: aws
    experiment: audio-finops
spec:
  schedule: "0 14 * * 2-4"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 18000
      template:
        metadata:
          labels:
            app: audio-finops-load-runner
            area: apps
            platform: aws
            experiment: audio-finops
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: default
          restartPolicy: Never
          containers:
            - name: runner
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: [python, /opt/loadtest/runner.py]
              env:
                - name: LOAD_PROFILE
                  value: steady
                - name: LOAD_COUNT
                  value: "48"
                - name: LOAD_CONCURRENCY
                  value: "1"
                - name: LOAD_INTERVAL_SECONDS
                  value: "300"
                - name: EXPERIMENT_END_DATE
                  value: "2026-08-14"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
              volumeMounts:
                - name: runner
                  mountPath: /opt/loadtest
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: runner
              configMap:
                name: audio-finops-load-runner
            - name: tmp
              emptyDir: {}
---
