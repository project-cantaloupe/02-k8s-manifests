# Keycloak OIDC 검증 전까지 공개 진입점은 조회 요청만 받는다. 이 정책은
# audio-ingress Envoy Gateway에 적용되므로 ambient waypoint 없이도 L7 메서드를
# 검사한다. 내부 Service 호출과 Worker 처리는 이 Gateway를 지나지 않는다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: audio-public-readonly
  namespace: audio-ingress
spec:
  selector:
    matchLabels:
      app: audio-ingress
  action: ALLOW
  rules:
    - to:
        - operation:
            methods:
              - GET
              - HEAD
