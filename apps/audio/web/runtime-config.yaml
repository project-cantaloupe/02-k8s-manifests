# OIDC Issuer와 Client ID는 브라우저에 전달되는 공개 설정이다. API의 인증
# 모드와 같은 GitOps 변경으로 전환해 Web 이미지와 API 설정의 시점 차이를 없앤다.
# 비밀번호, Client Secret, Token은 이 파일에 넣지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-web-runtime-config
  namespace: apps
data:
  runtime-config.js: |
    window.__CNTLP_RUNTIME_CONFIG__ = Object.freeze({
      authMode: "oidc",
      oidcIssuerUrl: "https://auth.echoprism.cloud/realms/cantaloupe",
      oidcClientId: "audio-web",
      oidcRedirectUri: "https://audio.echoprism.cloud/auth/callback",
      oidcPostLogoutRedirectUri: "https://audio.echoprism.cloud/",
      oidcScope: "openid profile email",
    });
