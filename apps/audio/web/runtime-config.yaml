# Public Audio 사용자용 인증 경계가 준비되기 전까지 로그인·가입은 닫는다.
# Web은 이 모드에서도 제한된 익명 Public Upload를 제공하지만 개발용 Subject나
# 브라우저에 노출되는 서비스 자격 증명은 만들지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-web-runtime-config
  namespace: apps
data:
  runtime-config.js: |
    window.__CNTLP_RUNTIME_CONFIG__ = Object.freeze({
      authMode: "disabled",
    });
