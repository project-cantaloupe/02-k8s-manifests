# Public Audio 사용자용 인증 경계가 준비되기 전까지 로그인과 업로드를 닫는다.
# API의 AUTH_MODE와 같은 GitOps 변경으로 전환해 Web이 존재하지 않는 로그인
# 경로를 노출하거나 개발용 Subject를 만드는 상태를 막는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-web-runtime-config
  namespace: apps
data:
  runtime-config.js: |
    window.__CNTLP_RUNTIME_CONFIG__ = Object.freeze({
      authMode: "disabled",
    });
