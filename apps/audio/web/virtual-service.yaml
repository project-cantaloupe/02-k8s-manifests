# Gateway로 들어온 모든 경로를 audio-web으로 보낸다. audio-api가 추가되면
# /v1 접두사를 API로 먼저 분기하고 나머지를 Web이 받는 형태가 된다.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: audio-web
  namespace: apps
spec:
  hosts:
    - "*"
  gateways:
    - audio-ingress/audio-gateway
  http:
    - route:
        - destination:
            host: audio-web.apps.svc.cluster.local
            port:
              number: 80
