apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Jenkinsfile이 `kustomize edit set image audio-web=<registry>/audio-web:<tag>`로
# 이 항목을 갱신한다. 이미지 이름 audio-web은 그 규약에 맞춘 자리표시자다.
images:
  - name: audio-web
    newName: ghcr.io/project-cantaloupe/audio-web
    newTag: dev
