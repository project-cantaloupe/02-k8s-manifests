apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - runtime-config.yaml
  - deployment.yaml
  - service.yaml

# 03-app-audio의 GitHub Actions가 이미지를 Harbor에 Push하고 Trivy 검사를 수행한다.
# 검사를 통과한 이미지를 Amazon ECR로 승격한 뒤, 이 ECR 이미지의 태그를
# 애플리케이션 커밋 SHA로 갱신한다.
images:
  - name: audio-web
    newName: 764553891928.dkr.ecr.ap-northeast-2.amazonaws.com/app-audio-web
    newTag: 6a2ddc17580b3ffc50505fd0a401ef5cd8b570eb
