apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-harbor-v2-trivy-0
  namespace: harbor-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: harbor-v2-trivy-pv
  resources:
    requests:
      # This statically bound PVC was originally created with a 5Gi request.
      # The backing hostPath PV still provides 10Gi; raising this request would
      # be treated as an unsupported resize because no StorageClass provisions it.
      storage: 5Gi
---
# hostPath DirectoryOrCreate makes directories root-owned. Harbor components run
# unprivileged, so initialize ownership once before the Helm Application starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-v2-storage-permissions
  namespace: harbor-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-v2-storage-permissions
    spec:
      restartPolicy: Never
      nodeSelector:
        platform: onp
        role: devops
      containers:
        - name: permissions
          image: busybox:1.36
          command: [sh, -ec]
          args:
            - |
              # Only the volume roots need initialization. Recursing through a
              # live database/registry can race with files created by Harbor.
              chown 10000:10000 /storage/registry /storage/jobservice /storage/trivy
              chown 999:999 /storage/database /storage/redis
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: registry
              mountPath: /storage/registry
            - name: jobservice
              mountPath: /storage/jobservice
            - name: database
              mountPath: /storage/database
            - name: redis
              mountPath: /storage/redis
            - name: trivy
              mountPath: /storage/trivy
      volumes:
        - name: registry
          persistentVolumeClaim:
            claimName: harbor-v2-registry
        - name: jobservice
          persistentVolumeClaim:
            claimName: harbor-v2-jobservice
        - name: database
          persistentVolumeClaim:
            claimName: harbor-v2-database
        - name: redis
          persistentVolumeClaim:
            claimName: harbor-v2-redis
        - name: trivy
          persistentVolumeClaim:
            claimName: data-harbor-v2-trivy-0

