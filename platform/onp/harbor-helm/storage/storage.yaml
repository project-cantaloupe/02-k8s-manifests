apiVersion: v1
kind: PersistentVolume
metadata:
  name: harbor-v2-registry-pv
spec:
  capacity:
    storage: 30Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/harbor-v2/registry
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cntlp-onp-wk-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-v2-registry
  namespace: harbor-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: harbor-v2-registry-pv
  resources:
    requests:
      storage: 30Gi
---
