apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: devops
spec:
  hosts:
  - "*"
  gateways:
  - istio-ingress/istio-gateway  # 👈 여기를 수정합니다!
  http:
  - match:
    - uri:
        prefix: /api/
    - uri:
        prefix: /v2/
    - uri:
        prefix: /service/
    - uri:
        prefix: /c/
    route:
    - destination:
        host: harbor.devops.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: harbor-portal.devops.svc.cluster.local
        port:
          number: 80
