apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: devops
spec:
  hosts:
  - "*"
  gateways:
  - istio-ingress/istio-gateway
  http:
  # 1. API 및 이미지 레지스트리 백엔드 요청 -> harbor 통합 서비스
  - match:
    - uri:
        prefix: /api/
    - uri:
        prefix: /v2/
    - uri:
        prefix: /service/
    - uri:
        prefix: /c/
    route:
    - destination:
        host: harbor.devops.svc.cluster.local
        port:
          number: 80

  # 2. UI 화면 및 정적 파일(JS, CSS, HTML) 요청 -> harbor-portal 서비스
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: harbor-portal.devops.svc.cluster.local
        port:
          number: 80
