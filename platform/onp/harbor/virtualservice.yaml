apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: devops
spec:
  hosts:
  - "*"
  gateways:
  - istio-ingress/istio-gateway
  http:
  - match:
    - uri:
        prefix: /harbor
    rewrite:
      uri: /
    route:
    - destination:
        host: harbor-portal
        port:
          number: 80
