apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: devops
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/ingressgateway
  http:
  # 1. Harbor API 및 Registry 라우팅 (우선순위 높음)
  - match:
    - uri:
        prefix: /api/
    - uri:
        prefix: /v2/
    - uri:
        prefix: /service/
    - uri:
        prefix: /c/
    route:
    - destination:
        host: harbor.devops.svc.cluster.local
        port:
          number: 80

  # 2. Harbor UI Portal (루트 경로 전체 매핑)
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: harbor-portal.devops.svc.cluster.local
        port:
          number: 80
