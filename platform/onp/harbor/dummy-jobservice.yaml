apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-jobservice
  namespace: devops
  labels:
    app: harbor-jobservice
    area: devops
    platform: onp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-jobservice
  template:
    metadata:
      labels:
        app: harbor-jobservice
        area: devops
        platform: onp
    spec:
      nodeSelector:
        platform: onp
        role: devops
      containers:
      - name: dummy-jobservice
        image: nginx:alpine
        ports:
        - containerPort: 8080
        command:
        - /bin/sh
        - -c
        - |
          cat << 'CONF' > /etc/nginx/conf.d/default.conf
          server {
              listen 8080;
              default_type application/json;

              # 핵심: 정의되지 않은 모든 요청(Catch-All)에 기본 JSON 객체 응답
              location / {
                  return 200 '{"job_id":"dummy-job-id-0000","status":"success"}';
              }

              # Config & Stats
              location /api/v1/config {
                  return 200 '{"protocol":"http","port":8080}';
              }
              location /api/v1/stats {
                  return 200 '[]';
              }

              # Queue 목록 조회
              location /api/v2.0/jobservice/queues {
                  return 200 '[{"job_type":"default","count":0,"latency":0,"paused":false}]';
              }

              # Job 제출 API
              location /api/v1/jobs {
                  return 202 '{"job_id":"dummy-job-id-0000"}';
              }
              location /api/v2.0/jobs {
                  return 202 '{"job_id":"dummy-job-id-0000"}';
              }
          }
          CONF
          exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-jobservice
  namespace: devops
  labels:
    app: harbor-jobservice
    area: devops
    platform: onp
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: harbor-jobservice
