apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-jobservice
  namespace: devops
  labels:
    app: harbor-jobservice
    area: devops
    platform: onp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-jobservice
  template:
    metadata:
      labels:
        app: harbor-jobservice
        area: devops
        platform: onp
    spec:
      nodeSelector:
        platform: onp
        role: devops
      containers:
      - name: dummy-jobservice
        image: nginx:alpine
        ports:
        - containerPort: 8080
        command:
        - /bin/sh
        - -c
        - |
          cat << 'CONF' > /etc/nginx/conf.d/default.conf
          server {
              listen 8080;
              default_type application/json;

              location / {
                  return 200 '[]';
              }
              location /api/v1/config {
                  return 200 '{"protocol":"http","port":8080}';
              }
              location /api/v1/stats {
                  return 200 '[]';
              }
              location /api/v2.0/jobservice/queues {
                  return 200 '[{"job_type":"default","count":0,"latency":0,"paused":false}]';
              }
          }
          CONF
          exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-jobservice
  namespace: devops
  labels:
    app: harbor-jobservice
    area: devops
    platform: onp
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: harbor-jobservice
