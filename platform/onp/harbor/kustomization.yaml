apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - registry-config.yaml
  - registry.yaml
  - harbor-core-config.yaml
  - harbor-components.yaml
  - harbor-service.yaml
  - portal.yaml

patches:
  # -----------------------------------------------------------------
  # 기존 Service/harbor 대상 패치는 삭제했습니다.
  # (31432 포트는 harbor-proxy-nodeport 서비스가 단독으로 처리 중)
  # -----------------------------------------------------------------

  # 1. Harbor Core 패치 (외부 접근 Endpoint 및 필수 환경변수 적용)
  - target:
      kind: Deployment
      name: harbor-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-core
      spec:
        template:
          spec:
            containers:
              - name: harbor-core
                env:
                  - name: EXT_ENDPOINT
                    value: "http://cntlp-onp-wk-01.tail270b85.ts.net:31432"
                  - name: HARBOR_URL
                    value: "http://cntlp-onp-wk-01.tail270b85.ts.net:31432"
                  - name: CONFIG_PATH
                    value: "/etc/harbor/core/app.conf"
                  - name: PORT
                    value: "8080"
                  - name: CACHE_TYPE
                    value: "redis"
                  - name: REDIS_URL
                    value: "redis://harbor-redis:6379/0"
                  - name: _REDIS_URL_CORE
                    value: "redis://harbor-redis:6379/0"
                  - name: POSTGRESQL_HOST
                    value: "postgresql"
                  - name: POSTGRESQL_PORT
                    value: "5432"
                  - name: POSTGRESQL_PASSWORD
                    value: "root123"
                  - name: POSTGRESQL_DATABASE
                    value: "registry"
                  - name: REGISTRY_URL
                    value: "http://harbor-registry:5000"
                  - name: CORE_SECRET
                    value: "HARBOR_CORE_SECRET_123456"
                  - name: JOBSERVICE_SECRET
                    value: "HARBOR_JOBSERVICE_SECRET_123456"
                  - name: CSRF_KEY
                    value: "12345678901234567890123456789012"

  # 2. Harbor Registry 패치 (harbor-data 볼륨 포함)
  - target:
      kind: Deployment
      name: harbor-registry
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-registry
      spec:
        template:
          spec:
            nodeSelector:
              platform: onp
              role: devops
            containers:
              - name: registry
                volumeMounts:
                  - name: registry-config
                    mountPath: /etc/registry/config.yml
                    subPath: config.yml
            volumes:
              - name: registry-config
                configMap:
                  name: harbor-registry-config
              - name: harbor-data
                persistentVolumeClaim:
                  claimName: harbor-data-pvc
