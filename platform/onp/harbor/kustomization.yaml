apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - registry-config.yaml
  - registry.yaml
  - harbor-core-config.yaml
  - harbor-components.yaml
  - harbor-service.yaml
  - portal.yaml
  - harbor-proxy.yaml

patches:
  # 1. 기존 harbor Service 패치 (NodePort 31432 제거 -> ClusterIP로 변경하여 충돌 방지)
  - target:
      kind: Service
      name: harbor
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: harbor
      spec:
        type: ClusterIP
        selector:
          app: harbor-portal
        ports:
          - name: http
            port: 80
            targetPort: 80

  # 2. Harbor Core 패치 (외부 접근 Endpoint 및 필수 환경변수 적용)
  - target:
      kind: Deployment
      name: harbor-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-core
      spec:
        template:
          spec:
            containers:
              - name: harbor-core
                env:
                  - name: EXT_ENDPOINT
                    value: "https://cntlp-onp-wk-01.tail270b85.ts.net"
                  - name: HARBOR_URL
                    value: "https://cntlp-onp-wk-01.tail270b85.ts.net"
                  - name: CONFIG_PATH
                    value: "/etc/harbor/core/app.conf"
                  - name: PORT
                    value: "8080"
                  - name: CACHE_TYPE
                    value: "redis"
                  - name: REDIS_URL
                    value: "redis://harbor-redis:6379/0"
                  - name: _REDIS_URL_CORE
                    value: "redis://harbor-redis:6379/0"
                  - name: POSTGRESQL_HOST
                    value: "postgresql"
                  - name: POSTGRESQL_PORT
                    value: "5432"
                  - name: POSTGRESQL_PASSWORD
                    value: "root123"
                  - name: POSTGRESQL_DATABASE
                    value: "registry"
                  - name: REGISTRY_URL
                    value: "http://harbor-registry:5000"
                  - name: CORE_SECRET
                    value: "HARBOR_CORE_SECRET_123456"
                  - name: JOBSERVICE_SECRET
                    value: "HARBOR_JOBSERVICE_SECRET_123456"
                  - name: CSRF_KEY
                    value: "12345678901234567890123456789012"

  # 3. Harbor Registry 패치 (harbor-data 볼륨 포함)
  - target:
      kind: Deployment
      name: harbor-registry
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-registry
      spec:
        template:
          spec:
            nodeSelector:
              platform: onp
              role: devops
            containers:
              - name: registry
                volumeMounts:
                  - name: registry-config
                    mountPath: /etc/registry/config.yml
                    subPath: config.yml
            volumes:
              - name: registry-config
                configMap:
                  name: harbor-registry-config
              - name: harbor-data
                persistentVolumeClaim:
                  claimName: harbor-data-pvc
