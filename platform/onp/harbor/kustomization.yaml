apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
  - harbor-service.yaml
  - harbor-components.yaml
  - harbor-core-config.yaml
  - redis.yaml
  - postgres.yaml
  - registry-config.yaml
  - portal.yaml
  - registry.yaml
  - pvc.yaml

patches:
  # 1. Harbor Service 패치 (NodePort 31432 유지 및 Portal로 라우팅)
  - target:
      kind: Service
      name: harbor
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: harbor
      spec:
        type: NodePort
        selector:
          app: harbor-portal
        ports:
          - name: http
            port: 80
            targetPort: 80
            nodePort: 31432

  # 2. Harbor Core 패치 (외부 접근 Endpoint 및 필수 환경변수 적용)
  - target:
      kind: Deployment
      name: harbor-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-core
      spec:
        template:
          spec:
            containers:
              - name: harbor-core
                env:
                  - name: EXT_ENDPOINT
                    value: "https://cntlp-onp-wk-01.tail270b85.ts.net"
                  - name: HARBOR_URL
                    value: "https://cntlp-onp-wk-01.tail270b85.ts.net"
                  - name: CONFIG_PATH
                    value: "/etc/harbor/core/app.conf"
                  - name: PORT
                    value: "8080"
                  - name: CACHE_TYPE
                    value: "redis"
                  - name: REDIS_URL
                    value: "redis://harbor-redis:6379/0"
                  - name: _REDIS_URL_CORE
                    value: "redis://harbor-redis:6379/0"
                  - name: POSTGRESQL_HOST
                    value: "postgresql"
                  - name: POSTGRESQL_PORT
                    value: "5432"
                  - name: POSTGRESQL_PASSWORD
                    value: "root123"
                  - name: POSTGRESQL_DATABASE
                    value: "registry"
                  - name: REGISTRY_URL
                    value: "http://harbor-registry:5000"
                  - name: CORE_SECRET
                    value: "HARBOR_CORE_SECRET_123456"
                  - name: JOBSERVICE_SECRET
                    value: "HARBOR_JOBSERVICE_SECRET_123456"
                  - name: CSRF_KEY
                    value: "12345678901234567890123456789012"
