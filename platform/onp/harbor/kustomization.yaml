apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - redis.yaml

patches:
  - target:
      kind: Deployment
      name: harbor-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-core
      spec:
        template:
          spec:
            containers:
              - name: harbor-core
                env:
                  - name: CONFIG_PATH
                    value: "/etc/harbor/core/app.conf"
                  - name: PORT
                    value: "8080"
                  - name: CACHE_TYPE
                    value: "redis"
                  - name: REDIS_URL
                    value: "redis://harbor-redis:6379/0"
                  - name: _REDIS_URL_CORE
                    value: "redis://harbor-redis:6379/0"
                volumeMounts:
                  - name: config-volume
                    mountPath: /etc/harbor/core/app.conf
                    subPath: app.conf
            volumes:
              - name: config-volume
                configMap:
                  name: harbor-core-config
