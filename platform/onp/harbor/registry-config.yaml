apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registry-config
  namespace: devops
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    http:
      addr: :5000
      relativeurls: true
      drain_timeout: 60s
      secret: "HARBOR_REGISTRY_SECRET_123456"
      debug:
        addr: :5001
    auth:
      token:
        issuer: harbor-token-issuer
        realm: https://cntlp-onp-wk-01.tail270b85.ts.net/service/token
        rootcertbundle: /etc/pki/tls/certs/ca-bundle.crt
        service: harbor-registry
    storage:
      cache:
        layerinfo: redis
      filesystem:
        rootdirectory: /storage
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
    redis:
      addr: harbor-redis:6379
      db: 1
