apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registry-config
  namespace: devops
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    http:
      addr: :5000
      relativeurls: true   # <--- 이 항목을 true로 추가/변경해 주세요!
      secret: a-secret-value
      debug:
        addr: :5001
    auth:
      htpasswd:
        realm: basic-realm
        path: /etc/registry/htpasswd
      token:
        issuer: harbor-token-issuer
        realm: https://cntlp-onp-wk-01.tail270b85.ts.net/service/token # <--- https:// 외부주소로 변경
        rootcertbundle: /etc/registry/root.crt
        service: harbor-registry
    storage:
      cache:
        layerinfo: redis
      filesystem:
        rootdirectory: /storage
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
    http:
      addr: :5000
      drain_timeout: 60s
      secret: "HARBOR_REGISTRY_SECRET_123456"
    redis:
      addr: harbor-redis:6379
      db: 1
