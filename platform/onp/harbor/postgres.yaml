apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:13-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "root123"
            - name: POSTGRES_DB
              value: "registry"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: devops
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgresql
