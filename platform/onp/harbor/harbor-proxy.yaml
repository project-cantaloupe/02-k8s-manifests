apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-proxy-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      client_max_body_size 0; # 대용량 도커 레이어 업로드 허용
      
      upstream portal { server harbor-portal.devops.svc.cluster.local:80; }
      upstream core { server harbor-core.devops.svc.cluster.local:8080; }

      server {
        listen 80;
        
        location / {
          proxy_pass http://portal;
        }
        location /api/ {
          proxy_pass http://core;
        }
        location /v2/ {
          proxy_pass http://core;
        }
        location /service/ {
          proxy_pass http://core;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-proxy
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-proxy
  template:
    metadata:
      labels:
        app: harbor-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: harbor-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-proxy-nodeport
  namespace: devops
spec:
  type: NodePort
  selector:
    app: harbor-proxy
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31432  # 기존에 쓰시던 NodePort 그대로 활용
