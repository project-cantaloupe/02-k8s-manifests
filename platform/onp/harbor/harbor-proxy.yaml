apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-proxy-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        client_max_body_size 0;

        server {
            listen 80;

            # Reverse Proxy 필수 헤더 및 Authorization 패스스루
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # 1. UI (Portal) 요청
            location / {
                proxy_pass http://harbor-portal:80;
            }

            # 2. Harbor Core API
            location /api/ {
                proxy_pass http://harbor-core:8080/api/;
            }

            # 3. Docker CLI 인증 토큰 발급 (harbor-core 포워딩)
            location /service/ {
                proxy_pass http://harbor-core:8080/service/;
            }

            # 4. Registry v2 요청 (✨ 핵심 수정: harbor-core -> harbor-registry:5000 으로 변경)
            location /v2/ {
                proxy_pass http://harbor-registry:5000/v2/;
            }

            # 5. 기타 컨트롤러
            location /c/ {
                proxy_pass http://harbor-core:8080/c/;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-proxy
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-proxy
  template:
    metadata:
      labels:
        app: harbor-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: harbor-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-proxy-nodeport
  namespace: devops
spec:
  type: NodePort
  selector:
    app: harbor-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31432
