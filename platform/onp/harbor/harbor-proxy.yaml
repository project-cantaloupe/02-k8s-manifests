apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-proxy-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        client_max_body_size 0;

        server {
            listen 80;

            # Reverse Proxy 필수 헤더
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 31432;
            
            # Authorization 및 Docker API 헤더 패스스루
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # 1. UI (Portal) 요청
            location / {
                proxy_pass http://harbor-portal:80;
            }

            # 2. Harbor Core API
            location /api/ {
                proxy_pass http://harbor-core:8080/api/;
            }

            # 3. Docker CLI 인증 토큰 발급
            location /service/ {
                proxy_pass http://harbor-core:8080/service/;
            }

            # 4. Registry v2 요청 (Docker Registry v2 헤더 포함)
            location /v2/ {
                proxy_pass http://harbor-registry:5000/v2/;
                
                # ✨ Docker Registry v2 필수 응답 헤더 보장
                proxy_hide_header Header-Name;
                add_header Docker-Distribution-Api-Version "registry/2.0" always;
            }

            # 5. 기타 컨트롤러
            location /c/ {
                proxy_pass http://harbor-core:8080/c/;
            }
        }
    }
