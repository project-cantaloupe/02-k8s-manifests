apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-proxy-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;

        # 업로드 제한 해제 (Docker Push 대비)
        client_max_body_size 0;

        server {
            listen 80;

            # 프록시 필수 헤더 공통 설정
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CSRF 방지를 위한 Cookie/Header 처리
            proxy_cookie_path / "/; HTTPOnly; Secure";

            # UI 및 API 요청 -> harbor-core
            location / {
                proxy_pass http://harbor-core:8080;
            }

            # v2 API 요청 (Docker Registry)
            location /v2/ {
                proxy_pass http://harbor-core:8080/v2/;
            }
            
            # 서비스 API 요청
            location /api/ {
                proxy_pass http://harbor-core:8080/api/;
            }
            
            # 인증/토큰 요청
            location /service/ {
                proxy_pass http://harbor-core:8080/service/;
            }
        }
    }
