apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-proxy-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        client_max_body_size 0;

        server {
            listen 80;

            # Reverse Proxy 필수 기본 헤더
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✨ 핵심: Docker CLI 로그인용 Authorization 헤더 패스스루 명시
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # UI 요청
            location / {
                proxy_pass http://harbor-portal:80;
            }

            # Harbor Core / API 요청
            location /api/ {
                proxy_pass http://harbor-core:8080/api/;
            }

            # ✨ 핵심: Docker CLI 로그인 시 토큰 발급을 담당하는 핵심 엔드포인트
            location /service/ {
                proxy_pass http://harbor-core:8080/service/;
            }

            # Registry v2 요청 (Core로 전달하여 Token Challenge 처리)
            location /v2/ {
                proxy_pass http://harbor-core:8080/v2/;
            }

            # 기타 컨트롤러
            location /c/ {
                proxy_pass http://harbor-core:8080/c/;
            }
        }
    }
