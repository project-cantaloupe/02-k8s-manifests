apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-portal-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        sendfile on;
        keepalive_timeout 65;

        # 업스트림 백엔드 정의
        upstream core {
            server harbor-core:8080;
        }

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # 1. Harbor API 요청 포워딩
            location /api/ {
                proxy_pass http://core/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 2. Harbor 인증 및 로그인 요청 (/c/login 등) 포워딩
            location /c/ {
                proxy_pass http://core/c/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 3. Harbor v2 OCI/Docker Registry API 포워딩
            location /v2/ {
                proxy_pass http://core/v2/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 4. OIDC / OAuth 라우팅 (필요 시)
            location /service/ {
                proxy_pass http://core/service/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # 5. Angular SPA 정적 라우팅 (맨 마지막 위치)
            location / {
                try_files $uri $uri/ /index.html;
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
    }
---
# (Service 및 Deployment 부분은 작성해주신 기존 내용 그대로 유지)
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal
  namespace: devops
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: harbor-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
    spec:
      nodeSelector:
        kubernetes.io/hostname: cntlp-onp-wk-01
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.10.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: var-cache
              mountPath: /var/cache/nginx
            # 👇 Nginx 설정 마운트 추가
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: var-run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        # 👇 ConfigMap 볼륨 추가
        - name: config
          configMap:
            name: harbor-portal-config
