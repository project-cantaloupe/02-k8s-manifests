apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-portal-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        sendfile on;
        keepalive_timeout 65;

        upstream core {
            server harbor-core:8080;
        }

        upstream registry {
            server harbor-registry:5000;
        }

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # Reverse Proxy 필수 헤더 전달 (알림/인증 처리의 핵심)
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # 1. Harbor Core API
            location /api/ {
                proxy_pass http://core/api/;
            }

            # 2. 로그인 및 기타 제어
            location /c/ {
                proxy_pass http://core/c/;
            }

            # 3. 토큰 발급 및 Notification (✨ 뒤에 /service/ 를 정확히 붙여서 포워딩)
            location /service/ {
                proxy_pass http://core/service/;
            }

            # 4. Registry v2 (Docker Push/Pull)
            location /v2/ {
                proxy_pass http://registry/v2/;
                client_max_body_size 0;
                proxy_request_buffering off;
                proxy_buffering off;
                
                proxy_hide_header Header-Name;
                add_header Docker-Distribution-Api-Version "registry/2.0" always;
            }

            # 5. UI Portal
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal
  namespace: devops
spec:
  type: NodePort
  selector:
    app: harbor-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
    spec:
      nodeSelector:
        platform: onp
        role: devops
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.10.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: var-run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: config
          configMap:
            name: harbor-portal-config
