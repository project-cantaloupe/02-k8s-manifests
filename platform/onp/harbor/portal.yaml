apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-portal-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ /index.html;
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal
  namespace: devops
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: harbor-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
    spec:
      nodeSelector:
        platform: onp
        role: devops
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.10.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: var-run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: config
          configMap:
            name: harbor-portal-config
