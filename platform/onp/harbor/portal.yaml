apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-portal-config
  namespace: devops
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        sendfile on;
        keepalive_timeout 65;

        upstream core {
            server harbor-core:8080;
        }

        upstream registry {
            server harbor-registry:5000;
        }

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;
            index index.html;

            # Reverse Proxy 필수 기본 헤더
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # 1. API 요청
            location /api/ {
                proxy_pass http://core;
            }

            # 2. 로그인 및 인증 요청
            location /c/ {
                proxy_pass http://core;
            }

            # 3. 인증 서비스 토큰 요청
            location /service/ {
                proxy_pass http://core;
            }

            # 4. Registry v2 요청 (✨ 핵심: registry -> core 로 연결하여 DB 이벤트 처리)
            location /v2/ {
                proxy_pass http://core;
                client_max_body_size 0;
                proxy_request_buffering off;
                proxy_buffering off;
            }

            # 5. SPA 정적 라우팅 (웹 UI)
            location / {
                try_files $uri $uri/ /index.html;
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal
  namespace: devops
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: harbor-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
    spec:
      nodeSelector:
        platform: onp
        role: devops
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.10.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: var-run
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: config
          configMap:
            name: harbor-portal-config
