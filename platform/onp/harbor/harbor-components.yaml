apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-core
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-core
  template:
    metadata:
      labels:
        app: harbor-core
    spec:
      containers:
        - name: harbor-core
          image: goharbor/harbor-core:v2.10.0
          env:
            - name: POSTGRESQL_HOST
              value: "postgresql"
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_PASSWORD
              value: "root123"
            - name: POSTGRESQL_DATABASE
              value: "registry"
            - name: CACHE_TYPE
              value: "redis"
            - name: REDIS_URL
              value: "redis://harbor-redis:6379/0"
            - name: PORT
              value: "8080"
            - name: CONFIG_PATH
              value: "/etc/harbor/core/app.conf"
            # ✨ [핵심 해결 1] Registry - Core 연동 통신 주소
            - name: REGISTRY_URL
              value: "http://harbor-registry:5000"
            # ✨ [핵심 해결 2] Registry 알림 인증용 Secret (registry-config.yaml의 secret과 일치)
            - name: CORE_SECRET
              value: "HARBOR_REGISTRY_SECRET_123456"
            - name: JOBSERVICE_SECRET
              value: "HARBOR_REGISTRY_SECRET_123456"
            - name: CSRF_KEY
              value: "12345678901234567890123456789012"
            - name: EXT_ENDPOINT
              value: "http://cntlp-onp-wk-01.tail270b85.ts.net:31432"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: harbor-data
              mountPath: /storage
            - name: config
              mountPath: /etc/harbor/core/app.conf
              subPath: app.conf
      volumes:
        - name: harbor-data
          persistentVolumeClaim:
            claimName: harbor-data-pvc
        - name: config
          configMap:
            name: harbor-core-config
