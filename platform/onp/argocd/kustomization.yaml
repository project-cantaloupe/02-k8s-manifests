  # 그룹 하나가 곧 역할이다. 사람마다 권한을 주지 않는다.
  #
  # ── ⚠️ `scopes` 를 명시한다 ─────────────────────────────────
  #
  # 기본값은 `[groups, sub]` 라, groups 매칭에 실패하면 **`sub`(UUID)로
  # 폴백한다.** 그러면 `g, <uuid>, role:admin` 같은 규칙을 쓰게 되고
  # 사람이 바뀔 때마다 UUID 를 옮겨 적게 된다. groups 만 본다.
  #
  # ── ⚠️ `policy.default` 가 인증된 전원에게 걸린다 ──────────
  #
  # 그룹에 없는 사용자도 readonly 를 받는다. `CONSTRAINTS.md` 의
  # "읽기는 system:authenticated 에 준다"와 같은 결이다 — realm 에
  # 들어온 것 자체가 이미 팀원이라는 뜻이라서다.
  # **realm 가입을 열면(registration_allowed) 이 줄이 위험해진다.**
  # 지금은 닫혀 있다 → terraform/keycloak/realm.tf
  - target:
      kind: ConfigMap
      name: argocd-rbac-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        scopes: "[groups]"
        policy.default: role:readonly
        policy.csv: |
          g, platform-admin, role:admin
          g, devops, role:admin

  # Tailscale Serve가 전달할 Argo CD backend를 NodePort로 고정한다.
  # server.insecure=true이므로 targetPort 8080은 평문 HTTP를 제공한다.
  # Tailscale Serve backend는 http://127.0.0.1:31430/argocd 를 사용한다.
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/externalTrafficPolicy
        value: Local
      - op: replace
        path: /spec/ports
        value:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8080
            nodePort: 31430

  # 모든 Deployment & StatefulSet에 nodeSelector 주입
  - target:
      kind: (Deployment|StatefulSet)
    patch: |-
      kind: Dummy
      metadata:
        name: dummy
      spec:
        template:
          spec:
            nodeSelector:
              platform: onp
              role: devops

  # argocd-redis에도 nodeSelector 및 resource 주입
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            nodeSelector:
              platform: onp
              role: devops
            initContainers:
            - name: secret-init
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
            containers:
            - name: redis
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 256Mi

  # argocd-dex-server와 copyutil initContainer 리소스 설정
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        template:
          spec:
            initContainers:
            - name: copyutil
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
            containers:
            - name: dex
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi

  # argocd-server 리소스 설정
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
            - name: argocd-server
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi

  # argocd-repo-server 리소스 설정
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            initContainers:
            - name: copyutil
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
            containers:
            - name: argocd-repo-server
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi

  # argocd-applicationset-controller 리소스 설정
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
            - name: argocd-applicationset-controller
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi

  # argocd-notifications-controller 리소스 설정
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
            - name: argocd-notifications-controller
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi

  # argocd-application-controller 리소스 설정
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
            - name: argocd-application-controller
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
