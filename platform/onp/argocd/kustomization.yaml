apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

# devops 네임스페이스는 여기서 만들지 않는다. Pod Security Admission 등급을
# 한 곳에서 보려고 governance/namespaces/devops.yaml 로 옮겼다.
# → governance 가 platform 보다 먼저 적용돼야 한다
resources:
  # 재구축 시 의도하지 않은 Argo CD 버전 변경을 막는다.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.6/manifests/install.yaml

# 1. Pod 라벨 규칙 적용 (area, platform)
labels:
  - pairs:
      area: devops
      platform: onp
    includeSelectors: false

# 2. NodeSelector 및 FinOps 자원 주입
patches:
  # Argo CD는 devops Namespace에 설치되므로 cluster-scoped binding의
  # ServiceAccount 참조도 명시적으로 devops로 맞춘다.
  - target:
      kind: ClusterRoleBinding
      name: argocd-(application-controller|applicationset-controller|server)
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: devops

  # Argo CD가 자체 TLS로 UI를 제공하도록 명시한다.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        server.basehref: "/argocd"
        server.rootpath: "/argocd"

  # Keycloak SSO. Dex 를 거치지 않고 argocd-server 가 직접 OIDC 를 말한다.
  #
  # ── ⚠️ `url` 이 없으면 OIDC 가 아예 안 붙는다 ───────────────
  #
  # Argo CD 는 이 값으로 리다이렉트 주소를 **만든다.** 없으면 콜백 주소를
  # 조립하지 못해 로그인 버튼조차 뜨지 않는다. 그리고 이 값은 Keycloak 의
  # `valid_redirect_uris` 와 **문자 하나까지 같아야** 한다 —
  # 뒤에 `/` 가 붙거나 호스트 대소문자가 달라도 Keycloak 이 거절한다.
  #
  # `/argocd` 가 붙는 것은 위 `server.rootpath` 때문이다.
  #
  # ── ⚠️ 시크릿이 없다. PKCE 를 쓴다 ─────────────────────────
  #
  # `clientSecret` 을 안 적는다. Keycloak 쪽 클라이언트가 public 이고
  # PKCE(S256)를 강제한다 → 01-infra-provisioning terraform/keycloak/clients.tf
  #
  # 브라우저가 매 로그인마다 난수를 만들어 그 해시를 먼저 보내므로,
  # 저장해 둘 고정 비밀이 없다. **온프렘 Argo CD 에 시크릿을 배달하는
  # 사슬(Secrets Manager → ESO → Secret)이 통째로 사라진다.**
  #
  # ⚠️ **PKCE 는 브라우저 UI 전용이다.** `argocd login --sso` (CLI)는
  # 이 방식으로 안 된다. CLI 는 로컬 `admin` 계정이나 API 토큰을 쓴다.
  #
  # ── ⚠️ `groups` 는 요청해야 실린다 ─────────────────────────
  #
  # Keycloak 쪽에서 기본 스코프로 붙였어도, Argo CD 가 `requestedScopes`
  # 에 안 적으면 요청 자체에서 빠진다. 빠지면 아래 policy.csv 의 `g,`
  # 규칙이 아무에게도 안 걸려 **전원이 policy.default 로 떨어진다.**
  #
  # ── ⚠️ `rootCA` 가 없으면 로그인 직후 다시 로그인 화면이다 ──
  #
  # 2026-08-10 에 정확히 그렇게 막혔다. **로그인 자체는 성공한다** —
  # 로그에 `Web login successful` 과 `groups: ["platform-admin"]` 까지
  # 다 찍힌다. 그 **다음** 세션 검증에서 죽는다.
  #
  #   Failed to verify session token: ... failed to query provider
  #     ".../realms/cantaloupe": tls: failed to verify certificate:
  #     x509: certificate signed by unknown authority
  #
  # 사용자에게는 "로그인했는데 로그인 화면으로 돌아옴"으로만 보인다.
  # **성공 로그와 실패 로그가 같은 초에 나란히 찍혀서** 어느 쪽을 믿을지
  # 헷갈리는 것이 이 증상의 고약한 점이다.
  #
  # 인증서 자체는 멀쩡하다. 확인한 것들 —
  #
  #   체인   leaf ← YR1 ← Root YR ← ISRG Root X1 (교차 서명)
  #   검증   openssl verify -CAfile ISRG_Root_X1.pem  →  OK
  #   번들   argocd-server 컨테이너에 ISRG Root X1 있음 (122개 중)
  #   curl   노드에서도 파드에서도 200
  #
  # 즉 **시스템 신뢰 저장소로 충분한데 Argo CD 의 OIDC 클라이언트가
  # 그것을 안 쓴다.** 그래서 신뢰 앵커를 여기서 명시적으로 준다.
  #
  # ⚠️ **`insecureSkipVerify` 로 풀지 않는다.** 그러면 발행자를 사칭하는
  # 상대에게 토큰을 넘길 수 있다 — 인증 시스템에서 검증을 끄는 것은
  # 자물쇠를 떼는 것과 같다.
  #
  # 넣는 것은 **루트 하나**다. 중간 인증서(YR1)나 leaf 를 넣으면 갱신될
  # 때마다 여기를 고쳐야 한다. ISRG Root X1 은 2035-06 까지 유효하다.
  #
  # ⚠️⚠️ **이 값을 고치면 argocd-server 를 재시작해야 한다.**
  #
  #     kubectl -n devops rollout restart deploy/argocd-server
  #
  # ConfigMap 을 고치면 로그에 `subscribed to settings updates` 가 찍혀
  # **핫 리로드된 것처럼 보인다.** 그런데 세션 검증 경로가 들고 있는 설정
  # 스냅샷은 안 바뀐다 — `Initializing OIDC provider` 가 계속 찍히면서도
  # 매번 낡은 TLS 설정으로 다시 만든다. 2026-08-10 에 이것 때문에 고쳤는데
  # 안 고쳐진 줄 알고 한 바퀴 더 돌았다.
  #
  # 확인은 브라우저 없이 된다 — `/argocd/auth/login` 을 치면 provider
  # 초기화가 유발되고, 로그에 `OIDC supported scopes: [...]` 가 나오면
  # 통과다. 그 목록은 디스커버리 문서를 실제로 가져와야 알 수 있다.
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: "https://cntlp-onp-wk-01.tail270b85.ts.net/argocd"
        oidc.config: |
          name: Keycloak
          issuer: https://auth.echoprism.cloud/realms/cantaloupe
          clientID: argocd
          enablePKCEAuthentication: true
          requestedScopes:
            - openid
            - profile
            - email
            - groups
          rootCA: |
            -----BEGIN CERTIFICATE-----
            MIIFazCCA1OgAwIBAgIRAIIQz7DSQONZRGPgu2OCiwAwDQYJKoZIhvcNAQELBQAw
            TzELMAkGA1UEBhMCVVMxKTAnBgNVBAoTIEludGVybmV0IFNlY3VyaXR5IFJlc2Vh
            cmNoIEdyb3VwMRUwEwYDVQQDEwxJU1JHIFJvb3QgWDEwHhcNMTUwNjA0MTEwNDM4
            WhcNMzUwNjA0MTEwNDM4WjBPMQswCQYDVQQGEwJVUzEpMCcGA1UEChMgSW50ZXJu
            ZXQgU2VjdXJpdHkgUmVzZWFyY2ggR3JvdXAxFTATBgNVBAMTDElTUkcgUm9vdCBY
            MTCCAiIwDQYJKoZIhvcNAQEBBQADggIPADCCAgoCggIBAK3oJHP0FDfzm54rVygc
            h77ct984kIxuPOZXoHj3dcKi/vVqbvYATyjb3miGbESTtrFj/RQSa78f0uoxmyF+
