apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 이 디렉터리 아래 있는 일반 워크로드는 AWS service 노드에 뜬다.
# 개별 매니페스트에 nodeSelector 를 적지 않는다. 여기 한 곳만 고친다.
patches:
  - target:
      kind: "(Deployment|StatefulSet|Job)"
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          platform: aws
          role: service
  # CronJob 은 template 이 jobTemplate 아래라 경로가 한 단계 깊다.
  - target:
      kind: CronJob
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/nodeSelector
        value:
          platform: aws
          role: service

resources: []
