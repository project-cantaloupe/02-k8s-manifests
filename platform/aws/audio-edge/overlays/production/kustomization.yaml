apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 이 overlay는 Route53 Hosted Zone, cert-manager의 AWS 자격증명 경로와
# cert-manager Application 등록이 끝나기 전에는 Root Application에 등록하지 않는다.
resources:
  - ../../base
  - settings.yaml
  - certificate.yaml

patches:
  - path: gateway-tls.yaml
  - path: virtual-service-host.yaml

replacements:
  - source:
      kind: ConfigMap
      name: audio-edge-settings
      fieldPath: data.publicHost
    targets:
      - select:
          kind: Gateway
          name: audio-gateway
        fieldPaths:
          - spec.servers.0.hosts.0
          - spec.servers.1.hosts.0
      - select:
          kind: VirtualService
          name: mesh-smoke
        fieldPaths:
          - spec.hosts.0
      - select:
          kind: Certificate
          name: audio-tls
        fieldPaths:
          - spec.dnsNames.0
  - source:
      kind: ConfigMap
      name: audio-edge-settings
      fieldPath: data.acmeEmail
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-production
        fieldPaths:
          - spec.acme.email
  - source:
      kind: ConfigMap
      name: audio-edge-settings
      fieldPath: data.route53ZoneID
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-production
        fieldPaths:
          - spec.acme.solvers.0.dns01.route53.hostedZoneID
