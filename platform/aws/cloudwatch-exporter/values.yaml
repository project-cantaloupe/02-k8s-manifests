replicaCount: 1

pod:
  labels:
    area: monitoring
    platform: aws
    cost-allocation: shared

nodeSelector:
  platform: aws
  role: service

serviceAccount:
  create: true
  automountServiceAccountToken: false

rbac:
  create: false

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceMonitor:
  enabled: true
  namespace: monitoring
  # S3 storage metrics are published once per day, but AWS does not guarantee
  # an exact publication hour. Poll twice per day so a newly published daily
  # sample is found within about 12 hours while avoiding unnecessary API calls.
  interval: 12h
  timeout: 60s
  labels:
    release: monitoring

# CloudWatch S3 samples arrive once per day. Prometheus instant queries only
# look back a few minutes by default, so carry the latest daily sample forward
# through recording rules evaluated by Prometheus.
prometheusRule:
  enabled: true
  namespace: monitoring
  labels:
    release: monitoring
  rules:
    - record: cantaloupe:aws_s3_bucket_size_bytes
      # Drop exporter topology labels so a Pod rollout cannot duplicate a
      # bucket's value while the previous series remains in the lookback.
      expr: max by (bucket_name, storage_type) (last_over_time(aws_s3_bucket_size_bytes_average[72h]))
    - record: cantaloupe:aws_s3_number_of_objects
      expr: max by (bucket_name, storage_type) (last_over_time(aws_s3_number_of_objects_average[72h]))
    - record: cantaloupe:cloudwatch_exporter_scrape_error
      expr: max(last_over_time(cloudwatch_exporter_scrape_error{job="cloudwatch-exporter-prometheus-cloudwatch-exporter"}[24h])) or vector(1)

# The pod runs only on an AWS service Worker and obtains temporary credentials
# from the existing cntlp-aws-worker-node EC2 Instance Profile. No access key is
# stored in Git or Kubernetes.
config: |-
  region: ap-northeast-2
  list_metrics_cache_ttl: 3600
  metrics:
    # S3 storage metrics are published by AWS once per day. Explicit dimension
    # selections avoid discovery calls and begin returning samples as soon as
    # AWS publishes the first datapoint.
    - aws_namespace: AWS/S3
      aws_metric_name: BucketSizeBytes
      aws_dimensions: [BucketName, StorageType]
      aws_dimension_select:
        BucketName:
          - cntlp-aws-quarantine
          - cntlp-aws-transcode
        StorageType:
          - StandardStorage
          - StandardIAStorage
          - GlacierInstantRetrievalStorage
      aws_statistics: [Average]
      period_seconds: 86400
      range_seconds: 604800
      delay_seconds: 0
      # The upstream exporter explicitly recommends disabling CloudWatch
      # timestamps for infrequently updated S3 metrics. Otherwise Prometheus
      # may reject stale samples and CloudWatch's aggregated period boundary
      # can be mistaken for the original S3 observation time.
      set_timestamp: false

    - aws_namespace: AWS/S3
      aws_metric_name: NumberOfObjects
      aws_dimensions: [BucketName, StorageType]
      aws_dimension_select:
        BucketName:
          - cntlp-aws-quarantine
          - cntlp-aws-transcode
        StorageType:
          - AllStorageTypes
      aws_statistics: [Average]
      period_seconds: 86400
      range_seconds: 604800
      delay_seconds: 0
      set_timestamp: false
