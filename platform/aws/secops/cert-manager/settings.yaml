# ClusterIssuer 에 주입되는 값. 실제 배포 전 팀 소유 값으로 교체한다.
#
# 원래 `platform/aws/audio-edge/overlays/production/settings.yaml` 이 이 둘을
# 들고 있었다. ClusterIssuer 를 여기로 옮기면서 같이 왔다. 오디오 앱 쪽에는
# 그 앱의 `publicHost` 만 남는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-settings
  namespace: cert-manager
data:
  # ACME 등록 주소. 만료 임박 알림이 여기로 온다. 개인 주소보다 팀 별칭.
  acmeEmail: REPLACE_WITH_TEAM_EMAIL
  # echoprism.cloud 의 Route 53 호스팅 존 ID.
  route53ZoneID: REPLACE_WITH_HOSTED_ZONE_ID
