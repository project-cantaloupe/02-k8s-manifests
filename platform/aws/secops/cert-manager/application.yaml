# cert-manager — 인증서 발급·갱신.
#
# 첫 소비자는 Keycloak 이다. 발행자 URL 이 `https://auth.echoprism.cloud/...`
# 이고 **OIDC 는 https 발행자를 요구한다** (K8s API 서버의 `--oidc-issuer-url`
# 이 특히 그렇다). 그 이름의 신뢰받는 인증서가 필요하다.
#
# ── 왜 DNS-01 인가 ──────────────────────────────────────────────
#
# HTTP-01 은 :80 이 인터넷에서 닿아야 한다. `CONSTRAINTS.md` 가 "인터넷에
# 노출하는 것은 오디오 앱뿐"이라고 못박아서 못 쓴다.
#
# DNS-01 은 도달성을 요구하지 않는다. Route 53 에 TXT 를 잠깐 넣었다 빼는
# 것으로 소유를 증명한다. 그래서 **`auth.echoprism.cloud` 의 A 레코드가
# tailnet 사설 IP(100.64.0.0/10)를 가리켜도 인증서가 나온다.** 이름은 공개,
# 주소는 메시 안쪽 — 이게 이 설계의 핵심이다.
#
# ── 네임스페이스 ────────────────────────────────────────────────
#
# `secops` 에 둔다. 차트 기본값은 `cert-manager` 지만 네임스페이스를 하나 더
# 만들 이유가 없다 — 신원·시크릿 전달과 같은 영역이고 특권도 필요 없다.
# 규약 1절에 등재했다 (00-cantaloupe-resources).
#
# `clusterResourceNamespace` 를 명시하는 이유 — ClusterIssuer 가 참조하는
# Secret 을 cert-manager 가 **이 네임스페이스에서** 찾는다. 기본값이 릴리스
# 네임스페이스라 지금은 같지만, 안 적으면 나중에 옮길 때 조용히 어긋난다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: devops
  annotations:
    # 차트가 먼저다. CRD 가 여기서 오고, cluster-issuer.yaml 이 그 CRD 를 쓴다.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    # v1.21.1 (2026-07-29). cert-manager 는 차트 버전과 앱 버전이 같다.
    targetRevision: v1.21.1
    helm:
      values: |
        x-node-selector: &aws-node
          platform: aws
          role: service
        x-pod-labels: &cm-labels
          app: cert-manager
          area: secops
          platform: aws

        # CRD 가 여기서 온다. 끄면 ClusterIssuer 를 만들 수 없다.
        crds:
          enabled: true
          keep: true

        # ClusterIssuer 가 참조하는 Secret 을 찾는 곳.
        clusterResourceNamespace: secops

        replicaCount: 1
        nodeSelector: *aws-node
        podLabels: *cm-labels
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

        webhook:
          replicaCount: 1
          nodeSelector: *aws-node
          podLabels: *cm-labels
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi

        cainjector:
          replicaCount: 1
          nodeSelector: *aws-node
          podLabels: *cm-labels
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi

        startupapicheck:
          nodeSelector: *aws-node
          podLabels: *cm-labels
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: secops

  syncPolicy:
    syncOptions:
      # CRD 가 커서 클라이언트 사이드 apply 의 어노테이션 한도를 넘는다.
      - ServerSideApply=true
