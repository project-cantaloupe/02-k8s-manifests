# Let's Encrypt 발급자 — staging 과 production.
#
# **여기 있는 이유** — ClusterIssuer 는 클러스터 범위 자원이고 여러 영역이
# 같이 쓴다(오디오 앱의 `audio-tls`, 나중에 Keycloak 의 발행자 인증서).
# 원래 `platform/aws/audio-edge/overlays/production/certificate.yaml` 안에
# 있었는데, 그러면 **앱 오버레이가 클러스터 자원을 소유**하고 다른 영역이
# 인증서를 받으려면 오디오 앱 배포에 의존하게 된다.
# → tasks/doing/009_istio-governance-reconcile.md 2번
#
# 앱 오버레이에는 그 앱의 `Certificate` 만 남겼다. 이름으로 참조하므로
# 정의 위치가 바뀌어도 그대로 붙는다.
#
# ── 자격증명이 없는 이유 ────────────────────────────────────────
#
# `accessKeyIDSecretRef` 가 없다. `applications/cert-manager.yaml` 이
# projected ServiceAccount 토큰(`sts.amazonaws.com` audience)과
# `AWS_ROLE_ARN` 으로 **AWS 역할을 web identity 로 맡는** 구성이라,
# 파드가 이미 자격증명을 갖고 있다. 정적 IAM 키를 두지 않는다 —
# `decisions/20260731_secret-access-no-fallback.md` 와 정면으로 맞는다.
#
# ⚠️ **선행 조건: 클러스터의 ServiceAccount 발행자를 AWS IAM 의 OIDC
# 공급자로 등록해야 한다.** self-managed 클러스터라 EKS 처럼 자동으로 되지
# 않는다. 그게 끝나기 전에는 cert-manager 를 Root 목록에 등록하지 않는다
# (`applications/cert-manager.yaml` 주석). **Keycloak 인증서도 같이 막힌다.**
#
# ── staging 을 먼저 쓴다 ────────────────────────────────────────
#
# production 은 실패 시도에도 속도 제한이 걸리고 이름당 주간 발급 상한이
# 있다. DNS-01 을 처음 맞출 때 몇 번 틀리는 것은 정상이고, 그걸 production
# 에서 하면 한 주를 기다린다. staging 인증서는 브라우저가 신뢰하지 않는다 —
# 그게 정상이고, 발급 자체가 되는지만 본다.
#
# `email` 과 `hostedZoneID` 는 `settings.yaml` 에서 kustomize replacements 로
# 주입된다. 값을 여기 직접 적지 않는다.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACED_BY_SETTINGS
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          route53:
            region: ap-northeast-2
            hostedZoneID: REPLACED_BY_SETTINGS
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACED_BY_SETTINGS
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - dns01:
          route53:
            region: ap-northeast-2
            hostedZoneID: REPLACED_BY_SETTINGS
