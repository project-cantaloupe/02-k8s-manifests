# Let's Encrypt 발급자 — staging 과 production.
#
# **여기 있는 이유** — ClusterIssuer 는 클러스터 범위 자원이고 여러 영역이
# 같이 쓴다(오디오 앱의 `audio-tls`, 나중에 Keycloak 의 발행자 인증서).
# 원래 `platform/aws/audio-edge/overlays/production/certificate.yaml` 안에
# 있었는데, 그러면 **앱 오버레이가 클러스터 자원을 소유**하고 다른 영역이
# 인증서를 받으려면 오디오 앱 배포에 의존하게 된다.
# → tasks/doing/009_istio-governance-reconcile.md 2번
#
# 앱 오버레이에는 그 앱의 `Certificate` 만 남겼다. 이름으로 참조하므로
# 정의 위치가 바뀌어도 그대로 붙는다.
#
# ── 자격증명이 없는 이유 ────────────────────────────────────────
#
# `accessKeyIDSecretRef` 가 없다. cert-manager 파드가 도는 노드
# (`cntlp-aws-wk-01`)의 **Node Instance Profile** 에서 IMDS 로 자격증명을
# 가져오기 때문이다. 정적 IAM 키를 두지 않는다 —
# `decisions/20260731_secret-access-no-fallback.md` 와 정면으로 맞는다.
#
# ⚠️ **IRSA 가 아니다.** 예전 주석이 projected ServiceAccount 토큰과
# `AWS_ROLE_ARN` 을 적고 있었는데, self-managed 클러스터의
# `--service-account-issuer` 가 `https://kubernetes.default.svc.cluster.local`
# 이라 AWS 가 OIDC 디스커버리 문서를 가지러 올 수 없다. IRSA 는 컨트롤플레인을
# 3대로 늘릴 때 다시 본다 — apiserver 재시작이 필요하다.
# → decisions/20260806_cert-manager-node-instance-profile.md
#
# ⚠️ **`hostedZoneID` 를 명시하는 것이 IAM 정책의 전제다.** 인라인 정책이
# `route53:ListHostedZonesByName` 을 안 준다. 이 값을 비우면 cert-manager 가
# 존을 이름으로 찾으려 들다가 AccessDenied 로 죽는다.
#
# ── staging 을 먼저 쓴다 ────────────────────────────────────────
#
# production 은 실패 시도에도 속도 제한이 걸리고 이름당 주간 발급 상한이
# 있다. DNS-01 을 처음 맞출 때 몇 번 틀리는 것은 정상이고, 그걸 production
# 에서 하면 한 주를 기다린다. staging 인증서는 브라우저가 신뢰하지 않는다 —
# 그게 정상이고, 발급 자체가 되는지만 본다.
#
# `email` 과 `hostedZoneID` 는 `settings.yaml` 에서 kustomize replacements 로
# 주입된다. 값을 여기 직접 적지 않는다.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACED_BY_SETTINGS
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          route53:
            region: ap-northeast-2
            hostedZoneID: REPLACED_BY_SETTINGS
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACED_BY_SETTINGS
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - dns01:
          route53:
            region: ap-northeast-2
            hostedZoneID: REPLACED_BY_SETTINGS
