# Keycloak 이 쓰는 시크릿 둘을 AWS Secrets Manager 에서 끌어온다.
#
# **평문 시크릿이 이 리포에 없다.** 여기 적히는 것은 "어디서 가져오나"뿐이고
# 값은 클러스터 안에서만 존재한다 → decisions/20260731_secret-access-no-fallback.md
---
# ── 1. DB 자격증명 ──────────────────────────────────────────────
#
# **이 시크릿은 RDS 가 만들고 RDS 가 소유한다.** 스택이
# `manage_master_user_password = true` 라 마스터 비밀번호를 terraform state
# 에 넣지 않고 AWS 가 직접 Secrets Manager 에 만든다. 그래서 이름이
# `rds!db-<uuid>` 로 사람이 정할 수 없는 형태다.
#
# ⚠️ **`rds!` 의 `!` 는 오타가 아니다.** AWS 가 관리형 시크릿에 붙이는
# 예약 접두사이고, 이 접두사를 가진 시크릿은 콘솔에서 값 수정이 막힌다.
# YAML 에서 따옴표로 감싸야 한다 — 안 그러면 파서에 따라 태그로 읽힌다.
#
# ⚠️ **이 이름은 인스턴스를 다시 만들면 바뀐다.** 하드코딩된 유일한
# 좌표라 DB 를 재생성하면 여기와 IAM 인라인 정책 둘 다 고쳐야 한다.
#
# 저장된 JSON 은 `{"username": ..., "password": ...}` 이고 `property` 로
# 한 키씩 뽑는다. `dataFrom.extract` 로 통째로 가져오면 RDS 가 나중에
# 필드를 늘릴 때 쓰지도 않는 값이 Secret 에 실린다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: secops
spec:
  # 1시간마다 다시 읽는다. RDS 의 자동 로테이션이 켜지면 이 주기가
  # **비밀번호가 바뀌고부터 파드가 새 값을 볼 때까지의 최대 지연**이 된다.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "rds!db-a4001245-3f51-407d-95f3-50b72eba1c9f"
        property: username
    - secretKey: password
      remoteRef:
        key: "rds!db-a4001245-3f51-407d-95f3-50b72eba1c9f"
        property: password
---
# ── 2. 부트스트랩 관리자 ────────────────────────────────────────
#
# **임시 계정이다.** Keycloak 26 은 `KC_BOOTSTRAP_ADMIN_*` 이 있으면
# 첫 기동에서 master realm 에 관리자를 하나 만들고, 이미 있으면 아무것도
# 안 한다. realm 과 그룹이 서면 실계정으로 갈아타고 이 계정을 지운다.
#
# ⚠️ **Vault 가 아니라 Secrets Manager 에 있는 이유가 순환이다.**
# ESO 가 Vault 를 읽으려면 Vault 의 Kubernetes auth method 가 서 있어야
# 하는데 그건 아직 없다. 그리고 Vault UI 로그인을 Keycloak 으로 옮기는 것이
# 이 태스크의 목적이라, **Keycloak 을 세우는 데 Vault 를 끌어들이면 사슬이
# 하나 더 늘어난다** → tasks/todo/008_identity-and-sso.md 「순환 의존」
#
# 실계정으로 갈아탄 뒤 이 시크릿은 Secrets Manager 에서 지운다.
#
# ⚠️ **이 시크릿은 코드 밖에서 만든다.** DB 시크릿과 달리 AWS 가 만들어주지
# 않는다 → references/ 런북의 선행 절차
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: secops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: cntlp/keycloak/bootstrap-admin
        property: username
    - secretKey: password
      remoteRef:
        key: cntlp/keycloak/bootstrap-admin
        property: password
