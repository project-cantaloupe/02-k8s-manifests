# Keycloak 노출.
#
# ── 왜 NodePort 인가 ────────────────────────────────────────────
#
# **이 클러스터의 메시 안쪽 UI 는 전부 NodePort 다.** ArgoCD(31430),
# Harbor(32432), Grafana(30300), OpenSearch Dashboards(30561),
# Prometheus(30909), OpenCost(30990). LoadBalancer 는 AWS 에서 돈이 들고
# GCP·온프렘 워커에서는 아예 안 뜬다.
#
# NodePort 는 **모든 노드**가 연다. 파드가 어느 노드에 있든 상관없다 —
# kube-proxy 가 받아서 실제 파드로 넘긴다. 그래서 A 레코드를 특정 노드에
# 걸어도 파드가 다른 노드로 옮겨가는 것과 무관하다.
#
# ⚠️ **그 대가가 출발지 주소다.** `externalTrafficPolicy: Cluster`(기본)는
# 다른 노드로 넘길 때 SNAT 한다. 파드가 보는 출발지는 팀원의 tailnet
# 주소가 아니다 → network-policy.yaml
#
# ── 왜 443 이 아니라 8443 을 향하나 ────────────────────────────
#
# 컨테이너가 8443 을 연다. 1024 미만 포트는 `NET_BIND_SERVICE` 가 필요한데
# PSA `restricted` 가 모든 capability 를 떨어뜨리므로 바인딩 자체가 안 된다.
# 서비스 포트 443 은 클라이언트가 보는 번호일 뿐이다.
#
# ── 관리 포트를 서비스에 안 싣는다 ─────────────────────────────
#
# 9000 은 헬스·메트릭이고 인증이 없다. kubelet 프로브와 Prometheus 만
# 닿으면 되므로 파드 포트로만 열어둔다. NodePort 로 내면 tailnet 의
# 아무나 `/metrics` 를 읽는다.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: secops
  labels:
    app: keycloak
    area: secops
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: https
      port: 443
      targetPort: https
      # 30843 = 8443 의 기억용. 기존 할당과 안 겹친다
      # (30080·30300·30443·30561·30909·30990·31430·32021·32432).
      nodePort: 30843
      protocol: TCP
---
# 클러스터 안에서 부를 때 쓰는 이름. Vault·ArgoCD 가 토큰을 검증하러
# 발행자에 붙을 때는 **공개 이름을 써야 한다** — 토큰의 `iss` 와
# 디스커버리 문서의 URL 이 일치해야 하기 때문이다. 이 서비스는 그 검증이
# 아니라 파드 간 직접 호출용이다.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: secops
  labels:
    app: keycloak
    area: secops
spec:
  # 클러스터링을 켤 때 Infinispan 이 파드 IP 를 직접 찾는다.
  # 지금은 replicas 가 1이라 안 쓰지만, 이름을 미리 잡아두면 나중에
  # DNS 기반 디스커버리로 넘어갈 때 발행자 URL 을 안 건드린다.
  clusterIP: None
  selector:
    app: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
