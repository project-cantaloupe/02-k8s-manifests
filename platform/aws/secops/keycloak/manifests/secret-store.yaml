# AWS Secrets Manager 를 시크릿 출처로 연결한다.
#
# **이 클러스터의 첫 SecretStore 다.** ESO 는 2026-08-07 에 섰지만
# (`applications/external-secrets.yaml`) 소비자가 없었다.
#
# ── 왜 ClusterSecretStore 가 아닌가 ─────────────────────────────
#
# `ClusterSecretStore` 는 **모든 네임스페이스**가 참조할 수 있다. 그러면
# `apps` 의 파드가 만든 ExternalSecret 도 이 자격증명으로 Keycloak 의 DB
# 비밀번호를 꺼낼 수 있다. ESO 는 "누가 무엇을 꺼낼 수 있나"를
# **SecretStore 의 범위로만** 표현하므로, 범위를 좁히는 것이 유일한 통제다.
#
# 네임스페이스 범위면 `secops` 안에서 ExternalSecret 을 만들 수 있는 사람만
# 닿는다. 그건 이미 RBAC 이 통제하는 집합이다.
#
# ── 자격증명이 없는 이유 ────────────────────────────────────────
#
# `auth:` 블록이 없다. 없으면 ESO 는 AWS SDK 의 **기본 자격증명 체인**을
# 타고, 그 끝이 IMDS 다. ESO 컨트롤러 파드가 `platform=aws, role=service`
# 노드에 고정돼 있으므로(차트 values 의 `global.nodeSelector`) 워커의
# **Node Instance Profile** 을 집는다.
#
# cert-manager 가 Route53 을 쓰는 방식과 정확히 같다. 정적 IAM 키를 두지
# 않는다 → decisions/20260731_secret-access-no-fallback.md
#
# ⚠️ **IRSA 가 아니다.** self-managed 클러스터의 `--service-account-issuer` 가
# `https://kubernetes.default.svc.cluster.local` 이라 AWS 가 OIDC 디스커버리
# 문서를 가지러 올 수 없다 → decisions/20260806_cert-manager-node-instance-profile.md
#
# ⚠️ **그래서 IAM 권한이 노드 단위다.** 이 노드에 뜨는 *모든* 파드가
# 같은 권한을 갖는다. Keycloak DB 시크릿을 읽을 수 있는 인라인 정책
# `cntlp-aws-identity-database-node` 가 워커 롤에 붙어 있고, 그것이 지금
# 이 클러스터에서 가장 큰 신뢰 가정이다. IRSA 로 좁히는 것은 컨트롤플레인을
# 3대로 늘릴 때 함께 본다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: secops
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
