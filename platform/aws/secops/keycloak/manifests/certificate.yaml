# Keycloak 이 직접 제시할 TLS 인증서.
#
# ── 왜 이름이 중요한가 ──────────────────────────────────────────
#
# **OIDC 발행자 URL 이 여기서 정해진다.** `https://auth.echoprism.cloud/realms/cantaloupe`
# 가 K8s API 서버 플래그(`--oidc-issuer-url`), Vault, ArgoCD, Grafana,
# Harbor 의 설정에 전부 박힌다. 토큰의 `iss` 클레임에도 들어가서
# **이미 발급된 토큰까지 이 문자열에 묶인다.**
#
# 그래서 노드 이름을 쓰는 경로(Harbor 처럼 `tailscale serve` 로
# `cntlp-onp-wk-01.tail270b85.ts.net`)를 안 골랐다. 노드를 다시 만들면
# 발행자가 바뀌고 모든 클라이언트가 동시에 깨진다.
# → tasks/todo/008_identity-and-sso.md 0단계 (3)
#
# ── 왜 production 인가 ──────────────────────────────────────────
#
# staging 으로 이 이름의 DNS-01 경로를 2026-08-07 에 실발급으로 확인했다
# (PR #30). **staging 을 쓴 목적이 그 확인이었고 그건 끝났다.**
# 여기서 또 staging 을 쓰면 어차피 한 번 더 발급해야 하고, staging 인증서는
# 신뢰 체인이 없어 K8s API 서버의 OIDC 검증이 통과하지 못한다.
#
# ⚠️ **production 은 이름당 주간 발급 상한이 있다.** 이 Certificate 를
# 지웠다 만들기를 반복하지 않는다. 문제가 생기면 Secret 을 지우지 말고
# `kubectl describe certificate` 로 사유를 먼저 읽는다.
#
# ⚠️ **DNS-01 이라 이 이름이 어디를 가리키는지와 무관하게 발급된다.**
# Route53 TXT 레코드만 보므로, A 레코드가 tailnet 주소(100.x)를 가리켜도
# 상관없다. 인증서가 나왔다는 것이 도달 가능하다는 뜻은 아니다 —
# 그건 따로 확인한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: secops
spec:
  secretName: keycloak-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - auth.echoprism.cloud
