# Keycloak — 사람 신원의 단일 출처.
#
# **이 Application 이 배포하는 것은 차트가 아니라 같은 리포의 매니페스트다.**
# `manifests/` 를 가리킨다. Helm 차트를 안 쓴 이유가 셋 있다.
#
# 1. PSA `restricted` 를 만족하는 `securityContext` 를 차트 values 로
#    비집어 넣는 것보다 직접 쓰는 편이 짧다
# 2. DB 연결이 **RDS 한 곳**으로 고정돼 있어 차트의 내장 PostgreSQL·
#    분기 로직이 전부 사표다 → decisions/20260807_keycloak-database-placement.md
# 3. realm-as-code 를 넣을 때 ConfigMap 을 직접 마운트해야 하는데,
#    차트마다 그 훅의 이름이 다르다
#
# ⚠️ **`manifests/` 는 상위 카탈로그(`platform/aws/secops/kustomization.yaml`)에
# 안 들어간다.** kustomize 는 `resources:` 에 적힌 것만 읽는데
# `keycloak/kustomization.yaml` 이 이 파일 하나만 적고 있다. 그래서 같은
# 디렉터리 트리에 있어도 두 번 적용되지 않는다.
#
# ── wave ────────────────────────────────────────────────────────
#
# 카탈로그(`applications/secops.yaml`)가 wave 0 이고 그것이 이 Application 을
# 만든다. 선행 셋은 전부 그보다 앞이다.
#
#     -5  cert-manager     → Certificate CRD 와 ClusterIssuer 발급자
#     -5  external-secrets → SecretStore/ExternalSecret CRD
#    -40  governance-namespaces → secops 네임스페이스 (PSA 라벨 포함)
#
# ── ServerSideDiff ──────────────────────────────────────────────
#
# ⚠️ **아래 ServerSideApply=true 와 한 쌍이다. 하나만 켜면 영구 OutOfSync 다.**
# 원리는 `applications/governance-policies.yaml` 에 적혀 있다 — SSA 는
# `last-applied-configuration` 을 안 남기고, 그게 없으면 3-way merge 의
# 기준선이 사라져 2-way 비교로 떨어진다.
#
# **여기서 상쇄하려는 것은 CRD 스키마 기본값이다.** 이 경로가 만드는 것 중
# 둘이 CRD 이고 둘 다 기본값이 많다.
#
#     Certificate     (cert-manager.io/v1)    — spec.privateKey.*, spec.usages
#     ExternalSecret  (external-secrets.io/v1) — spec.refreshPolicy, spec.target.*
#
# → decisions/20260807_argocd-server-side-diff.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: devops
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: main
    path: platform/aws/secops/keycloak/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: secops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # secops 는 governance/namespaces/secops.yaml 이 만든다.
      # 여기서 만들면 PSA 라벨이 안 붙고, **하필 신원 서버가 하드닝 없는
      # 네임스페이스에서 돌게 된다.**
      - CreateNamespace=false
      - ServerSideApply=true
