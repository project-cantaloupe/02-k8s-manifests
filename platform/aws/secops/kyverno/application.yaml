# Kyverno 정책 엔진.
#
# **이게 없으면 `governance/secops/`·`governance/finops/` 가 전부 무동작이다.**
# ClusterPolicy 는 CRD 이고 CRD 를 이 차트가 들여온다.
# → tasks/todo/002_bootstrap-blockers.md 1번
#
# PSA 는 이것과 무관하게 이미 동작한다 (API 서버 내장). 여기 없어도
# `governance/namespaces/` 의 등급은 걸린다.
#
# ── 왜 platform=aws 인가 ────────────────────────────────────────
#
# 어드미션 웹훅이 **모든 쓰기 요청의 동기 경로**에 있다. API 서버가 응답을
# 기다린다. 다른 영역에 두면 파드 하나 만들 때마다 WAN 을 왕복한다.
# → CONSTRAINTS.md · decisions/20260728_network-connectivity-and-access.md
#
# ── 왜 aws 안에서도 role=control-plane 인가 ─────────────────────
#
# **istiod 와 같은 판단이다** (applications/istiod.yaml 참고).
# `role=service` 워커는 t3.small 2 GiB 이고 그 메모리를 FFmpeg 가 써야 한다.
# 2026-08-06 실측으로 실여유가 1034 MiB 뿐이었고 limits 는 이미 141%
# 오버커밋이었다. 컨트롤플레인은 8 GiB 중 5 GiB 가 놀고 있다.
#
# **CPU 예약이 여기서 빡빡한 축이다.** cp-01 은 requests 1420m/2000m 이고
# 이 차트가 250m 을 더 쓴다 → 1670m (84%). 실사용은 11.9% 라 돌아가는 데는
# 문제가 없지만 **남는 예약이 330m 뿐**이다. cert-manager(50m)까지는 들어가고
# 그 뒤로는 못 넣는다 → decisions/20260806_aws-node-placement.md
#
# ⚠️ **tolerations 가 반드시 같이 있어야 한다.** 컨트롤플레인 노드에는
# `node-role.kubernetes.io/control-plane:NoSchedule` 테인트가 있어서,
# nodeSelector 만 바꾸면 **파드가 Pending 에 머물고 에러는 안 난다.**
#
# ⚠️ values 의 키 경로가 컨트롤러마다 다르다. **admissionController 만
# `.container.resources` 이고 나머지 셋은 `.resources` 다.** 잘못 쓰면
# 조용히 무시돼서 nodeSelector 가 안 걸린 채 아무 노드에나 뜬다.
# (chart 3.8.2 values.yaml 확인)
#
# ── 착지 순서 ───────────────────────────────────────────────────
#
# 1. `governance/` 를 먼저 적용한다. `kyverno` 네임스페이스가 거기서 온다
# 2. 이 Application 을 sync 한다
# 3. `kubectl get polr -A` 로 기존 워크로드의 위반을 본다
# 4. 필요한 예외를 `governance/exceptions/` 에 쓴다
#
# **CreateNamespace 를 켜지 않았다.** 켜면 ArgoCD 가 `kyverno` 네임스페이스를
# **PSA 라벨 없이** 만든다. 없으면 sync 가 명확한 에러로 실패하고, 그게
# 조용히 라벨 없는 네임스페이스가 생기는 것보다 낫다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: devops
  annotations:
    # ⚠️ **맨 아래 ServerSideApply=true 와 한 쌍이다.**
    # 기준선이 사라지는 원리는 applications/governance-policies.yaml 에 적었다.
    # 여기서 상쇄하려는 것은 CRD 스키마 기본값이 아니라 **차트가 렌더링하는
    # 빈 맵**이다.
    #
    # `kyverno-api` 서브차트가 CRD 11 개를 이렇게 낸다 (chart 3.8.2 확인).
    #
    #     metadata:
    #       labels:
    #         {}        ← values 에 customLabels 가 없으면 빈 맵이 남는다
    #       annotations:
    #         {}
    #
    # **이건 sync 로 못 고친다.** SSA 로 `{}` 를 보내면 API 서버는 설정할 키가
    # 없다고 보고 아무것도 안 남긴다 → 다음 비교에서 또 `{}` vs 없음 → 영구
    # OutOfSync. 실제로 2026-08-07 기준 `policies.kyverno.io` 그룹 11 개가
    # 전부 여기에 걸려 있었고, 다른 필드 차이는 하나도 없었다.
    #
    # 같은 차트라도 `crds` 서브차트에서 오는 CRD(clusterpolicies 등)는 Helm
    # 라벨이 붙어서 멀쩡하다. 라벨 유무가 정확히 서브차트 경계로 갈린다
    # → decisions/20260807_argocd-server-side-diff.md
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # chart 3.8.2 = app v1.18.2 (2026-07-10). kubeVersion ">=1.25.0-0" 이라
    # 우리 v1.36 을 만족한다 (ansible/vars/cluster.yml).
    targetRevision: 3.8.2
    helm:
      values: |
        x-node-selector: &aws-node
          platform: aws
          role: control-plane
        # 컨트롤플레인 테인트를 견딘다. 없으면 조용히 Pending 이다.
        x-tolerations: &cp-tolerations
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        x-pod-labels: &kyverno-labels
          app: kyverno
          area: secops
          platform: aws

        # ClusterPolicy CRD 가 여기서 온다. 끄면 정책을 적용할 수 없다.
        crds:
          install: true

        admissionController:
          # ⚠️ 1 대다. 재시작하는 동안 어드미션 요청이 막힐 수 있다.
          # 컨트롤플레인을 1대로 둔 것과 같은 판단이다 — 지킬 워크로드가
          # 생기면 올린다 → decisions/20260803_control-plane-single-node.md
          replicas: 1
          nodeSelector: *aws-node
          tolerations: *cp-tolerations
          podLabels: *kyverno-labels
          # 이 컨트롤러만 resources 가 container 아래다.
          container:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 384Mi

        backgroundController:
          # PolicyReport 를 만드는 것이 이 컨트롤러다.
          # `background: true` 정책이 기존 자원을 스캔한 결과가 여기서 나온다.
          replicas: 1
          nodeSelector: *aws-node
          tolerations: *cp-tolerations
          podLabels: *kyverno-labels
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

        cleanupController:
          replicas: 1
          nodeSelector: *aws-node
          tolerations: *cp-tolerations
          podLabels: *kyverno-labels
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

        reportsController:
          replicas: 1
          nodeSelector: *aws-node
          tolerations: *cp-tolerations
          podLabels: *kyverno-labels
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    syncOptions:
      # Kyverno CRD 는 크다. 클라이언트 사이드 apply 는
      # `metadata.annotations: Too long` 으로 실패한다.
      - ServerSideApply=true
