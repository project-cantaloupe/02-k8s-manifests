apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: aws-audio-burst-98
spec:
  # kubeadm·Calico·Tailscale이 준비된 동일 Golden AMI를 두 NodeClass가 재사용한다.
  amiFamily: Custom
  amiSelectorTerms:
    - name: cntlp-aws-cicd-k8s-worker-63539f2

  # 기존 Service Worker와 같은 Private Subnet·Security Group·IAM 경계 사용
  subnetSelectorTerms:
    - tags:
        Name: cntlp-aws-subnet-private-01
  securityGroupSelectorTerms:
    - tags:
        Name: cntlp-aws-sg-cluster
    - tags:
        Name: cntlp-aws-wk-sg
  instanceProfile: cntlp-aws-worker-node

  # Calico Node의 kubelet은 110 Pod를 허용한다. 이 값을 생략하면 Karpenter가
  # AWS VPC CNI의 t3.small ENI 한도인 11 Pod로 계산해 불필요한 Node를 만든다.
  kubelet:
    maxPods: 110

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/sda1
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  associatePublicIPAddress: false
  detailedMonitoring: false

  # Secret 값은 UserData에 미포함. Node Instance Profile로 런타임 조회
  userData: |
    #!/usr/bin/env bash
    set -euo pipefail

    /usr/local/sbin/cntlp-worker-bootstrap \
      --aws-region ap-northeast-2 \
      --tailscale-oauth-secret-id cntlp-aws-cicd-tailscale-bootstrap \
      --kubeadm-join-secret-id cntlp-aws-cicd-kubeadm-bootstrap \
      --node-name cntlp-aws-wk-98 \
      --karpenter-node

    # AWS service Worker는 On-Prem Harbor의 MagicDNS 이름을 해석해야 한다.
    tailscale set --accept-dns=true

  tags:
    Name: cntlp-aws-wk-98
    org: cntlp
    owner: team-platform
    managed-by: karpenter
    lifecycle: permanent
    platform: aws
    component: transcode
    role: service
---
