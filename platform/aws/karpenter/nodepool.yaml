apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: aws-audio-burst-98
spec:
  template:
    metadata:
      labels:
        platform: aws
        role: service
        cantaloupe.io/node-purpose: audio-burst
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: aws-audio-burst-98
      # Audio Burst 외 일반 Service가 남아 WhenEmpty 축소를 막지 않게 한다.
      taints:
        - key: cantaloupe.io/audio-burst
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t3.small]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [ap-northeast-2a]
      expireAfter: Never
      terminationGracePeriod: 5m

  # 예약 이름 하나만 소유한다. Pending Pod가 없으면 Node를 유지하지 않는다.
  limits:
    nodes: 1

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
    budgets:
      - nodes: "1"
        reasons: [Empty]
      - nodes: "0"
        reasons: [Drifted, Underutilized]
