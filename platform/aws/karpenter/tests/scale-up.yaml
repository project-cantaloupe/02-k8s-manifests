apiVersion: v1
kind: Pod
metadata:
  name: karpenter-scale-up
  namespace: apps
  labels:
    app: karpenter-scale-up
    area: apps
    platform: aws
spec:
  restartPolicy: Never
  nodeSelector:
    cantaloupe.io/node-purpose: audio-burst
  tolerations:
    - key: cantaloupe.io/audio-burst
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10.1
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
