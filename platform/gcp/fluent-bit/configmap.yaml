apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app: fluent-bit
    area: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # 모든 노드의 CRI 컨테이너 로그를 읽는다. DaemonSet이므로 노드당 1개만 실행된다.
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Parser            cri
        DB                /fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # Pod/Namespace 메타데이터(라벨, namespace, pod, container)를 붙인다.
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Labels              On
        Annotations         Off
        Namespace_Labels    On
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # 어느 노드에서 수집했는지 보존한다. platform 라벨은 앱 Pod 라벨에 있으면
    # kubernetes.labels.platform으로 함께 들어가며, 없는 워크로드는 node 기준으로 구분한다.
    [FILTER]
        Name    record_modifier
        Match   kube.*
        Record  collector_node ${NODE_NAME}

    # Collect every workload namespace. kube-system and default are deliberately
    # excluded; Calico is retained below for warning/error network events.
    [FILTER]
        Name   grep
        Match  kube.*
        Exclude $kubernetes['namespace_name'] ^(kube-system|default)$

    # Re-tag only the Audio processing path. audio-web remains outside the
    # FinOps application index because it does not create upload/transcode
    # workload facts. false prevents duplicate storage in the platform index.
    [FILTER]
        Name   rewrite_tag
        Match  kube.*
        Rule   $kubernetes['labels']['app'] ^(audio-api|audio-events|audio-transcode)$ app.$TAG false
        Rule   $kubernetes['namespace_name'] ^audio-ingress$ app.$TAG false

    # Harbor Portal emits NGINX access logs to stdout. Parse only matching
    # lines; all other records retain their original `log` field unchanged.
    [FILTER]
        Name           parser
        Match          kube.*
        Key_Name       log
        Parser         harbor_nginx
        Reserve_Data   On
        Preserve_Key   On

    # Istio 1.30 gateway access logs use the Envoy default text format even
    # when ProxyConfig JSON fields are present. Parse only application-tagged
    # records; non-matching structured application JSON passes through intact.
    [FILTER]
        Name           parser
        Match          app.*
        Key_Name       log
        Parser         istio_access
        Reserve_Data   On
        Preserve_Key   On

    # Dashboard query fields are flattened here while the original `log` and
    # Kubernetes metadata are retained for incident investigation.
    [FILTER]
        Name    lua
        Match   *
        Script  /fluent-bit/etc/platform-normalize.lua
        Call    normalize

    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master.logging.svc.cluster.local
        Port                9200
        Index               cantaloupe-platform-logs-v2
        Suppress_Type_Name  On
        Generate_ID         On
        Retry_Limit         False
        tls                 Off

    [OUTPUT]
        Name                opensearch
        Match               app.*
        Host                opensearch-cluster-master.logging.svc.cluster.local
        Port                9200
        Index               cantaloupe-app-logs-v1
        Suppress_Type_Name  On
        Generate_ID         On
        Retry_Limit         False
        tls                 Off
  parsers.conf: |
    [PARSER]
        Name         cri
        Format       regex
        Regex        ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]+) (?<log>.*)$
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    [PARSER]
        Name         harbor_nginx
        Format       regex
        Regex        ^(?<http_client_ip>[^ ]+) - (?<http_user>[^ ]+) \[(?<http_request_time>[^\]]+)\] "(?<http_method>[^ ]+) (?<http_path>[^ ]+) [^"]+" (?<http_status>[0-9]{3}) (?<http_response_bytes>[0-9]+) "(?<http_referer>[^"]*)" "(?<http_user_agent>[^"]*)" "(?<http_forwarded_for>[^"]*)"$
        Types        http_status:integer http_response_bytes:integer
    # Field order follows Istio's default access-log format. Three captures
    # were unnamed until the WAF work needed them:
    #   response_code_details  separates a WAF denial from an Istio RBAC
    #                          denial when both answer 403
    #   http_client_ip         X-Forwarded-For. Masked in Lua before indexing
    #   http_user_agent        scanner attribution
    # → tasks/todo/023_waf-blocking-and-siem.md
    [PARSER]
        Name         istio_access
        Format       regex
        Regex        ^\[[^\]]+\] "(?<http_method>[^ ]+) (?<http_route>[^ ?]+)(?:\?[^ ]*)? [^"]+" (?<http_status>[0-9]{3}) (?<response_flags>[^ ]+) (?<response_code_details>[^ ]+) [^ ]+ "[^"]*" [0-9]+ [0-9]+ (?<processing_duration_ms>[0-9]+) [^ ]+ "(?<http_client_ip>[^"]*)" "(?<http_user_agent>[^"]*)" "(?<request_id>[^"]*)" "[^"]*" "[^"]*" (?<upstream_service>[^ ]+) .*$
        Types        http_status:integer processing_duration_ms:integer
  platform-normalize.lua: |
    -- Common schema for platform log dashboards. `collector_platform` is
    -- read once from the node label captured by the init container.
    local collector_platform = nil

    local function get_collector_platform()
      if collector_platform ~= nil then
        return collector_platform
      end

      local file = io.open("/fluent-bit/state/collector_platform", "r")
      if file == nil then
        collector_platform = "unknown"
        return collector_platform
      end

      collector_platform = file:read("*l") or "unknown"
      file:close()
      return collector_platform
    end

    local function normalize_harbor_route(path)
      if string.match(path, "^/v2/.+/blobs/uploads") then
        return "/v2/*/blobs/uploads"
      elseif string.match(path, "^/v2/.+/blobs/") then
        return "/v2/*/blobs/*"
      elseif string.match(path, "^/v2/.+/manifests/") then
        return "/v2/*/manifests/*"
      elseif string.match(path, "^/v2/") then
        return "/v2/*"
      end

      return path
    end

    -- PII is removed before the record leaves Fluent Bit. These masks are
    -- deliberately non-reversible. They provide coarse correlation only; a
    -- future keyed HMAC implementation must use a Secret-backed key rather
    -- than an unsalted digest.
    local function mask_principal(value)
      if value == nil or value == "" or value == "null" then
        return nil
      end

      local first, domain = string.match(value, "^(.).+@([^@]+)$")
      if first ~= nil then
        return string.lower(first) .. "***@" .. string.lower(string.sub(domain, 1, 1)) .. "***"
      end

      return string.sub(value, 1, 1) .. "***"
    end

    local function mask_ip(value)
      if value == nil or value == "" then
        return nil
      end

      local a, b, c = string.match(value, "^(%d+)%.(%d+)%.(%d+)%.%d+$")
      if a ~= nil then
        return a .. "." .. b .. "." .. c .. ".0/24"
      end

      local h1, h2, h3, h4 = string.match(value, "^([^:]+):([^:]+):([^:]+):([^:]+):")
      if h1 ~= nil then
        return h1 .. ":" .. h2 .. ":" .. h3 .. ":" .. h4 .. "::/64"
      end

      return "[redacted]"
    end

    local function sanitize_message(message, source_network)
      local sanitized = message
      sanitized = string.gsub(sanitized, "[%w%.%_%+%-]+@[%w%.%-]+%.[%a]+", "[redacted-email]")
      sanitized = string.gsub(sanitized, 'username="[^"]*"', 'username="[redacted]"')
      sanitized = string.gsub(sanitized, 'userId="[^"]*"', 'userId="[redacted]"')
      sanitized = string.gsub(sanitized, 'code_id="[^"]*"', 'code_id="[redacted]"')
      sanitized = string.gsub(sanitized, "email in id_token %([^%)]*%)", "email in id_token ([redacted])")
      sanitized = string.gsub(sanitized, "([?&]code=)[^&%s\"]+", "%1[redacted]")
      if source_network ~= nil then
        sanitized = string.gsub(sanitized, 'ipAddress="[^"]*"', 'ipAddress="' .. source_network .. '"')
      else
        sanitized = string.gsub(sanitized, 'ipAddress="[^"]*"', 'ipAddress="[redacted]"')
      end
      return sanitized
    end

    local function parse_keycloak_security(normalized, message)
      if normalized["app"] ~= "keycloak" then
        return false
      end

      local event_type = string.match(message, 'type="([A-Z_]+)"')
      if event_type == nil or string.find(message, "org.keycloak.events", 1, true) == nil then
        normalized["message"] = sanitize_message(message, nil)
        return false
      end

      normalized["security_event_type"] = "keycloak_" .. string.lower(event_type)
      normalized["auth_result"] = string.find(event_type, "ERROR", 1, true) and "failure" or "success"
      normalized["realm"] = string.match(message, 'realmName="([^"]+)"')
      normalized["client_id"] = string.match(message, 'clientId="([^"]+)"')
      normalized["error_code"] = string.match(message, 'error="([^"]+)"')

      local principal = string.match(message, 'username="([^"]+)"')
        or string.match(message, 'email="([^"]+)"')
      normalized["principal_masked"] = mask_principal(principal)

      local source_ip = string.match(message, 'ipAddress="([^"]+)"')
      normalized["source_network"] = mask_ip(source_ip)
      normalized["message"] = sanitize_message(message, normalized["source_network"])
      return true
    end

    local function parse_oauth2_security(normalized, message)
      if normalized["app"] ~= "oauth2-proxy" then
        return false
      end

      -- oauth2-proxy access lines place the user-agent between the request and
      -- response status, so extract each value independently.
      local method = string.match(message, '%s([A-Z]+)%s+%-%s+"')
      local route = string.match(message, '%-%s+"([^%s%?"]+)')
      local http_status = string.match(message, 'HTTP/[^%s]+%s+"[^"]*"%s+(%d%d%d)%s')
      if method ~= nil then
        normalized["http_method"] = method
        normalized["http_route"] = string.match(route, "^[^?]+") or route
        normalized["http_status"] = tonumber(http_status)
        normalized["http_status_class"] = string.sub(http_status, 1, 1) .. "xx"
      end

      local is_security_event = false
      if string.find(message, "AuthSuccess", 1, true) then
        normalized["security_event_type"] = "oauth_authentication"
        normalized["auth_result"] = "success"
        is_security_event = true
      elseif string.find(message, "AuthFailure", 1, true)
        or string.find(message, "No valid authentication", 1, true) then
        normalized["security_event_type"] = "oauth_authentication"
        normalized["auth_result"] = "failure"
        normalized["error_code"] = "authentication_required"
        is_security_event = true
      elseif string.find(message, "Error redeeming code", 1, true)
        or (route == "/oauth2/callback" and http_status ~= nil
          and tonumber(http_status) >= 400) then
        normalized["security_event_type"] = "oauth_callback"
        normalized["auth_result"] = "failure"
        if string.find(message, "Error redeeming code", 1, true) then
          normalized["error_code"] = "code_redemption_failed"
        else
          normalized["error_code"] = "callback_http_error"
        end
        is_security_event = true
      end

      if is_security_event then
        -- This OAuth2 Proxy deployment is dedicated to the OpenSearch
        -- Dashboards OIDC client, so access-log events can be attributed to
        -- the configured client even though the client ID is not printed.
        normalized["client_id"] = "opensearch-dashboards"
      end

      local email = string.match(message, "([%w%.%_%+%-]+@[%w%.%-]+%.[%a]+)")
      normalized["principal_masked"] = mask_principal(email)
      local source_ip = string.match(message, "^(%d+%.%d+%.%d+%.%d+)")
      local source_network = mask_ip(source_ip)
      normalized["source_network"] = source_network

      local sanitized = sanitize_message(message, nil)
      if source_ip ~= nil and source_network ~= nil then
        local escaped_source_ip = string.gsub(source_ip, "(%W)", "%%%1")
        sanitized = string.gsub(sanitized, "^" .. escaped_source_ip, source_network, 1)
      end
      normalized["message"] = sanitized
      return is_security_event
    end

    local function parse_kyverno_security(normalized, message)
      if normalized["namespace"] ~= "kyverno" then
        return false
      end

      local policy = string.match(message, "policy=([^%s]+)")
      if policy == nil then
        return false
      end

      normalized["policy_name"] = policy
      normalized["policy_result"] = string.lower(string.match(message, "result=([^%s]+)") or "unknown")
      normalized["rule_name"] = string.match(message, "rule=([^%s]+)")

      -- Successful policy evaluation is operational telemetry, not a security
      -- event. Only retain an event type when the log explicitly reports a
      -- failed, denied, blocked, or errored policy decision.
      local result = normalized["policy_result"]
      if result == "fail" or result == "failed" or result == "deny"
        or result == "denied" or result == "block" or result == "blocked"
        or result == "error" then
        normalized["security_event_type"] = "kyverno_policy_violation"
        return true
      end

      return false
    end

    -- Coraza WAF runs as a proxy-wasm filter inside the audio-ingress Envoy,
    -- so its ModSecurity-style audit lines arrive on the gateway's stderr
    -- wrapped by Envoy. The payload starts after `wasm log <plugin>: ` and
    -- carries rule metadata as sparse [key "value"] pairs.
    --
    -- This lives in Lua rather than a regex PARSER because one line holds a
    -- variable number of [tag "..."] pairs and the keys of interest are
    -- sparse — the same reason Keycloak and Kyverno events are parsed here.
    local function parse_coraza_security(normalized, message)
      if string.find(message, "Coraza:", 1, true) == nil then
        return false
      end

      -- Plugin lifecycle lines ("initializing", "fetching image") mention
      -- Coraza without carrying a rule hit. Only rule hits are security events.
      local rule_id = string.match(message, '%[id "(%d+)"%]')
      if rule_id == nil then
        return false
      end

      normalized["security_event_type"] = "waf_rule_match"
      normalized["waf_rule_id"] = rule_id
      normalized["waf_msg"] = string.match(message, '%[msg "([^"]*)"%]')
      normalized["waf_severity"] = string.match(message, '%[severity "([^"]*)"%]')
      normalized["waf_uri"] = string.match(message, '%[uri "([^"]*)"%]')
      normalized["waf_crs_version"] = string.match(message, '%[ver "([^"]*)"%]')

      -- `@owasp_crs/REQUEST-942-APPLICATION-ATTACK-SQLI.conf` — the file name
      -- is the attack family and is what the dashboard groups by. Grouping by
      -- rule ID alone produces one bucket per variant of the same attack.
      normalized["waf_rule_group"] = string.match(message, '%[file "[^"]*/([^"/]+)%.conf"%]')

      -- Only the 949xxx blocking-evaluation rules carry the running total.
      -- CRS scores by severity (critical 5, error 4, warning 3, notice 2) and
      -- blocks at 5, so this value is what decides pass or deny.
      local score = string.match(message, "Total Score: (%d+)")
      if score ~= nil then
        normalized["waf_anomaly_score"] = tonumber(score)
      end

      -- DetectionOnly logs `Coraza: Warning.`; SecRuleEngine On logs
      -- `Coraza: Access denied (phase N).`. This field is how the dashboard
      -- shows the detection→blocking cutover without reading rule IDs.
      if string.find(message, "Access denied", 1, true) then
        normalized["waf_action"] = "blocked"
      else
        normalized["waf_action"] = "detected"
      end

      -- ⚠️ Full source address is retained for WAF records only, unlike every
      -- other source IP in this pipeline. These are by definition requests
      -- that matched an attack signature, and IP-level response (blocklist,
      -- rate limit, repeat-offender correlation) is the whole reason
      -- externalTrafficPolicy was set to Local. A /24 mask would put unrelated
      -- hosts in the same bucket and make a blocklist unusable.
      -- Access-log client IPs stay masked → `source_network`.
      -- → decisions/20260812_waf-blocking-and-siem.md
      local client_ip = string.match(message, '%[client "([^"]+)"%]')
      normalized["waf_client_ip"] = client_ip
      normalized["source_network"] = mask_ip(client_ip)
      return true
    end

    function normalize(tag, timestamp, record)
      local kubernetes = record["kubernetes"] or {}
      local pod_labels = kubernetes["labels"] or {}
      local namespace_metadata = record["kubernetes_namespace"] or {}
      local namespace_labels = namespace_metadata["labels"] or {}

      local normalized = {}
      normalized["namespace"] = kubernetes["namespace_name"] or "unknown"
      normalized["area"] = pod_labels["area"] or namespace_labels["area"] or "unknown"
      normalized["app"] = pod_labels["app"] or pod_labels["app.kubernetes.io/name"] or kubernetes["container_name"] or "unknown"
      normalized["collector_platform"] = get_collector_platform()
      normalized["collector_node"] = record["collector_node"] or "unknown"
      normalized["pod"] = kubernetes["pod_name"] or "unknown"
      normalized["container"] = kubernetes["container_name"] or "unknown"
      normalized["log_category"] = string.match(tag, "^app%.") and "application" or "platform"
      -- Structured application logs provide their own severity. NGINX access
      -- logs do not, so derive a consistent severity from their HTTP status.
      -- Keep 4xx as warning because many client errors (for example 401/404)
      -- are not platform failures; 5xx is a server-side error.
      local raw_message = record["msg"] or record["message"] or record["log"] or ""
      normalized["message"] = raw_message
      -- Approximate bytes accepted from the source record. This is an ingest
      -- volume measure for ownership/trend analysis, not Lucene disk usage.
      normalized["ingest_bytes"] = string.len(raw_message)
      parse_keycloak_security(normalized, raw_message)
      parse_oauth2_security(normalized, raw_message)
      parse_kyverno_security(normalized, raw_message)
      parse_coraza_security(normalized, raw_message)

      local http_status = tonumber(record["http_status"] or normalized["http_status"])
      if http_status == nil then
        -- Generic NGINX/HTTP access fallback. Dedicated parsers remain the
        -- source of structured route/method fields; this only derives level.
        http_status = tonumber(string.match(raw_message, '"%s+(%d%d%d)%s+%d+'))
      end
      if http_status ~= nil then
        normalized["http_status_class"] = tostring(math.floor(http_status / 100)) .. "xx"
        if http_status >= 500 then
          normalized["level"] = "error"
        elseif http_status >= 400 then
          normalized["level"] = "warning"
        else
          normalized["level"] = "info"
        end
        normalized["level_source"] = "http_status"
      else
        local nested_log = type(record["log"]) == "table" and record["log"] or {}
        local declared_level = string.lower(tostring(
          record["level"] or record["log.level"] or nested_log["level"]
          or record["severity"] or record["severity_text"] or ""))
        declared_level = string.match(declared_level, "^%s*(.-)%s*$")
        local message_lower = string.lower(normalized["message"])
        local klog_level = string.match(raw_message, "^([IWEF])%d%d%d%d%s")
        local text_level = string.match(message_lower, "[%s%p]level[=:][%s\"]*([%a]+)")
          or string.match(message_lower, "^%S+%s+([%a]+)%s")
        local accepted_text_levels = {
          debug=true, trace=true, info=true, notice=true, warn=true,
          warning=true, error=true, err=true, fatal=true, critical=true
        }
        if text_level ~= nil and not accepted_text_levels[text_level] then
          text_level = nil
        end
        if declared_level ~= "" then
          if declared_level == "warn" then declared_level = "warning" end
          if declared_level == "err" or declared_level == "fatal" or declared_level == "critical" then declared_level = "error" end
          normalized["level"] = declared_level
          normalized["level_source"] = "declared"
        elseif klog_level ~= nil then
          normalized["level"] = ({ I="info", W="warning", E="error", F="error" })[klog_level]
          normalized["level_source"] = "klog_prefix"
        elseif text_level ~= nil then
          if text_level == "warn" then text_level = "warning" end
          if text_level == "err" or text_level == "fatal" or text_level == "critical" then text_level = "error" end
          if text_level == "debug" or text_level == "trace" or text_level == "notice" then text_level = "info" end
          normalized["level"] = text_level
          normalized["level_source"] = "message_level"
        elseif string.find(message_lower, "error", 1, true)
          or string.find(message_lower, "fatal", 1, true)
          or string.find(message_lower, "exception", 1, true)
          or string.find(message_lower, "failed", 1, true) then
          normalized["level"] = "error"
          normalized["level_source"] = "message_signal"
        elseif string.find(message_lower, "warn", 1, true) then
          normalized["level"] = "warning"
          normalized["level_source"] = "message_signal"
        elseif raw_message ~= "" then
          -- A non-empty stdout record without severity or risk indicators is
          -- normal operational output. Keep the inference explicit so it can
          -- be audited separately from a declared info level.
          normalized["level"] = "info"
          normalized["level_source"] = "default_info"
        else
          normalized["level"] = "unknown"
          normalized["level_source"] = "parser_failure"
        end
      end

      -- Calico CNI is needed for network incident diagnosis, but its normal
      -- connection/status traffic is too high-volume to retain. Keep only
      -- classified warning/error records from calico-system.
      if normalized["namespace"] == "calico-system"
        and normalized["level"] ~= "warning"
        and normalized["level"] ~= "error" then
        return -1, timestamp, record
      end

      -- Avoid storing high-cardinality image digests as a separate parsed
      -- field. The original request line remains available in `log`.
      if normalized["app"] == "harbor-portal" and record["http_status"] ~= nil then
        normalized["http_status"] = record["http_status"]
        normalized["http_method"] = record["http_method"]
        normalized["http_route"] = normalize_harbor_route(record["http_path"])
      end

      -- Preserve only explicitly approved application fields. Arbitrary JSON
      -- keys are never indexed, avoiding mapping churn and sensitive payloads.
      local application_fields = {
        "event_type", "status", "request_id", "job_id", "audio_id", "attempt", "retry_count",
        "audio_duration_ms", "processing_duration_ms", "input_bytes", "output_bytes",
        "error_code", "retryable", "visibility", "content_type", "upstream_service"
      }
      for _, field in ipairs(application_fields) do
        if record[field] ~= nil then
          normalized[field] = record[field]
        end
      end

      if normalized["log_category"] == "application" and record["http_status"] ~= nil then
        normalized["http_status"] = record["http_status"]
        normalized["http_method"] = record["http_method"]
        normalized["http_route"] = record["http_route"]
        if normalized["namespace"] == "audio-ingress" then
          normalized["event_type"] = "ingress_request_completed"
          normalized["status"] = tonumber(record["http_status"]) < 400 and "success" or "error"
          normalized["message"] = "ingress request completed"
          -- Envoy states why a request ended the way it did. Without this a
          -- 403 from the WAF and a 403 from Istio RBAC are indistinguishable
          -- in the index, and the WAF dashboard would over-count blocks.
          normalized["response_code_details"] = record["response_code_details"]
          normalized["response_flags"] = record["response_flags"]
          normalized["http_user_agent"] = record["http_user_agent"]
          -- Masked, unlike `waf_client_ip`. Access logs cover every visitor
          -- including real users; WAF records cover attack traffic only.
          local client_ip = record["http_client_ip"]
          if client_ip ~= nil and client_ip ~= "-" and client_ip ~= "" then
            normalized["source_network"] = mask_ip(client_ip)
          end
        end
      end

      return 1, timestamp, normalized
    end
