apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app: fluent-bit
    area: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # 모든 노드의 CRI 컨테이너 로그를 읽는다. DaemonSet이므로 노드당 1개만 실행된다.
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Parser            cri
        DB                /fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # Pod/Namespace 메타데이터(라벨, namespace, pod, container)를 붙인다.
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Labels              On
        Annotations         Off
        Namespace_Labels    On
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # 어느 노드에서 수집했는지 보존한다. platform 라벨은 앱 Pod 라벨에 있으면
    # kubernetes.labels.platform으로 함께 들어가며, 없는 워크로드는 node 기준으로 구분한다.
    [FILTER]
        Name    record_modifier
        Match   kube.*
        Record  collector_node ${NODE_NAME}

    # Keep only the operational namespaces in the platform index. Audio app
    # JSON logs will be added later as a separate, longer-retained index.
    [FILTER]
        Name   grep
        Match  kube.*
        Regex  $kubernetes['namespace_name'] ^(logging|devops|istio-system)$

    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master.logging.svc.cluster.local
        Port                9200
        Index               cantaloupe-platform-logs
        Suppress_Type_Name  On
        Generate_ID         On
        Retry_Limit         False
        tls                 Off
  parsers.conf: |
    [PARSER]
        Name         cri
        Format       regex
        Regex        ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]+) (?<log>.*)$
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
