[FILTER]
    Name           parser
    Match          app.access.*
    Key_Name       log
    Parser         istio_access
    Reserve_Data   On
    Preserve_Key   On

[FILTER]
    Name          lua
    Match         app.*
    script        /test/platform-normalize.lua
    call          normalize
    time_as_table true

[OUTPUT]
    Name          stdout
    Match         app.*
    Format        json_lines
