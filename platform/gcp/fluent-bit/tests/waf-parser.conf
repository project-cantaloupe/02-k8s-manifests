# Coraza WAF parsing dry run. Build the ConfigMap from THIS file plus the
# live `platform-normalize.lua` and `parsers.conf` out of ../configmap.yaml,
# so the code under test is byte-identical to what ships:
#
#   kubectl -n logging create configmap waf-parser-dry-run \
#     --from-file=waf-parser.conf \
#     --from-file=<(yq '.data."platform-normalize.lua"' ../configmap.yaml) \
#     --from-file=<(yq '.data."parsers.conf"' ../configmap.yaml)
#   kubectl apply -f waf-parser-pod.yaml && kubectl -n logging logs -f waf-parser-dry-run
#
# The pod ends on activeDeadlineSeconds (dummy inputs never stop), so
# `Failed` is the expected phase — read the stdout records, not the phase.
[SERVICE]
    Flush         1
    Log_Level     error
    Parsers_File  parsers.conf

