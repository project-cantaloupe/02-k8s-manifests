apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluent-bit
  labels:
    app: fluent-bit
    area: logging
    component: metrics
    platform: gcp
spec:
  selector:
    matchLabels:
      app: fluent-bit
      component: metrics
  namespaceSelector:
    matchNames:
      - logging
  endpoints:
    - port: metrics
      path: /api/v1/metrics/prometheus
      interval: 30s
      scrapeTimeout: 10s
