apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app: fluent-bit
    area: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      annotations:
        fluentbit.io/exclude: "true"
        checksum/fluent-bit-config: "harbor-parser-v1"
      labels:
        app: fluent-bit
        area: logging
    spec:
      serviceAccountName: fluent-bit
      # AWS control-plane의 NoSchedule taint를 포함해 모든 현재 노드에 1개씩 배치한다.
      tolerations:
        - operator: Exists
      initContainers:
        - name: read-node-platform
          image: curlimages/curl:8.10.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          command:
            - /bin/sh
            - -ec
            - |
              api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              platform=$(curl --fail --silent --show-error \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -H "Authorization: Bearer ${token}" \
                "${api}/api/v1/nodes/${NODE_NAME}" \
                | sed -n 's/.*"platform"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

              test -n "${platform}"
              printf '%s\n' "${platform}" > /fluent-bit/state/collector_platform
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: state
              mountPath: /fluent-bit/state
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.1.9
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 2020
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
            - name: state
              mountPath: /fluent-bit/state
      terminationGracePeriodSeconds: 30
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: config
          configMap:
            name: fluent-bit-config
        - name: state
          emptyDir: {}
