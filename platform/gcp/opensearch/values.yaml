clusterName: "opensearch-cluster"
singleNode: true
replicas: 1

# 내부 smoke 단계에서는 TLS/인증서를 아직 배포하지 않았으므로 클러스터 내부 HTTP만
# 사용한다. 외부 노출은 하지 않으며, 운영 전에는 Secret 기반 인증·TLS로 교체한다.
protocol: http
config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    plugins.security.disabled: true
securityConfig:
  enabled: false

# chart가 제공하는 init container로 vm.max_map_count를 설정한다.
sysctlInit:
  enabled: true

# The chart applies initResources to configfile, fsgroup-volume, and sysctl.
# These short-lived setup containers still need scheduling inputs for the
# FinOps resource policy.
initResources:
  requests:
    cpu: "25m"
    memory: "64Mi"
  limits:
    memory: "128Mi"

persistence:
  enabled: true
  enableInitChown: true
  storageClass: "gcp-pd-retain"
  size: "30Gi"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    memory: "2Gi"

# Cantaloupe workload identity/cost-allocation labels. The chart propagates
# these labels to the StatefulSet pod template without changing its selector.
labels:
  app: opensearch
  area: logging
  platform: gcp

nodeSelector:
  platform: gcp
  role: logging
