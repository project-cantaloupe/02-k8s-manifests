apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-ism-policies
  labels:
    app: opensearch
    area: logging
data:
  platform-retention-policy.json: |
    {
      "policy": {
        "description": "Delete platform logs after seven days to cap GCP Persistent Disk usage.",
        "default_state": "hot",
        "ism_template": [
          {
            "index_patterns": ["cantaloupe-platform-logs"],
            "priority": 100
          }
        ],
        "states": [
          {
            "name": "hot",
            "actions": [],
            "transitions": [
              {
                "state_name": "delete",
                "conditions": {
                  "min_index_age": "7d"
                }
              }
            ]
          },
          {
            "name": "delete",
            "actions": [
              {
                "delete": {}
              }
            ],
            "transitions": []
          }
        ]
      }
    }
  platform-index-template.json: |
    {
      "index_patterns": ["cantaloupe-platform-logs"],
      "priority": 100,
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0
        }
      }
    }
