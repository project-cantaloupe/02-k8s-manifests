apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-ism-apply
  namespace: logging
  labels:
    app: opensearch-ism-apply
    area: logging
    platform: gcp
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: opensearch-ism-apply
        area: logging
        platform: gcp
    spec:
      nodeSelector:
        platform: gcp
        role: logging
      restartPolicy: Never
      containers:
        - name: apply-policy
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -ec
            - |
              endpoint=http://opensearch-cluster-master.logging.svc.cluster.local:9200
              policy=cantaloupe-platform-retention

              wait_attempt=0
              until curl --fail --silent --show-error "$endpoint/_cluster/health" >/dev/null; do
                wait_attempt=$((wait_attempt + 1))
                if [ "$wait_attempt" -ge 60 ]; then
                  echo "OpenSearch did not become ready within 300 seconds" >&2
                  exit 1
                fi
                echo "Waiting for OpenSearch..."
                sleep 5
              done

              existing=$(mktemp)
              status=$(curl --silent --output "$existing" --write-out '%{http_code}' \
                "$endpoint/_plugins/_ism/policies/$policy")

              if [ "$status" = "200" ]; then
                sequence=$(sed -n 's/.*"_seq_no"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)
                primary=$(sed -n 's/.*"_primary_term"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)

                if [ -z "$sequence" ] || [ -z "$primary" ]; then
                  echo "Failed to extract ISM concurrency metadata" >&2
                  cat "$existing" >&2
                  exit 1
                fi

                echo "Updating ISM policy: policy=$policy seq_no=$sequence primary_term=$primary"
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy?if_seq_no=$sequence&if_primary_term=$primary" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/platform-retention-policy.json)
              elif [ "$status" = "404" ]; then
                echo "Creating ISM policy: policy=$policy"
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/platform-retention-policy.json)
              else
                echo "Failed to read ISM policy: HTTP $status" >&2
                cat "$existing" >&2
                exit 1
              fi

              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply ISM policy: HTTP $status" >&2
                exit 1
              fi

              echo "Applying index template: cantaloupe-platform-logs-v2"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/_index_template/cantaloupe-platform-logs-v2" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/platform-index-template.json)

              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply index template: HTTP $status" >&2
                exit 1
              fi

              echo "Applying structured security fields to the current platform index"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/cantaloupe-platform-logs-v2/_mapping" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/platform-current-mapping.json)
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply platform index mapping: HTTP $status" >&2
                exit 1
              fi

              policy=cantaloupe-app-retention
              existing=$(mktemp)
              status=$(curl --silent --output "$existing" --write-out '%{http_code}' \
                "$endpoint/_plugins/_ism/policies/$policy")

              if [ "$status" = "200" ]; then
                sequence=$(sed -n 's/.*"_seq_no"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)
                primary=$(sed -n 's/.*"_primary_term"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)
                if [ -z "$sequence" ] || [ -z "$primary" ]; then
                  echo "Failed to extract app ISM concurrency metadata" >&2
                  cat "$existing" >&2
                  exit 1
                fi
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy?if_seq_no=$sequence&if_primary_term=$primary" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/app-retention-policy.json)
              elif [ "$status" = "404" ]; then
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/app-retention-policy.json)
              else
                echo "Failed to read app ISM policy: HTTP $status" >&2
                cat "$existing" >&2
                exit 1
              fi
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply app ISM policy: HTTP $status" >&2
                exit 1
              fi

              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/_index_template/cantaloupe-app-logs-v1" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/app-index-template.json)
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply app index template: HTTP $status" >&2
                exit 1
              fi

              echo "Applying WAF and ingress fields to the current app index"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/cantaloupe-app-logs-v1/_mapping" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/app-current-mapping.json)
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply app index mapping: HTTP $status" >&2
                exit 1
              fi

              policy=cantaloupe-security-retention
              existing=$(mktemp)
              status=$(curl --silent --output "$existing" --write-out '%{http_code}' \
                "$endpoint/_plugins/_ism/policies/$policy")

              if [ "$status" = "200" ]; then
                sequence=$(sed -n 's/.*"_seq_no"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)
                primary=$(sed -n 's/.*"_primary_term"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$existing" | head -n1)
                if [ -z "$sequence" ] || [ -z "$primary" ]; then
                  echo "Failed to extract security ISM concurrency metadata" >&2
                  cat "$existing" >&2
                  exit 1
                fi
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy?if_seq_no=$sequence&if_primary_term=$primary" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/security-retention-policy.json)
              elif [ "$status" = "404" ]; then
                response=$(mktemp)
                status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                  "$endpoint/_plugins/_ism/policies/$policy" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/policy/security-retention-policy.json)
              else
                echo "Failed to read security ISM policy: HTTP $status" >&2
                cat "$existing" >&2
                exit 1
              fi
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply security ISM policy: HTTP $status" >&2
                exit 1
              fi

              echo "Applying index template: cantaloupe-security-v1"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/_index_template/cantaloupe-security-v1" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/security-index-template.json)
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply security index template: HTTP $status" >&2
                exit 1
              fi

              # An index template only governs indices created after it. The
              # security index already exists, so the Trivy fields are also
              # pushed onto the live mapping. That covers additive fields only;
              # a field whose type was already guessed wrong by dynamic mapping
              # cannot be corrected this way and needs a reindex.
              echo "Applying Trivy fields to the current security index"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PUT \
                "$endpoint/cantaloupe-security-v1/_mapping" \
                -H 'Content-Type: application/json' \
                --data-binary @/policy/security-current-mapping.json)
              cat "$response"
              echo
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                echo "Failed to apply security index mapping: HTTP $status" >&2
                exit 1
              fi

              echo "Removing legacy index template: cantaloupe-platform-logs"
              response=$(mktemp)
              status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X DELETE \
                "$endpoint/_index_template/cantaloupe-platform-logs")

              cat "$response"
              echo
              if { [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; } && [ "$status" != "404" ]; then
                echo "Failed to remove legacy index template: HTTP $status" >&2
                exit 1
              fi

              echo "OpenSearch ISM policies and index templates applied successfully"
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: policy
          configMap:
            name: opensearch-ism-policies
