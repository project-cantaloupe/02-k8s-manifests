- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    name: cantaloupe-pricing-integrity
    namespace: monitoring
    labels:
      release: monitoring
      app: opencost
      area: monitoring
  spec:
    groups:
    - name: cantaloupe.finops.pricing
      interval: 1m
      rules:
      - record: cantaloupe:node_catalog_expected_cost_per_hour
        expr: "0.117710000 * max by (node) (kube_node_labels{label_platform=\"aws\",label_topology_kubernetes_io_region=\"\
          ap-northeast-2\",label_node_kubernetes_io_instance_type=\"m7i-flex.large\"})\n  or\n0.026000000 * max by (node)\
          \ (kube_node_labels{label_platform=\"aws\",label_topology_kubernetes_io_region=\"ap-northeast-2\",label_node_kubernetes_io_instance_type=\"\
          t3.small\"})\n  or\n0.149116800 * max by (node) (kube_node_labels{label_platform=\"gcp\",label_topology_kubernetes_io_region=\"\
          asia-northeast3\",label_node_kubernetes_io_instance_type=\"e2-custom-4-8192\"})\n  or\n0.171928000 * max by (node)\
          \ (kube_node_labels{label_platform=\"gcp\",label_topology_kubernetes_io_region=\"asia-northeast3\",label_node_kubernetes_io_instance_type=\"\
          e2-standard-4\"})\n  or\n0.060000000 * max by (node) (kube_node_labels{label_platform=\"onp\",label_topology_kubernetes_io_region=\"\
          on-premise\",label_node_kubernetes_io_instance_type=\"custom-8vcpu-16gib\"})"
      - record: cantaloupe:pricing_catalog_last_review_timestamp_seconds
        expr: vector(1785974400)
      - alert: OpenCostPricingCoverageIncomplete
        expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 1) unless on (node) cantaloupe:node_catalog_expected_cost_per_hour
        for: 5m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: 가격표에 등록되지 않은 Kubernetes 노드가 있습니다
          description: Ready 노드의 platform, region, instance-type 조합이 OpenCost 가격 카탈로그와 일치하지 않습니다.
          action: 노드 라벨을 확인하고 공식 가격을 조사한 뒤 pricing-catalog.yaml에 추가하고 generate_pricing.py를 실행하세요.
      - alert: OpenCostNodePriceMismatch
        expr: abs(max by (node) (node_total_hourly_cost) - on (node) cantaloupe:node_catalog_expected_cost_per_hour) > 0.0005
        for: 10m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: OpenCost 적용 가격과 가격표가 일치하지 않습니다
          description: 생성된 CSV 가격과 node_total_hourly_cost 차이가 시간당 $0.0005를 초과했습니다.
          action: OpenCost Pod의 가격표 checksum과 ConfigMap을 확인하고 Argo CD Sync 및 Pod 재시작 상태를 점검하세요.
      - alert: OpenCostNodePricingLabelsMissing
        expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 1) unless on (node) max by (node)
          (kube_node_labels{label_platform!="",label_role!="",label_topology_kubernetes_io_region!="",label_node_kubernetes_io_instance_type!=""})
        for: 5m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: Ready 노드에 필수 FinOps 라벨이 없습니다
          description: platform, role, topology.kubernetes.io/region 또는 node.kubernetes.io/instance-type이 누락됐습니다.
          action: 01 인프라의 site-node-labels/site-verify 결과를 확인하고 누락 라벨을 보정하세요.
      - alert: OpenCostInstanceTypeMetadataMissing
        expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 1) unless on (node) max by (node)
          (node_total_hourly_cost{instance_type!=""})
        for: 10m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: OpenCost 노드 사양 메타데이터가 없습니다
          description: OpenCost 비용 메트릭의 instance_type 값이 비어 있습니다.
          action: Node의 node.kubernetes.io/instance-type 라벨과 OpenCost CSV 매칭 결과를 확인하세요.
      - alert: OpenCostCloudProviderIDMissing
        expr: (max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 1) and on (node) max by (node)
          (kube_node_labels{label_platform=~"aws|gcp"})) unless on (node) max by (node) (node_total_hourly_cost{provider_id!=""})
        for: 10m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: 클라우드 노드의 providerID가 없습니다
          description: AWS 또는 GCP Ready 노드의 OpenCost provider_id가 비어 있습니다. On-prem 노드는 검사 대상에서 제외됩니다.
          action: Node spec.providerID와 kubelet --provider-id 설정을 확인하세요.
      - alert: OpenCostProviderPlatformMismatch
        expr: ((max by (node) (kube_node_labels{label_platform="aws"}) unless on (node) max by (node) (node_total_hourly_cost{provider_id=~"aws://.*"}))
          or (max by (node) (kube_node_labels{label_platform="gcp"}) unless on (node) max by (node) (node_total_hourly_cost{provider_id=~"gce://.*"})))
        for: 10m
        labels:
          severity: warning
          category: finops
        annotations:
          summary: Node platform과 providerID 형식이 일치하지 않습니다
          description: AWS 노드는 aws://, GCP 노드는 gce:// providerID를 사용해야 합니다.
          action: VM 실제 공급자와 Node platform 라벨 및 spec.providerID를 비교하세요.
      - alert: OpenCostPricingCatalogStale
        expr: time() - cantaloupe:pricing_catalog_last_review_timestamp_seconds > 7776000
        for: 1h
        labels:
          severity: warning
          category: finops
        annotations:
          summary: OpenCost 가격표 정기 검토일이 지났습니다
          description: pricing-catalog.yaml을 90일 이상 검토하지 않았습니다.
          action: AWS/GCP 공개가격과 On-prem TCO 가정을 재확인하고 lastReviewedAt을 갱신하세요.
      - alert: OpenCostCostMetricsAbsent
        expr: absent(node_total_hourly_cost)
        for: 10m
        labels:
          severity: critical
          category: finops
        annotations:
          summary: OpenCost 노드 비용 메트릭이 수집되지 않습니다
          description: Prometheus에서 node_total_hourly_cost를 찾을 수 없습니다.
          action: OpenCost Pod, ServiceMonitor, Prometheus Target과 최근 로그를 순서대로 확인하세요.
