fullnameOverride: opencost
clusterName: cluster.local

podLabels:
  app: opencost
  area: monitoring
  platform: gcp
  cost-allocation: shared

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP

opencost:
  nodeSelector:
    platform: gcp
    role: monitoring
  exporter:
    defaultClusterId: cantaloupe
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    extraVolumeMounts:
      - name: opencost-configs
        mountPath: /var/configs
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      scrapeInterval: 60s
      scrapeTimeout: 10s
  prometheus:
    internal:
      enabled: true
      serviceName: monitoring-prometheus
      namespaceName: monitoring
      port: 9090
      scheme: http
  cloudCost:
    enabled: false
  # Cross-platform FinOps baseline. These are deliberately normalized project
  # rates, not AWS/GCP invoice prices. Provider list-price comparison remains a
  # separate metric so unlike cost models are never added together.
  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: Cantaloupe normalized allocation rates (USD, not cloud billing)
      CPU: 0.03
      spotCPU: 0.03
      RAM: 0.004
      spotRAM: 0.004
      GPU: 0
      storage: 0.000137
      zoneNetworkEgress: 0
      regionNetworkEgress: 0
      internetNetworkEgress: 0
  ui:
    enabled: true
    useIPv6: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      # The upstream UI rewrites its runtime base URL under /var/www at start.
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      # The upstream UI image owns /var/www as 1001:1000.
      runAsUser: 1001
      capabilities:
        drop:
          - ALL

extraVolumes:
  - name: opencost-configs
    emptyDir: {}
