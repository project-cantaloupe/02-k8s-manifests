fullnameOverride: opencost
clusterName: cluster.local

podLabels:
  app: opencost
  area: monitoring
  platform: gcp
  cost-allocation: shared

# Bump this value whenever node-pricing.csv changes so Argo CD rolls the Pod
# immediately instead of waiting for the CSV provider's hourly refresh.
podAnnotations:
  finops.opencost.io/pricing-version: "cantaloupe-uniform-v1"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP

opencost:
  nodeSelector:
    platform: gcp
    role: monitoring
  exporter:
    defaultClusterId: cantaloupe
    # Phase 1 uses one benchmark unit price across AWS, GCP, and on-premises.
    # Prices therefore follow node CPU/RAM capacity and newly joined nodes are
    # costed automatically without a node-name-specific CSV row.
    extraEnv:
      USE_CUSTOM_PROVIDER: "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      scrapeInterval: 60s
      scrapeTimeout: 10s
  prometheus:
    internal:
      enabled: true
      serviceName: monitoring-prometheus
      namespaceName: monitoring
      port: 9090
      scheme: http
  cloudCost:
    enabled: false
  # This is an internal FinOps benchmark, not an AWS/GCP invoice or public
  # cloud list price. Phase 2 may introduce separate platform coefficients.
  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: Cantaloupe uniform benchmark allocation v1 (USD)
      customPricesEnabled: true
      CPU: 0.03
      spotCPU: 0.03
      RAM: 0.004
      spotRAM: 0.004
      GPU: 0
      storage: 0.000137
      zoneNetworkEgress: 0
      regionNetworkEgress: 0
      internetNetworkEgress: 0
  ui:
    enabled: true
    useIPv6: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      # The upstream UI rewrites its runtime base URL under /var/www at start.
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      # The upstream UI image owns /var/www as 1001:1000.
      runAsUser: 1001
      capabilities:
        drop:
          - ALL
