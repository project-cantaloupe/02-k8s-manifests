apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcp-pd-csi-controller-sa
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcp-pd-csi-node-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcp-pd-csi-controller-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "storageclasses", "csinodes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcp-pd-csi-controller-binding
subjects:
  - kind: ServiceAccount
    name: gcp-pd-csi-controller-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: gcp-pd-csi-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: pd.csi.storage.gke.io
spec:
  attachRequired: true
  podInfoOnMount: false
  volumeLifecycleModes:
    - Persistent
---
# GCP PD Controller (wk-02 노드로 타겟팅)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-pd-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcp-pd-csi-controller
  template:
    metadata:
      labels:
        app: gcp-pd-csi-controller
    spec:
      serviceAccountName: gcp-pd-csi-controller-sa
      nodeSelector:
        location: gcp
        role: logging        # cntlp-gcp-wk-02 노드에 배치
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v3.5.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--v=5"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: gcp-pd-driver
          image: registry.k8s.io/cloud-provider-gcp/gcp-compute-persistent-disk-csi-driver:v1.12.0
          args:
            - "--v=5"
            - "--endpoint=unix:/csi/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
---
# GCP PD Node Agent (GCP 전체 워커 노드에 디스크 마운트 지원)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcp-pd-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: gcp-pd-csi-node
  template:
    metadata:
      labels:
        app: gcp-pd-csi-node
    spec:
      serviceAccountName: gcp-pd-csi-node-sa
      nodeSelector:
        location: gcp          # location=gcp 노드 전체 적용
      hostNetwork: true
      containers:
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.8.0
          args:
            - "--v=5"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/pd.csi.storage.gke.io/csi.sock"
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: gcp-pd-driver
          image: registry.k8s.io/cloud-provider-gcp/gcp-compute-persistent-disk-csi-driver:v1.12.0
          args:
            - "--v=5"
            - "--endpoint=unix:/csi/csi.sock"
          securityContext:
            privileged: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
            - name: device-dir
              mountPath: /dev
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/pd.csi.storage.gke.io/
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory