fullnameOverride: vpa

commonLabels:
  area: monitoring
  platform: gcp
  cost-allocation: shared

# Recommendation-only deployment. Neither component capable of changing Pods
# is installed.
admissionController:
  enabled: false

updater:
  enabled: false

recommender:
  enabled: true
  replicas: 1
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: vpa-recommender
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
