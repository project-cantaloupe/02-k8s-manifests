fullnameOverride: monitoring

commonLabels:
  area: monitoring
  cost-allocation: shared

alertmanager:
  enabled: false

# Alertmanager is intentionally deferred in the initial resource-constrained
# deployment. Keep real target alerts, but omit rules that only make sense when
# an Alertmanager and a dead-man-switch receiver are configured.
defaultRules:
  disabled:
    PrometheusNotConnectedToAlertmanagers: true
    Watchdog: true
  rules:
    alertmanager: false

# kubeadm control-plane components bind their metrics locally in the current
# cluster. Keep false targets out until those endpoints are intentionally
# exposed and secured.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false

grafana:
  enabled: true
  fullnameOverride: grafana
  grafana.ini:
    server:
      domain: cntlp-gcp-wk-01.tail270b85.ts.net
      root_url: https://cntlp-gcp-wk-01.tail270b85.ts.net/grafana/
      serve_from_sub_path: true
  # Remove datasources that were previously provisioned by this chart but are
  # no longer present in Git (for example the disabled Alertmanager source).
  prune: true
  deleteDatasources:
    - name: Alertmanager
      orgId: 1
  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsEditable: true
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: grafana
    area: monitoring
    platform: gcp
    cost-allocation: shared
  service:
    type: NodePort
    nodePort: 30300
    externalTrafficPolicy: Local
  serviceMonitor:
    # Grafana serves every HTTP endpoint below its configured sub-path.
    path: /grafana/metrics
  persistence:
    enabled: true
    type: pvc
    storageClassName: gcp-pd-sc
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
  initChownData:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      searchNamespace: ALL
      folderAnnotation: grafana-folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      alertmanager:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

kube-state-metrics:
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: kube-state-metrics
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# node-exporter is cluster-wide shared telemetry. It deliberately has no fixed
# platform label or GCP-only nodeSelector so AWS, GCP and on-prem nodes expose
# the same node_* metrics to the single central Prometheus.
prometheus-node-exporter:
  podLabels:
    app: node-exporter
    area: monitoring
    cost-allocation: shared
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        platform: gcp
        role: monitoring
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    # Tailscale Serve removes /prometheus before proxying. Keep the internal
    # route at / while generating browser links below the public sub-path.
    externalUrl: https://cntlp-gcp-wk-01.tail270b85.ts.net/prometheus/
    routePrefix: /
    replicas: 1
    shards: 1
    retention: 7d
    retentionSize: 15GB
    walCompression: true
    nodeSelector:
      platform: gcp
      role: monitoring
    podMetadata:
      labels:
        app: prometheus
        area: monitoring
        platform: gcp
        cost-allocation: shared
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        memory: 3Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gcp-pd-sc
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
