fullnameOverride: monitoring

commonLabels:
  area: monitoring
  cost-allocation: shared

alertmanager:
  enabled: true
  apiVersion: v2
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - namespace
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
    receivers:
      - name: "null"
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    nodeSelector:
      platform: gcp
      role: monitoring
    podMetadata:
      labels:
        app: alertmanager
        area: monitoring
        platform: gcp
        cost-allocation: shared
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager-config: cantaloupe-slack
    # Cluster-wide alerts do not always have a namespace label. Do not let the
    # default OnNamespace strategy silently exclude node and cluster alerts.
    alertmanagerConfigMatcherStrategy:
      type: None

# Watchdog is a continuously firing dead-man switch and requires a separate
# heartbeat service. Keep it disabled; warning/critical operational rules are
# routed to Slack by the AlertmanagerConfig below.
defaultRules:
  disabled:
    Watchdog: true
  rules:
    alertmanager: true

# kubeadm control-plane components bind their metrics locally in the current
# cluster. Keep false targets out until those endpoints are intentionally
# exposed and secured.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false

grafana:
  enabled: true
  fullnameOverride: grafana
  grafana.ini:
    server:
      # ⚠️ **이 호스트에서 tailscale serve 가 돌아야 실제로 닿는다.**
      # 이 세 줄은 오래 있었지만 그 노드에 serve 가 없어 죽은 주소였다.
      # 2026-08-11 에 `cntlp-gcp-wk-01` 의 host_vars 로 열었다
      # (01-infra-provisioning ansible/inventories/gcp/host_vars/).
      #
      # **왜 하필 이 노드냐** — `service.externalTrafficPolicy: Local`(아래)
      # 이라 grafana 파드가 있는 노드에서만 NodePort 가 응답한다.
      # UI 프론트인 cntlp-onp-wk-01 에 얹으면 조용히 무응답이 된다.
      domain: cntlp-gcp-wk-01.tail270b85.ts.net
      root_url: https://cntlp-gcp-wk-01.tail270b85.ts.net/grafana/
      serve_from_sub_path: true

    # ── Keycloak OIDC ────────────────────────────────────────────
    #
    # ⚠️ **로컬 로그인 폼을 끄지 않는다** (`disable_login_form` 을 안 켠다).
    # OIDC 를 잘못 붙였을 때 들어갈 문이 그것뿐이다. Grafana 를 두 번째
    # 대상으로 고른 이유가 이 폴백이다
    # → tasks/doing/014_oidc-client-rollout.md
    #
    # ⚠️ **`auto_login` 도 켜지 않는다.** 켜면 `/login` 이 곧바로 Keycloak
    # 으로 튕겨서, OIDC 가 깨졌을 때 로컬 폼에 도달할 수 없다. 폴백을
    # 남겨두고 그리로 가는 길을 막는 셈이 된다.
    auth:
      disable_login_form: false
      oauth_auto_login: false
      # 로그아웃하면 Keycloak 세션도 끊는다. 안 하면 로그아웃 직후 다시
      # 누를 때 아무것도 묻지 않고 되로그인되어 "안 끊긴 것"처럼 보인다.
      signout_redirect_url: https://auth.echoprism.cloud/realms/cantaloupe/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fcntlp-gcp-wk-01.tail270b85.ts.net%2Fgrafana%2Flogin

    auth.generic_oauth:
      enabled: true
      name: Keycloak
      # ⚠️ **client_id·client_secret 은 여기 안 적는다.** 아래 envValueFrom
      # 이 ExternalSecret 이 만든 Secret 에서 주입한다.
      #
      # confidential 인 이유 — Grafana 는 `client_secret` 을 필수로 요구하고
      # `use_pkce` 를 켜도 면제되지 않는다. 서버가 인가 코드를 교환하는
      # 구조라서다. ArgoCD 가 public 일 수 있었던 것은 브라우저가 직접
      # 교환하기 때문이다 → 01-infra-provisioning terraform/keycloak/clients.tf
      scopes: openid profile email groups
      auth_url: https://auth.echoprism.cloud/realms/cantaloupe/protocol/openid-connect/auth
      token_url: https://auth.echoprism.cloud/realms/cantaloupe/protocol/openid-connect/token
      api_url: https://auth.echoprism.cloud/realms/cantaloupe/protocol/openid-connect/userinfo

      # 시크릿이 있어도 켠다. 인가 코드 가로채기는 여전히 막는다.
      use_pkce: true

      # 사용자 식별. ArgoCD 는 email 로 고정돼 있었지만 Grafana 는 고를 수
      # 있다 — `preferred_username` 이 K8s RBAC 주체와 같은 값이라
      # 감사 로그를 이어붙이기 쉽다.
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups

      # ── 그룹 → 역할 (014 3단계 매핑표의 Grafana 열) ──────────
      #
      # JMESPath 다. 앞에서부터 평가되고 처음 참인 것이 이긴다.
      # 마지막 `'Viewer'` 가 기본값 역할을 한다 — 매칭이 없어도 로그인은
      # 되고 읽기만 된다.
      #
      # ⚠️ **`GrafanaAdmin` 은 `allow_assign_grafana_admin` 이 있어야
      # 실제로 붙는다.** 없으면 조용히 `Admin` 으로 떨어진다.
      role_attribute_path: >-
        contains(groups[*], 'platform-admin') && 'GrafanaAdmin'
        || contains(groups[*], 'devops') && 'Admin'
        || contains(groups[*], 'secops') && 'Editor'
        || contains(groups[*], 'finops') && 'Editor'
        || 'Viewer'
      allow_assign_grafana_admin: true

      # ⚠️ **`role_attribute_strict` 를 켜지 않는다.** 켜면 위 식이 아무것도
      # 못 고를 때 **로그인 자체가 거부된다.** 지금 realm 가입이 닫혀 있어
      # 아무나 들어오지 못하므로, 거부보다 Viewer 로 받는 쪽이 낫다.
      role_attribute_strict: false

      # 새 사용자를 자동으로 만든다. 그룹이 권한을 결정하므로 계정을 미리
      # 만들어 둘 이유가 없다 — 그것이 "권한을 한 곳에서"의 실체다.
      allow_sign_up: true
  prune: true
  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsEditable: true
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # OIDC 자격증명을 env 로 주입한다. `grafana.ini` 에 적으면 ConfigMap 에
  # 평문으로 들어간다 — ConfigMap 은 Secret 과 달리 아무나 읽는다.
  #
  # 이름 규칙은 Grafana 의 `GF_<SECTION>_<KEY>` 다. 여기서 섹션은
  # `auth.generic_oauth` 이고 점이 밑줄로 바뀐다.
  # Secret 은 ExternalSecret 이 만든다
  # → platform/gcp/monitoring-foundation/grafana-oidc-secret.yaml
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-oidc
        key: client_id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client_secret
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: grafana
    area: monitoring
    platform: gcp
    cost-allocation: shared
  service:
    type: NodePort
    nodePort: 30300
    externalTrafficPolicy: Local
  serviceMonitor:
    # Grafana serves every HTTP endpoint below its configured sub-path.
    path: /grafana/metrics
  persistence:
    enabled: true
    type: pvc
    storageClassName: gcp-pd-sc
    annotations:
      # Keep the data PVC when the preview Argo CD Application is replaced by
      # the canonical main-branch Application or a manifest is removed by mistake.
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
  initChownData:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      searchNamespace: ALL
      folderAnnotation: grafana-folder
      provider:
        # ConfigMap sidecar가 dashboard 파일을 갱신해도 filesystem watch
        # 이벤트가 전달되지 않는 경우가 있다. 10초보다 크게 설정하면
        # Grafana가 파일을 polling해 GitOps dashboard 변경을 확실히 읽는다.
        updateIntervalSeconds: 30
        foldersFromFilesStructure: true
    datasources:
      alertmanager:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

kube-state-metrics:
  # Collect only AuthorizationPolicy object state.  This intentionally does
  # not infer denied requests; the dashboard will show policy application
  # counts only after Prometheus confirms the generated metric.
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: security.istio.io
              version: v1
              kind: AuthorizationPolicy
            labelsFromPath:
              namespace: [metadata, namespace]
            metrics:
              - name: authorizationpolicy
                help: Istio AuthorizationPolicy object state.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
          # PolicyReport is the current-state source for the manually imported
          # Grafana Kyverno dashboard. Unlike kyverno_policy_results_total,
          # this metric disappears when the report or result is removed and
          # therefore represents current violations rather than scan events.
          - groupVersionKind:
              group: wgpolicyk8s.io
              version: v1alpha2
              kind: PolicyReport
            metricNamePrefix: kyverno
            labelsFromPath:
              exported_namespace: [metadata, namespace]
              report: [metadata, name]
              scope_api_version: [scope, apiVersion]
              scope_kind: [scope, kind]
              scope_name: [scope, name]
            metrics:
              - name: policyreport_result
                help: Current result stored in a Kubernetes PolicyReport.
                each:
                  type: Info
                  info:
                    path: [results]
                    labelsFromPath:
                      policy: [policy]
                      rule: [rule]
                      result: [result]
                      source: [source]
                      # Keep the failed JSON path (containers/initContainers,
                      # requests/limits) available to the FinOps investigation
                      # table so an operator can see what is actually missing.
                      message: [message]
  rbac:
    extraRules:
      - apiGroups: ["security.istio.io"]
        resources: ["authorizationpolicies"]
        verbs: ["list", "watch"]
      - apiGroups: ["wgpolicyk8s.io"]
        resources: ["policyreports"]
        verbs: ["list", "watch"]
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: kube-state-metrics
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# node-exporter is cluster-wide shared telemetry. It deliberately has no fixed
# platform label or GCP-only nodeSelector so AWS, GCP and on-prem nodes expose
# the same node_* metrics to the single central Prometheus.
prometheus-node-exporter:
  podLabels:
    app: node-exporter
    area: monitoring
    cost-allocation: shared
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        platform: gcp
        role: monitoring
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    # Tailscale Serve removes /prometheus before proxying. Keep the internal
    # route at / while generating browser links below the public sub-path.
    externalUrl: https://cntlp-gcp-wk-01.tail270b85.ts.net/prometheus/
    # ⚠️ **2026-08-11 에 `/` 에서 `/prometheus` 로 바꿨다.**
    #
    # 전에는 `tailscale serve --set-path /prometheus` 가 접두사를 떼고
    # 넘겨서 Prometheus 가 루트에서 서빙하면 맞았다. 지금은 앞에
    # monitoring-gateway 가 **루트에** 서고 경로를 그대로 전달하므로,
    # Prometheus 가 `/prometheus/...` 를 직접 받는다.
    #
    # 접두사를 떼지 않게 만든 이유는 그것이 로그인 뒤 착지 URL 을
    # 깨뜨리기 때문이다 → platform/gcp/monitoring-foundation/monitoring-gateway.yaml
    #
    # ⚠️ Grafana 데이터소스는 ClusterIP 서비스를 직접 부르므로 이 값과
    # 무관하다. 영향받는 것은 사람이 브라우저로 여는 경로뿐이다.
    routePrefix: /prometheus
    replicas: 1
    shards: 1
    # Preserve the complete two-week Audio Service experiment plus one day of
    # clock/scrape margin for before/after comparisons.
    retention: 15d
    retentionSize: 15GB
    walCompression: true
    nodeSelector:
      platform: gcp
      role: monitoring
    podMetadata:
      labels:
        app: prometheus
        area: monitoring
        platform: gcp
        cost-allocation: shared
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        memory: 3Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Preserve Prometheus history used for incident review, FinOps trends,
          # and right-sizing comparisons if the PVC is accidentally deleted.
          storageClassName: gcp-pd-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

# The webhook value is never stored in Git. The referenced Secret must be
# created directly in the monitoring namespace before this configuration is
# synchronized. Only actionable warning/critical alerts reach Slack.
extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: cantaloupe-slack
      namespace: monitoring
      labels:
        alertmanager-config: cantaloupe-slack
    spec:
      route:
        receiver: slack-platform-alerts
        groupBy:
          - namespace
          - alertname
          - severity
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
        matchers:
          - name: severity
            matchType: =~
            value: warning|critical
        routes:
          - receiver: slack-prometheus-alerts
            matchers:
              - name: alertname
                matchType: =~
                value: KubeNodeNotReady|KubeNodeUnreachable|KubePodCrashLooping|KubeDeploymentRolloutStuck|KubeStatefulSetUpdateNotRolledOut|KubeDaemonSetRolloutStuck|KubePersistentVolumeErrors|KubePersistentVolumeFillingUp|KubePersistentVolumeInodesFillingUp|KubeAPIDown|KubeAPIErrorBudgetBurn|KubeAPIInstanceUnreachable|KubeAggregatedAPIDown|KubeletDown|KubeClientCertificateExpiration|KubeletClientCertificateExpiration|KubeletServerCertificateExpiration|PrometheusBadConfig|PrometheusRuleFailures|PrometheusNotIngestingSamples|PrometheusNotConnectedToAlertmanagers|PrometheusErrorSendingAlertsToAnyAlertmanager|PrometheusTargetSyncFailure|AlertmanagerClusterDown|AlertmanagerClusterCrashlooping|AlertmanagerClusterFailedToSendAlerts|AlertmanagerConfigInconsistent|AlertmanagerFailedReload
            continue: false
          - receiver: slack-argocd-alerts
            repeatInterval: 30m
            matchers:
              - name: service
                matchType: "="
                value: argocd
            continue: false
          - receiver: slack-kyverno-alerts
            matchers:
              - name: service
                matchType: "="
                value: kyverno
            continue: false
          - receiver: slack-audio-alerts
            matchers:
              - name: service
                matchType: "="
                value: audio
            continue: false
      receivers:
        - name: slack-platform-alerts
          slackConfigs:
            - apiURL:
                name: alertmanager-slack-webhook
                key: api-url
              sendResolved: true
              title: >-
                {{ `{{ if eq .Status "firing" }}` }}[발생]{{ `{{ else }}` }}[해소]{{ `{{ end }}` }}
                {{ `{{ if eq .CommonLabels.severity "critical" }}` }}[긴급]{{ `{{ else }}` }}[주의]{{ `{{ end }}` }}
                {{ `{{ if eq .CommonLabels.category "finops" }}` }}[FINOPS]{{ `{{ else }}` }}[MONITORING]{{ `{{ end }}` }}
                {{ `{{ .CommonLabels.alertname }}` }}
              text: >-
                *요약:* {{ `{{ .CommonAnnotations.summary }}` }}
                {{ `{{ if .CommonAnnotations.description }}` }}\n*원인:* {{ `{{ .CommonAnnotations.description }}` }}{{ `{{ end }}` }}
                {{ `{{ if .CommonAnnotations.action }}` }}\n*권장 조치:* {{ `{{ .CommonAnnotations.action }}` }}{{ `{{ end }}` }}
                \n*영향 대상 ({{ `{{ len .Alerts }}` }}건)*
                {{ `{{ range .Alerts }}` }}\n•{{ `{{ if .Labels.node }}` }} Node `{{ `{{ .Labels.node }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.platform }}` }} · Platform `{{ `{{ .Labels.platform }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.namespace }}` }} · Namespace `{{ `{{ .Labels.namespace }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.pod }}` }} · Pod `{{ `{{ .Labels.pod }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.instance_type }}` }} · Type `{{ `{{ .Labels.instance_type }}` }}`{{ `{{ end }}` }}{{ `{{ end }}` }}
                \n*최초 발생:* {{ `{{ (index .Alerts 0).StartsAt }}` }}
              color: >-
                {{ `{{ if eq .Status "firing" }}` }}{{ `{{ if eq .CommonLabels.severity "critical" }}` }}danger{{ `{{ else }}` }}warning{{ `{{ end }}` }}{{ `{{ else }}` }}good{{ `{{ end }}` }}
        - name: slack-audio-alerts
          slackConfigs:
            - apiURL:
                name: alertmanager-slack-audio-webhook
                key: api-url
              sendResolved: true
              title: >-
                {{ `{{ if eq .Status "firing" }}` }}🚨 [Audio 장애]{{ `{{ else }}` }}✅ [Audio 복구]{{ `{{ end }}` }} {{ `{{ .CommonLabels.alertname }}` }}
              text: |-
                *{{ `{{ .CommonAnnotations.summary }}` }}*
                {{ `{{ if .CommonAnnotations.description }}` }}
                *상세*
                {{ `{{ .CommonAnnotations.description }}` }}{{ `{{ end }}` }}

                *영향 대상*
                {{ `{{ range .Alerts }}` }}•{{ `{{ if .Labels.component }}` }} `{{ `{{ .Labels.component }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.deployment }}` }} / Deployment `{{ `{{ .Labels.deployment }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.pod }}` }} / Pod `{{ `{{ .Labels.pod }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.container }}` }} / Container `{{ `{{ .Labels.container }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.queue_name }}` }} / Queue `{{ `{{ .Labels.queue_name }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.namespace }}` }} — Namespace `{{ `{{ .Labels.namespace }}` }}`{{ `{{ end }}` }}
                {{ `{{ end }}` }}{{ `{{ if eq .Status "firing" }}` }}
                *조치*
                {{ `{{ .CommonAnnotations.action }}` }}

                <https://cntlp-gcp-wk-01.tail270b85.ts.net/grafana/d/cantaloupe-v1-audio-service-finops|Audio 대시보드에서 확인>{{ `{{ end }}` }}
              color: >-
                {{ `{{ if eq .Status "firing" }}` }}{{ `{{ if eq .CommonLabels.severity "critical" }}` }}danger{{ `{{ else }}` }}warning{{ `{{ end }}` }}{{ `{{ else }}` }}good{{ `{{ end }}` }}
        - name: slack-prometheus-alerts
          slackConfigs:
            - apiURL:
                name: alertmanager-slack-webhook
                key: api-url
              sendResolved: true
              title: >-
                {{ `{{ if eq .Status "firing" }}` }}{{ `{{ if eq .CommonLabels.severity "critical" }}` }}🚨 [긴급]{{ `{{ else }}` }}⚠️ [주의]{{ `{{ end }}` }}{{ `{{ else }}` }}✅ [복구]{{ `{{ end }}` }} {{ `{{ .CommonLabels.alertname }}` }}
              text: |-
                *{{ `{{ .CommonAnnotations.summary }}` }}*
                {{ `{{ if .CommonAnnotations.description }}` }}
                *상세*
                {{ `{{ .CommonAnnotations.description }}` }}{{ `{{ end }}` }}

                *영향 대상 ({{ `{{ len .Alerts }}` }}건)*
                {{ `{{ range .Alerts }}` }}•{{ `{{ if .Labels.node }}` }} Node `{{ `{{ .Labels.node }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.namespace }}` }} Namespace `{{ `{{ .Labels.namespace }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.deployment }}` }} / Deployment `{{ `{{ .Labels.deployment }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.statefulset }}` }} / StatefulSet `{{ `{{ .Labels.statefulset }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.daemonset }}` }} / DaemonSet `{{ `{{ .Labels.daemonset }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.pod }}` }} / Pod `{{ `{{ .Labels.pod }}` }}`{{ `{{ end }}` }}{{ `{{ if .Labels.instance }}` }} Instance `{{ `{{ .Labels.instance }}` }}`{{ `{{ end }}` }}
