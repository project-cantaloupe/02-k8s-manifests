fullnameOverride: monitoring

commonLabels:
  area: monitoring
  cost-allocation: shared

alertmanager:
  enabled: true
  apiVersion: v2
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - namespace
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
    receivers:
      - name: "null"
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    nodeSelector:
      platform: gcp
      role: monitoring
    podMetadata:
      labels:
        app: alertmanager
        area: monitoring
        platform: gcp
        cost-allocation: shared
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager-config: cantaloupe-slack
    # Cluster-wide alerts do not always have a namespace label. Do not let the
    # default OnNamespace strategy silently exclude node and cluster alerts.
    alertmanagerConfigMatcherStrategy:
      type: None

# Watchdog is a continuously firing dead-man switch and requires a separate
# heartbeat service. Keep it disabled; warning/critical operational rules are
# routed to Slack by the AlertmanagerConfig below.
defaultRules:
  disabled:
    Watchdog: true
  rules:
    alertmanager: true

# kubeadm control-plane components bind their metrics locally in the current
# cluster. Keep false targets out until those endpoints are intentionally
# exposed and secured.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false

grafana:
  enabled: true
  fullnameOverride: grafana
  grafana.ini:
    server:
      domain: cntlp-gcp-wk-01.tail270b85.ts.net
      root_url: https://cntlp-gcp-wk-01.tail270b85.ts.net/grafana/
      serve_from_sub_path: true
  prune: true
  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsEditable: true
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: grafana
    area: monitoring
    platform: gcp
    cost-allocation: shared
  service:
    type: NodePort
    nodePort: 30300
    externalTrafficPolicy: Local
  serviceMonitor:
    # Grafana serves every HTTP endpoint below its configured sub-path.
    path: /grafana/metrics
  persistence:
    enabled: true
    type: pvc
    storageClassName: gcp-pd-sc
    annotations:
      # Keep the data PVC when the preview Argo CD Application is replaced by
      # the canonical main-branch Application or a manifest is removed by mistake.
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
  initChownData:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  sidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      searchNamespace: ALL
      folderAnnotation: grafana-folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      alertmanager:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

kube-state-metrics:
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    app: kube-state-metrics
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# node-exporter is cluster-wide shared telemetry. It deliberately has no fixed
# platform label or GCP-only nodeSelector so AWS, GCP and on-prem nodes expose
# the same node_* metrics to the single central Prometheus.
prometheus-node-exporter:
  podLabels:
    app: node-exporter
    area: monitoring
    cost-allocation: shared
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  nodeSelector:
    platform: gcp
    role: monitoring
  podLabels:
    area: monitoring
    platform: gcp
    cost-allocation: shared
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        platform: gcp
        role: monitoring
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    # Tailscale Serve removes /prometheus before proxying. Keep the internal
    # route at / while generating browser links below the public sub-path.
    externalUrl: https://cntlp-gcp-wk-01.tail270b85.ts.net/prometheus/
    routePrefix: /
    replicas: 1
    shards: 1
    retention: 7d
    retentionSize: 15GB
    walCompression: true
    nodeSelector:
      platform: gcp
      role: monitoring
    podMetadata:
      labels:
        app: prometheus
        area: monitoring
        platform: gcp
        cost-allocation: shared
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        memory: 3Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Preserve Prometheus history used for incident review, FinOps trends,
          # and right-sizing comparisons if the PVC is accidentally deleted.
          storageClassName: gcp-pd-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

# The webhook value is never stored in Git. The referenced Secret must be
# created directly in the monitoring namespace before this configuration is
# synchronized. Only actionable warning/critical alerts reach Slack.
extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: cantaloupe-slack
      namespace: monitoring
      labels:
        alertmanager-config: cantaloupe-slack
    spec:
      route:
        receiver: slack-platform-alerts
        groupBy:
          - namespace
          - alertname
          - severity
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
        matchers:
          - name: severity
            matchType: =~
            value: warning|critical
      receivers:
        - name: slack-platform-alerts
          slackConfigs:
            - apiURL:
                name: alertmanager-slack-webhook
                key: api-url
              sendResolved: true
              title: >-
                [{{ `{{ .Status | toUpper }}` }}][PROMETHEUS][{{ `{{ .CommonLabels.severity | toUpper }}` }}]
                {{ `{{ .CommonLabels.alertname }}` }}
              text: >-
                *Summary:* {{ `{{ .CommonAnnotations.summary }}` }}
                {{ `{{ if .CommonAnnotations.description }}` }}\n*Description:* {{ `{{ .CommonAnnotations.description }}` }}{{ `{{ end }}` }}
                {{ `{{ if .CommonLabels.namespace }}` }}\n*Namespace:* `{{ `{{ .CommonLabels.namespace }}` }}`{{ `{{ end }}` }}
                {{ `{{ if .CommonLabels.pod }}` }}\n*Pod:* `{{ `{{ .CommonLabels.pod }}` }}`{{ `{{ end }}` }}
                {{ `{{ if .CommonLabels.node }}` }}\n*Node:* `{{ `{{ .CommonLabels.node }}` }}`{{ `{{ end }}` }}
                \n*Alerts:* {{ `{{ len .Alerts }}` }} · *Starts:* {{ `{{ (index .Alerts 0).StartsAt }}` }}
              color: >-
                {{ `{{ if eq .Status "firing" }}` }}{{ `{{ if eq .CommonLabels.severity "critical" }}` }}danger{{ `{{ else }}` }}warning{{ `{{ end }}` }}{{ `{{ else }}` }}good{{ `{{ end }}` }}
