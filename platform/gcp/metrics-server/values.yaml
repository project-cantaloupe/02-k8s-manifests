# Official metrics-server chart 3.13.1 / app 0.8.1.
# Kubernetes 1.36 kubelet serving certificates are verified; do not add
# --kubelet-insecure-tls as a workaround.
replicas: 1

nodeSelector:
  platform: gcp
  role: monitoring

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceMonitor:
  enabled: false

# API aggregation 구간도 검증한다. cert-manager가 namespace-local self-signed
# issuer로 serving certificate를 만들고 cainjector가 APIService caBundle을 채운다.
apiService:
  insecureSkipTLSVerify: false

tls:
  type: cert-manager
  certManager:
    addInjectorAnnotations: true
    existingIssuer:
      enabled: false
