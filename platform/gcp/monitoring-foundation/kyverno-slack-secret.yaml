# The webhook value is created manually in AWS Secrets Manager so it never
# enters Git or Terraform state. External Secrets projects only the required
# property into the Kubernetes Secret consumed by Alertmanager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-kyverno-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alertmanager-slack-kyverno-webhook
    creationPolicy: Owner
  data:
    - secretKey: api-url
      remoteRef:
        key: cntlp/alertmanager/slack/kyverno
        property: api_url
