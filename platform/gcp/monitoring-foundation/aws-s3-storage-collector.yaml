apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-storage-collector
  namespace: monitoring
  labels:
    app: s3-storage-collector
    area: monitoring
    category: finops
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: s3-storage-collector
  namespace: monitoring
  labels:
    app: s3-storage-collector
    area: monitoring
    category: finops
spec:
  # 현재 데이터 규모에서는 ListObjectsV2를 10분마다 실행해도 호출량이 작다.
  # 객체 수가 커지면 S3 Inventory 또는 앱 이벤트 기반 집계로 전환한다.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: s3-storage-collector
            area: monitoring
            category: finops
            platform: aws
            cost-allocation: shared
        spec:
          serviceAccountName: s3-storage-collector
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            platform: aws
            role: service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: aws-api
              image: public.ecr.aws/aws-cli/aws-cli:2.31.22
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  aws s3api list-objects-v2 \
                    --region "$AWS_REGION" \
                    --bucket "$QUARANTINE_BUCKET" \
                    --prefix "$QUARANTINE_PREFIX" \
                    --output json > /work/quarantine.json
                  aws s3api list-objects-v2 \
                    --region "$AWS_REGION" \
                    --bucket "$TRANSCODE_BUCKET" \
                    --prefix "$TRANSCODE_PREFIX" \
                    --output json > /work/transcode.json
              env:
                - name: AWS_REGION
                  value: ap-northeast-2
                - name: AWS_EC2_METADATA_DISABLED
                  value: "false"
                - name: HOME
                  value: /tmp
                - name: QUARANTINE_BUCKET
                  value: cntlp-aws-quarantine
                - name: QUARANTINE_PREFIX
                  value: incoming/
                - name: TRANSCODE_BUCKET
                  value: cntlp-aws-transcode
                - name: TRANSCODE_PREFIX
                  value: audios/
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: collector
              image: python:3.12.11-alpine3.22
              command: ["python", "/opt/cantaloupe/aws_s3_storage_collector.py"]
              env:
                - name: PUSHGATEWAY_URL
                  value: http://cantaloupe-finops-pushgateway.monitoring.svc:9091
                - name: AWS_S3_COLLECTOR_INPUT_DIR
                  value: /work
                - name: QUARANTINE_BUCKET
                  value: cntlp-aws-quarantine
                - name: QUARANTINE_PREFIX
                  value: incoming/
                - name: TRANSCODE_BUCKET
                  value: cntlp-aws-transcode
                - name: TRANSCODE_PREFIX
                  value: audios/
              volumeMounts:
                - name: collector
                  mountPath: /opt/cantaloupe
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          volumes:
            - name: collector
              configMap:
                name: s3-storage-collector
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: s3-storage-collector
  namespace: monitoring
  labels:
    app: s3-storage-collector
    area: monitoring
    category: finops
    release: monitoring
spec:
  groups:
    - name: cantaloupe.finops.aws-s3-storage
      interval: 1m
      rules:
        - alert: AwsS3StorageCollectorFailed
          expr: max(cantaloupe:aws_s3_collection_success) == 0
          for: 10m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: S3 API 저장량 수집에 실패했습니다
            description: s3-storage-collector가 최근 실행에서 객체 목록을 수집하지 못했습니다.
            action: CronJob과 Init Container 로그, Worker Instance Profile의 s3:ListBucket 권한을 확인하세요.
        - alert: AwsS3StorageCollectorStale
          expr: time() - max(cantaloupe:aws_s3_collection_timestamp_seconds) > 1800
          for: 5m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: S3 API 저장량 데이터가 30분 이상 갱신되지 않았습니다
            description: 10분 주기 수집기가 세 번 이상 최신 버킷 정보를 게시하지 못했습니다.
            action: CronJob 실행 이력, Pushgateway 연결과 S3 ListObjectsV2 응답을 확인하세요.
        - alert: AwsS3StorageMetricsAbsent
          expr: absent(cantaloupe:aws_s3_collection_timestamp_seconds) == 1
          for: 30m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: S3 API 저장량 지표가 없습니다
            description: 배포 후 30분 동안 S3 저장량 수집 지표가 생성되지 않았습니다.
            action: Argo CD Sync 상태와 s3-storage-collector CronJob을 확인하세요.
