apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ⚠️ **opencost-ui-nodeport.yaml · prometheus-ui-nodeport.yaml 을
  # 2026-08-11 에 지웠다.** 둘 다 인증이 없는 UI 를 NodePort 로 열고
  # 있었고, NodePort 는 노드의 모든 인터페이스에서 열리므로 tailnet
  # 참여자 누구나 읽을 수 있었다. 지금은 monitoring-gateway 가 앞에
  # 서고 UI 는 ClusterIP 로만 닿는다 → tasks/.../015_sso-loose-ends.md
  - monitoring-gateway.yaml
  - finops-recording-rules.yaml
  - onprem-rightsizing-rules.yaml
  - gcp-recommender-collector.yaml
  - aws-compute-optimizer-collector.yaml
  - vpa-recommendation-collector.yaml
  - audio-ingress-observability.yaml
  # Grafana OIDC 클라이언트 시크릿. Helm 차트(monitoring-stack)가 아니라
  # 여기 있는 이유는 kustomize 앱이라 ExternalSecret 을 그대로 얹을 수
  # 있어서다. 차트 values 는 이 Secret 을 env 로 참조하기만 한다.
  - grafana-oidc-secret.yaml

  # Grafana 로컬 admin. 2026-08-11 까지 손으로 apply 돼 있었고 비밀번호가
  # last-applied 어노테이션에 평문으로 남아 있었다 → 015 B1
  - grafana-admin-secret.yaml

configMapGenerator:
  - name: gcp-recommender-collector
    namespace: monitoring
    files:
      - gcp_recommender_collector.py
    options:
      labels:
        app: gcp-recommender-collector
        area: monitoring
        category: finops

  - name: aws-compute-optimizer-collector
    namespace: monitoring
    files:
      - aws_compute_optimizer_collector.py
    options:
      labels:
        app: aws-compute-optimizer-collector
        area: monitoring
        category: finops

  - name: vpa-recommendation-collector
    namespace: monitoring
    files:
      - vpa_recommendation_collector.py
    options:
      labels:
        app: vpa-recommendation-collector
        area: monitoring
        category: finops
  - name: cantaloupe-v1-platform-overview
    namespace: monitoring
    files:
      - cantaloupe-v1-platform-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app: grafana
        area: monitoring
        platform: gcp
        cost-allocation: shared
      annotations:
        grafana-folder: Cantaloupe
