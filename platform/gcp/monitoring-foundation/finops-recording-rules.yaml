apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cantaloupe-finops-recording-rules
  namespace: monitoring
  labels:
    release: monitoring
    app: opencost
    area: monitoring
    cost-allocation: shared
spec:
  groups:
    - name: cantaloupe.finops.cost
      interval: 1m
      rules:
        - record: cantaloupe:node_total_cost_per_hour
          expr: max by (node) (node_total_hourly_cost)

        - record: cantaloupe:container_cpu_allocated_cost_per_hour
          expr: |
            max by (namespace, pod, container, node) (container_cpu_allocation)
              * on (node) group_left()
            max by (node) (node_cpu_hourly_cost)

        - record: cantaloupe:container_memory_allocated_cost_per_hour
          expr: |
            (max by (namespace, pod, container, node) (container_memory_allocation_bytes) / 1024^3)
              * on (node) group_left()
            max by (node) (node_ram_hourly_cost)

        - record: cantaloupe:container_allocated_cost_per_hour
          expr: |
            sum by (namespace, pod, container, node) (
              {__name__=~"cantaloupe:container_(cpu|memory)_allocated_cost_per_hour"}
            )

        - record: cantaloupe:container_cpu_request_cost_per_hour
          expr: |
            max by (namespace, pod, container, node) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="cpu",
                unit="core"
              }
            )
              * on (node) group_left()
            max by (node) (node_cpu_hourly_cost)

        - record: cantaloupe:container_memory_request_cost_per_hour
          expr: |
            (max by (namespace, pod, container, node) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="memory",
                unit="byte"
              }
            ) / 1024^3)
              * on (node) group_left()
            max by (node) (node_ram_hourly_cost)

        - record: cantaloupe:container_request_cost_per_hour
          expr: |
            sum by (namespace, pod, container, node) (
              {__name__=~"cantaloupe:container_(cpu|memory)_request_cost_per_hour"}
            )

        - record: cantaloupe:container_cpu_actual_cost_per_hour
          expr: |
            sum by (namespace, pod, container, node) (
              rate(container_cpu_usage_seconds_total{
                job="kubelet",
                container!="",
                container!="POD"
              }[5m])
            )
              * on (node) group_left()
            max by (node) (node_cpu_hourly_cost)

        - record: cantaloupe:container_memory_actual_cost_per_hour
          expr: |
            (max by (namespace, pod, container, node) (
              container_memory_working_set_bytes{
                job="kubelet",
                container!="",
                container!="POD"
              }
            ) / 1024^3)
              * on (node) group_left()
            max by (node) (node_ram_hourly_cost)

        - record: cantaloupe:container_actual_cost_per_hour
          expr: |
            sum by (namespace, pod, container, node) (
              {__name__=~"cantaloupe:container_(cpu|memory)_actual_cost_per_hour"}
            )

        - record: cantaloupe:container_right_sizing_opportunity_per_hour
          expr: |
            clamp_min(
              cantaloupe:container_request_cost_per_hour
                -
              cantaloupe:container_actual_cost_per_hour,
              0
            )

        - record: cantaloupe:workload_allocated_cost_per_hour
          expr: |
            sum by (namespace, workload, workload_type) (
              cantaloupe:container_allocated_cost_per_hour
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:platform_role_node_cost_per_hour
          expr: |
            sum by (platform, role) (
              cantaloupe:node_total_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:platform_role_allocated_cost_per_hour
          expr: |
            sum by (platform, role) (
              cantaloupe:container_allocated_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:namespace_platform_role_allocated_cost_per_hour
          expr: |
            sum by (platform, role, namespace) (
              cantaloupe:container_allocated_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:workload_platform_role_allocated_cost_per_hour
          expr: |
            sum by (platform, role, namespace, workload, workload_type) (
              cantaloupe:container_allocated_cost_per_hour
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:pod_platform_role_allocated_cost_per_hour
          expr: |
            sum by (platform, role, namespace, pod) (
              cantaloupe:container_allocated_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:pod_platform_role_request_cost_per_hour
          expr: |
            sum by (platform, role, namespace, pod) (
              cantaloupe:container_request_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:pod_platform_role_actual_cost_per_hour
          expr: |
            sum by (platform, role, namespace, pod) (
              cantaloupe:container_actual_cost_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

        - record: cantaloupe:pod_platform_role_right_sizing_opportunity_per_hour
          expr: |
            sum by (platform, role, namespace, pod) (
              cantaloupe:container_right_sizing_opportunity_per_hour
                * on (node) group_left(platform, role)
              label_replace(
                label_replace(
                  max by (node, label_platform, label_role) (
                    kube_node_labels{label_platform!="", label_role!=""}
                  ),
                  "platform", "$1", "label_platform", "(.*)"
                ),
                "role", "$1", "label_role", "(.*)"
              )
            )

    - name: cantaloupe.finops.workload-rightsizing
      interval: 5m
      rules:
        - record: cantaloupe:workload_cpu_requests_cores
          expr: |
            sum by (namespace, workload, workload_type) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="cpu",
                unit="core"
              }
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_cpu_p95_7d_cores
          expr: |
            quantile_over_time(
              0.95,
              (
                sum by (namespace, workload, workload_type) (
                  sum by (namespace, pod) (
                    rate(container_cpu_usage_seconds_total{
                      job="kubelet",
                      container!="",
                      container!="POD"
                    }[5m])
                  )
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )
              )[7d:5m]
            )

        # Number of 5-minute workload samples currently available, capped by
        # the 7-day query window. This separates an early candidate from a
        # production-grade recommendation without requiring a load test.
        - record: cantaloupe:workload_observation_hours
          expr: |
            count_over_time(
              (
                sum by (namespace, workload, workload_type) (
                  sum by (namespace, pod) (
                    rate(container_cpu_usage_seconds_total{
                      job="kubelet",
                      container!="",
                      container!="POD"
                    }[5m])
                  )
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )
              )[7d:5m]
            ) / 12

        # 0=data insufficient(<6h), 1=early candidate(6-24h),
        # 2=reviewable(24-168h), 3=operational baseline(>=168h).
        - record: cantaloupe:workload_observation_confidence
          expr: |
            (cantaloupe:workload_observation_hours >= bool 6)
              + (cantaloupe:workload_observation_hours >= bool 24)
              + (cantaloupe:workload_observation_hours >= bool 168)

        - record: cantaloupe:workload_recommended_cpu_cores
          expr: |
            ceil(
              clamp_min(cantaloupe:workload_cpu_p95_7d_cores * 1.25, 0.1)
              * 10
            ) / 10

        - record: cantaloupe:workload_reclaimable_cpu_cores
          expr: |
            clamp_min(
              cantaloupe:workload_cpu_requests_cores
                - cantaloupe:workload_recommended_cpu_cores,
              0
            )

        - record: cantaloupe:workload_memory_requests_bytes
          expr: |
            sum by (namespace, workload, workload_type) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="memory",
                unit="byte"
              }
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_memory_p95_7d_bytes
          expr: |
            quantile_over_time(
              0.95,
              (
                sum by (namespace, workload, workload_type) (
                  sum by (namespace, pod) (
                    container_memory_working_set_bytes{
                      job="kubelet",
                      container!="",
                      container!="POD"
                    }
                  )
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )
              )[7d:5m]
            )

        - record: cantaloupe:workload_recommended_memory_bytes
          expr: |
            ceil(
              clamp_min(
                cantaloupe:workload_memory_p95_7d_bytes * 1.20,
                134217728
              ) / 67108864
            ) * 67108864

        - record: cantaloupe:workload_reclaimable_memory_bytes
          expr: |
            clamp_min(
              cantaloupe:workload_memory_requests_bytes
                - cantaloupe:workload_recommended_memory_bytes,
              0
            )

        - record: cantaloupe:workload_cpu_actual_cost_p95_7d_per_hour
          expr: |
            quantile_over_time(
              0.95,
              (
                sum by (namespace, workload, workload_type) (
                  cantaloupe:container_cpu_actual_cost_per_hour
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )
              )[7d:5m]
            )

        - record: cantaloupe:workload_memory_actual_cost_p95_7d_per_hour
          expr: |
            quantile_over_time(
              0.95,
              (
                sum by (namespace, workload, workload_type) (
                  cantaloupe:container_memory_actual_cost_per_hour
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )
              )[7d:5m]
            )

        - record: cantaloupe:workload_request_cost_per_hour
          expr: |
            sum by (namespace, workload, workload_type) (
              cantaloupe:container_request_cost_per_hour
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_recommended_request_cost_per_hour
          expr: |
            cantaloupe:workload_cpu_actual_cost_p95_7d_per_hour * 1.25
              + cantaloupe:workload_memory_actual_cost_p95_7d_per_hour * 1.20

        - record: cantaloupe:workload_potential_savings_per_month
          expr: |
            730 * clamp_min(
              cantaloupe:workload_request_cost_per_hour
                - cantaloupe:workload_recommended_request_cost_per_hour,
              0
            )

        - record: cantaloupe:workload_recent_oom_signal
          expr: |
            max by (namespace, workload, workload_type) (
              max_over_time(
                kube_pod_container_status_last_terminated_reason{
                  reason="OOMKilled"
                }[7d]
              )
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            ) > 0

        - record: cantaloupe:workload_rightsizing_safe_to_review
          expr: |
            (
              cantaloupe:workload_cpu_requests_cores
                or cantaloupe:workload_memory_requests_bytes
            )
              and on (namespace, workload, workload_type)
            (cantaloupe:workload_observation_hours >= 24)
              unless on (namespace, workload, workload_type)
            cantaloupe:workload_recent_oom_signal

    # Container-template decision metrics. These are deliberately recorded in
    # Prometheus instead of being calculated in Grafana so every dashboard and
    # alert uses the same policy. The candidate target follows the upstream VPA
    # 1.7.1 defaults (P90, 15% margin, 25m CPU / 250Mi memory minimum), but is
    # labelled as a review candidate because this lightweight model does not
    # reproduce VPA's decaying histograms, confidence bounds or OOM estimator.
    - name: cantaloupe.finops.container-rightsizing-candidates
      interval: 5m
      rules:
        - record: cantaloupe:workload_container_cpu_request_cores
          expr: |
            max by (namespace, workload, workload_type, container) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="cpu",
                unit="core"
              }
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_container_memory_request_bytes
          expr: |
            max by (namespace, workload, workload_type, container) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics",
                resource="memory",
                unit="byte"
              }
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_container_memory_limit_bytes
          expr: |
            max by (namespace, workload, workload_type, container) (
              kube_pod_container_resource_limits{
                job="kube-state-metrics",
                resource="memory",
                unit="byte"
              }
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_container_cpu_p95_7d_cores
          expr: |
            max by (namespace, workload, workload_type, container) (
              quantile_over_time(
                0.95,
                (
                  rate(container_cpu_usage_seconds_total{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }[5m])
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              )
            )

        - record: cantaloupe:workload_container_cpu_p90_7d_cores
          expr: |
            max by (namespace, workload, workload_type, container) (
              quantile_over_time(
                0.90,
                (
                  rate(container_cpu_usage_seconds_total{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }[5m])
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              )
            )

        - record: cantaloupe:workload_container_memory_p95_7d_bytes
          expr: |
            max by (namespace, workload, workload_type, container) (
              quantile_over_time(
                0.95,
                (
                  container_memory_working_set_bytes{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              )
            )

        - record: cantaloupe:workload_container_memory_p90_7d_bytes
          expr: |
            max by (namespace, workload, workload_type, container) (
              quantile_over_time(
                0.90,
                (
                  container_memory_working_set_bytes{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              )
            )

        - record: cantaloupe:workload_container_memory_p99_7d_bytes
          expr: |
            max by (namespace, workload, workload_type, container) (
              quantile_over_time(
                0.99,
                (
                  container_memory_working_set_bytes{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              )
            )

        - record: cantaloupe:workload_container_observation_hours
          expr: |
            max by (namespace, workload, workload_type, container) (
              count_over_time(
                (
                  rate(container_cpu_usage_seconds_total{
                    job="kubelet",
                    container!="",
                    container!="POD"
                  }[5m])
                    * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
                )[7d:5m]
              ) / 12
            )

        - record: cantaloupe:workload_container_observation_confidence
          expr: |
            (cantaloupe:workload_container_observation_hours >= bool 6)
              + (cantaloupe:workload_container_observation_hours >= bool 24)
              + (cantaloupe:workload_container_observation_hours >= bool 168)

        - record: cantaloupe:workload_container_recent_oom_signal
          expr: |
            (
              max by (namespace, workload, workload_type, container) (
                max_over_time(
                  kube_pod_container_status_last_terminated_reason{
                    reason="OOMKilled"
                  }[7d]
                )
                  * on (namespace, pod) group_left(workload, workload_type)
                namespace_workload_pod:kube_pod_owner:relabel
              ) > bool 0
            )
              or on (namespace, workload, workload_type, container)
            (0 * cantaloupe:workload_container_memory_p99_7d_bytes)

        - record: cantaloupe:workload_container_cpu_request_candidate_cores
          expr: |
            ceil(
              clamp_min(
                cantaloupe:workload_container_cpu_p90_7d_cores * 1.15,
                0.025
              ) * 1000
            ) / 1000

        - record: cantaloupe:workload_container_memory_request_candidate_bytes
          expr: |
            ceil(
              clamp_min(
                cantaloupe:workload_container_memory_p90_7d_bytes * 1.15,
                262144000
              ) / 1048576
            ) * 1048576

        - record: cantaloupe:workload_container_candidate_safe_to_review
          expr: |
            (
              (cantaloupe:workload_container_observation_hours >= bool 24)
                * on (namespace, workload, workload_type, container)
              (cantaloupe:workload_container_recent_oom_signal == bool 0)
            )

        # OpenCost-derived request allocation by workload template. The
        # candidate cost scales the current pod-level request allocation by
        # candidate/current request. It is an allocation opportunity, not a
        # guaranteed cloud-bill saving until node capacity is actually reduced.
        - record: cantaloupe:workload_container_cpu_request_cost_per_hour
          expr: |
            sum by (namespace, workload, workload_type, container) (
              cantaloupe:container_cpu_request_cost_per_hour
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_container_memory_request_cost_per_hour
          expr: |
            sum by (namespace, workload, workload_type, container) (
              cantaloupe:container_memory_request_cost_per_hour
                * on (namespace, pod) group_left(workload, workload_type)
              namespace_workload_pod:kube_pod_owner:relabel
            )

        - record: cantaloupe:workload_container_cpu_request_candidate_cost_per_hour
          expr: |
            cantaloupe:workload_container_cpu_request_cost_per_hour
              * on (namespace, workload, workload_type, container)
            (
              cantaloupe:workload_container_cpu_request_candidate_cores
                / on (namespace, workload, workload_type, container)
              cantaloupe:workload_container_cpu_request_cores
            )

        - record: cantaloupe:workload_container_memory_request_candidate_cost_per_hour
          expr: |
            cantaloupe:workload_container_memory_request_cost_per_hour
              * on (namespace, workload, workload_type, container)
            (
              cantaloupe:workload_container_memory_request_candidate_bytes
                / on (namespace, workload, workload_type, container)
              cantaloupe:workload_container_memory_request_bytes
            )

        - record: cantaloupe:workload_container_request_candidate_savings_per_month
          expr: |
            730 * clamp_min(
              (
                cantaloupe:workload_container_cpu_request_cost_per_hour
                  + on (namespace, workload, workload_type, container)
                cantaloupe:workload_container_memory_request_cost_per_hour
              )
                - on (namespace, workload, workload_type, container)
              (
                cantaloupe:workload_container_cpu_request_candidate_cost_per_hour
                  + on (namespace, workload, workload_type, container)
                cantaloupe:workload_container_memory_request_candidate_cost_per_hour
              ),
              0
            )
              * on (namespace, workload, workload_type, container)
            cantaloupe:workload_container_candidate_safe_to_review

        - record: cantaloupe:workload_request_candidate_savings_per_month
          expr: |
            sum by (namespace, workload, workload_type) (
              cantaloupe:workload_container_request_candidate_savings_per_month
            )

        - record: cantaloupe:workload_container_memory_limit_headroom_ratio
          expr: |
            (
              cantaloupe:workload_container_memory_limit_bytes
                - on (namespace, workload, workload_type, container)
              cantaloupe:workload_container_memory_p99_7d_bytes
            )
              / on (namespace, workload, workload_type, container)
            cantaloupe:workload_container_memory_p99_7d_bytes

        # Status: 3=recent OOM, 2=limit missing, 1=limit <= observed P99,
        # 0=no observed breach. A high limit is not labelled as cost waste
        # because limits do not reserve schedulable capacity.
        - record: cantaloupe:workload_container_memory_limit_status
          expr: |
            3 * cantaloupe:workload_container_recent_oom_signal
              + on (namespace, workload, workload_type, container)
            (
              1 - cantaloupe:workload_container_recent_oom_signal
            )
              * on (namespace, workload, workload_type, container)
            (
              2 * (
                (
                  cantaloupe:workload_container_memory_limit_bytes
                    or on (namespace, workload, workload_type, container)
