# Grafana 로컬 admin 자격증명.
#
# ── 왜 이 파일이 생겼나 ─────────────────────────────────────────
#
# 2026-08-11 까지 이 Secret 은 **손으로 `kubectl apply`** 돼 있었다.
# 그래서 이렇게 돼 있었다.
#
#   annotations: ['kubectl.kubernetes.io/last-applied-configuration']
#   admin-password 가 그 어노테이션 안에 들어있다: True
#   이 Secret 을 소유한 ExternalSecret: 없음
#
# 문제가 셋이다.
#
#   1. 비밀번호가 두 곳에 산다 — `data` 와 어노테이션. 회전하면 `data` 만
#      바뀌고 **어노테이션에는 옛 값이 남는다**
#   2. **어노테이션은 redact 되지 않는다.** `data` 를 가리는 도구·백업·
#      diff 뷰가 어노테이션은 그대로 흘린다
#   3. ArgoCD 가 소유하지 않으므로 누가 바꿔도 OutOfSync 가 안 뜬다
#
# `decisions/20260731_secret-access-no-fallback.md` 는 "시크릿의 진실은
# Vault·Secrets Manager 에 있고 매니페스트는 참조만 갖는다"고 정했는데
# 이 시크릿만 그 규칙 밖에 있었다 → tasks/.../015_sso-loose-ends.md B1
#
# ── 이 계정의 자리 ──────────────────────────────────────────────
#
# ⚠️ **Grafana OIDC 의 폴백이다.** `grafana.ini` 가 `disable_login_form:
# false` 로 남아 있는 이유가 이것이다. Keycloak 이 죽어도 대시보드에
# 들어갈 문이 하나 남는다.
#
# Vault 가 `userpass` 를 지운 것과 왜 다른가 — Vault 는 오프라인 봉투
# (초기 root 토큰 + recovery key)라는 폴백이 이미 있었고, Grafana 는
# 없다. **폴백을 없애려면 다른 폴백이 있어야 한다.**
# → decisions/20260811_vault-oidc-replaces-userpass.md
#
# ⚠️ **이름을 바꾸지 않는다.** kube-prometheus-stack values 의
# `grafana.admin.existingSecret` 이 이 이름을 가리킨다.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  # SecretStore 는 grafana-oidc-secret.yaml 이 만들어 둔 것을 쓴다.
  # 네임스페이스 범위라 monitoring 밖의 시크릿은 못 꺼낸다.
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    # Owner: 이 ExternalSecret 이 Secret 의 생명주기를 갖는다. 손으로
    # 만든 것을 지우고 이쪽이 다시 만들게 해야 어노테이션이 사라진다.
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: { key: cntlp/grafana/admin, property: admin-user }
    - secretKey: admin-password
      remoteRef: { key: cntlp/grafana/admin, property: admin-password }
