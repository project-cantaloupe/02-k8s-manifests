apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-s3-finops-collector
  namespace: monitoring
  labels:
    app: aws-s3-finops-collector
    area: monitoring
    category: finops
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aws-s3-inventory-collector
  namespace: monitoring
  labels:
    app: aws-s3-finops-collector
    area: monitoring
    category: finops
spec:
  schedule: "0 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: aws-s3-finops-collector
            area: monitoring
            category: finops
            platform: aws
            cost-allocation: shared
        spec:
          serviceAccountName: aws-s3-finops-collector
          restartPolicy: Never
          nodeSelector: &awsNodeSelector
            platform: aws
            role: service
          securityContext: &podSecurityContext
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: aws-api
              image: public.ecr.aws/aws-cli/aws-cli:2.31.22
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  for bucket in cntlp-aws-quarantine cntlp-aws-transcode; do
                    aws s3api list-objects-v2 --region "$AWS_REGION" --bucket "$bucket" --output json > "/work/current-${bucket}.json"
                    aws s3api list-object-versions --region "$AWS_REGION" --bucket "$bucket" --output json > "/work/versions-${bucket}.json"
                  done
              env: &awsEnv
                - name: AWS_REGION
                  value: ap-northeast-2
                - name: AWS_EC2_METADATA_DISABLED
                  value: "false"
                - name: HOME
                  value: /tmp
              volumeMounts: &apiMounts
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources: &apiResources
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext: &containerSecurityContext
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: collector
              image: python:3.12.11-alpine3.22
              command: ["python", "/opt/cantaloupe/aws_s3_finops_collector.py", "inventory"]
              env: &collectorEnv
                - name: PUSHGATEWAY_URL
                  value: http://cantaloupe-finops-pushgateway.monitoring.svc:9091
                - name: AWS_S3_FINOPS_INPUT_DIR
                  value: /work
                - name: QUARANTINE_STANDARD_IA_DAYS
                  value: "30"
                - name: QUARANTINE_GLACIER_IR_DAYS
                  value: "60"
              volumeMounts: &collectorMounts
                - name: collector
                  mountPath: /opt/cantaloupe
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext: *containerSecurityContext
          volumes: &volumes
            - name: collector
              configMap:
                name: aws-s3-finops-collector
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aws-s3-policy-collector
  namespace: monitoring
  labels:
    app: aws-s3-finops-collector
    area: monitoring
    category: finops
spec:
  schedule: "0 3 * * 1"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: aws-s3-finops-collector
            area: monitoring
            category: finops
            platform: aws
            cost-allocation: shared
        spec:
          serviceAccountName: aws-s3-finops-collector
          restartPolicy: Never
          nodeSelector:
            platform: aws
            role: service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: aws-api
              image: public.ecr.aws/aws-cli/aws-cli:2.31.22
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  for bucket in cntlp-aws-quarantine cntlp-aws-transcode; do
                    aws s3api get-bucket-versioning --region "$AWS_REGION" --bucket "$bucket" > "/work/versioning-${bucket}.json"
                    aws s3api get-bucket-lifecycle-configuration --region "$AWS_REGION" --bucket "$bucket" > "/work/lifecycle-${bucket}.json"
                    aws s3api get-bucket-encryption --region "$AWS_REGION" --bucket "$bucket" > "/work/encryption-${bucket}.json"
                    aws s3api get-public-access-block --region "$AWS_REGION" --bucket "$bucket" > "/work/public-access-${bucket}.json"
                    if ! aws s3api get-bucket-policy-status --region "$AWS_REGION" --bucket "$bucket" > "/work/policy-status-${bucket}.json" 2> /tmp/policy-error; then
                      if grep -q NoSuchBucketPolicy /tmp/policy-error; then
                        printf '{"PolicyStatus":{"IsPublic":false},"PolicyMissing":true}\n' > "/work/policy-status-${bucket}.json"
                      else
                        cat /tmp/policy-error >&2
                        exit 1
                      fi
                    fi
                    aws s3api get-bucket-ownership-controls --region "$AWS_REGION" --bucket "$bucket" > "/work/ownership-${bucket}.json"
                  done
              env:
                - name: AWS_REGION
                  value: ap-northeast-2
                - name: AWS_EC2_METADATA_DISABLED
                  value: "false"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          containers:
            - name: collector
              image: python:3.12.11-alpine3.22
              command: ["python", "/opt/cantaloupe/aws_s3_finops_collector.py", "policy"]
              env:
                - name: PUSHGATEWAY_URL
                  value: http://cantaloupe-finops-pushgateway.monitoring.svc:9091
                - name: AWS_S3_FINOPS_INPUT_DIR
                  value: /work
                - name: QUARANTINE_STANDARD_IA_DAYS
                  value: "30"
                - name: QUARANTINE_GLACIER_IR_DAYS
                  value: "60"
              volumeMounts:
                - name: collector
                  mountPath: /opt/cantaloupe
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          volumes:
            - name: collector
              configMap:
                name: aws-s3-finops-collector
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aws-s3-finops-collector
  namespace: monitoring
  labels:
    app: aws-s3-finops-collector
    area: monitoring
    category: finops
    release: monitoring
spec:
  groups:
    - name: cantaloupe.finops.aws-s3
      interval: 5m
      rules:
        - alert: AwsS3InventoryCollectorStale
          expr: absent(cantaloupe_s3_inventory_collection_timestamp_seconds) or (time() - max(cantaloupe_s3_inventory_collection_timestamp_seconds) > 25200)
          for: 15m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: S3 인벤토리가 7시간 이상 갱신되지 않았습니다
            description: 6시간 주기 S3 API 집계의 마지막 성공 시각을 확인하세요.
            action: aws-s3-inventory-collector 실행 이력, AWS IAM, Pushgateway 연결을 확인하세요.
        - alert: AwsS3PolicyCollectorStale
          expr: absent(cantaloupe_s3_policy_collection_timestamp_seconds) or (time() - max(cantaloupe_s3_policy_collection_timestamp_seconds) > 691200)
          for: 30m
          labels:
            severity: warning
            category: finops
          annotations:
            summary: S3 Bucket 정책 점검이 8일 이상 갱신되지 않았습니다
            description: 주간 S3 Bucket 제어 수집의 마지막 성공 시각을 확인하세요.
            action: aws-s3-policy-collector 실행 이력과 Bucket 설정 조회 권한을 확인하세요.
