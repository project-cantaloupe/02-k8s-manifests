# GENERATED by generate_onprem_rightsizing.py. Do not edit manually.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cantaloupe-onprem-rightsizing
  namespace: monitoring
  labels:
    release: monitoring
    app: opencost
    area: monitoring
    category: finops
  annotations:
    cantaloupe.io/policy-version: cantaloupe-onprem-rightsizing-v1
spec:
  groups:
  - name: cantaloupe.finops.onprem-rightsizing
    interval: 5m
    rules:
    - record: cantaloupe:onprem_node_cpu_p95_7d_cores
      expr: quantile_over_time(0.95, (sum by (node) (rate(container_cpu_usage_seconds_total{job="kubelet",container!="",container!="POD"}[5m])))[7d:5m])
        and on (node) max by (node) (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_memory_p95_7d_bytes
      expr: quantile_over_time(0.95, (sum by (node) (container_memory_working_set_bytes{job="kubelet",container!="",container!="POD"}))[7d:5m])
        and on (node) max by (node) (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_observation_hours
      expr: count_over_time((sum by (node) (rate(container_cpu_usage_seconds_total{job="kubelet",container!="",container!="POD"}[5m])))[7d:5m])
        / 12 and on (node) max by (node) (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_observation_confidence
      expr: (cantaloupe:onprem_node_observation_hours >= bool 6) + (cantaloupe:onprem_node_observation_hours >= bool 24) + (cantaloupe:onprem_node_observation_hours
        >= bool 168)
    - record: cantaloupe:onprem_node_cpu_requests_cores
      expr: sum by (node) (kube_pod_container_resource_requests{job="kube-state-metrics",resource="cpu",unit="core"}) and on (node) max by (node)
        (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_memory_requests_bytes
      expr: sum by (node) (kube_pod_container_resource_requests{job="kube-state-metrics",resource="memory",unit="byte"}) and on (node) max by
        (node) (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_required_cpu_cores
      expr: cantaloupe:onprem_node_cpu_p95_7d_cores * 1.300000000 + 0.500000000
    - record: cantaloupe:onprem_node_required_memory_bytes
      expr: cantaloupe:onprem_node_memory_p95_7d_bytes * 1.300000000 + 1073741824
    - record: cantaloupe:onprem_profile_hourly_cost
      expr: "label_replace(vector(0.015), \"recommended_profile\", \"onp-small\", \"\", \"\")\n  or\nlabel_replace(vector(0.03), \"recommended_profile\"\
        , \"onp-medium\", \"\", \"\")\n  or\nlabel_replace(vector(0.045), \"recommended_profile\", \"onp-memory-balanced\", \"\", \"\")\n  or\n\
        label_replace(vector(0.06), \"recommended_profile\", \"onp-large\", \"\", \"\")"
    - record: cantaloupe:onprem_profile_vcpu
      expr: "label_replace(vector(2), \"recommended_profile\", \"onp-small\", \"\", \"\")\n  or\nlabel_replace(vector(4), \"recommended_profile\"\
        , \"onp-medium\", \"\", \"\")\n  or\nlabel_replace(vector(4), \"recommended_profile\", \"onp-memory-balanced\", \"\", \"\")\n  or\nlabel_replace(vector(8),\
        \ \"recommended_profile\", \"onp-large\", \"\", \"\")"
    - record: cantaloupe:onprem_profile_memory_bytes
      expr: "label_replace(vector(4294967296), \"recommended_profile\", \"onp-small\", \"\", \"\")\n  or\nlabel_replace(vector(8589934592), \"\
        recommended_profile\", \"onp-medium\", \"\", \"\")\n  or\nlabel_replace(vector(12884901888), \"recommended_profile\", \"onp-memory-balanced\"\
        , \"\", \"\")\n  or\nlabel_replace(vector(17179869184), \"recommended_profile\", \"onp-large\", \"\", \"\")"
    - record: cantaloupe:onprem_node_current_profile_hourly_cost
      expr: "0.015000000 * max by (node) (kube_node_labels{label_platform=\"onp\",label_node_kubernetes_io_instance_type=\"custom-2vcpu-4gib\"\
        })\n  or\n0.030000000 * max by (node) (kube_node_labels{label_platform=\"onp\",label_node_kubernetes_io_instance_type=\"custom-4vcpu-8gib\"\
        })\n  or\n0.045000000 * max by (node) (kube_node_labels{label_platform=\"onp\",label_node_kubernetes_io_instance_type=\"custom-4vcpu-12gib\"\
        })\n  or\n0.060000000 * max by (node) (kube_node_labels{label_platform=\"onp\",label_node_kubernetes_io_instance_type=\"custom-8vcpu-16gib\"\
        })"
    - record: cantaloupe:onprem_node_recommendation_info
      expr: "label_replace((0 * ((cantaloupe:onprem_node_required_cpu_cores <= 2.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes\
        \ <= 4294967296)) + 1), \"recommended_profile\", \"onp-small\", \"\", \"\")\n  or\nlabel_replace((0 * (((cantaloupe:onprem_node_required_cpu_cores\
        \ <= 4.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 8589934592)) unless on (node) ((cantaloupe:onprem_node_required_cpu_cores\
        \ <= 2.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 4294967296))) + 1), \"recommended_profile\", \"onp-medium\"\
        , \"\", \"\")\n  or\nlabel_replace((0 * (((cantaloupe:onprem_node_required_cpu_cores <= 4.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes\
        \ <= 12884901888)) unless on (node) ((cantaloupe:onprem_node_required_cpu_cores <= 2.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes\
        \ <= 4294967296) or (cantaloupe:onprem_node_required_cpu_cores <= 4.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes\
        \ <= 8589934592))) + 1), \"recommended_profile\", \"onp-memory-balanced\", \"\", \"\")\n  or\nlabel_replace((0 * (((cantaloupe:onprem_node_required_cpu_cores\
        \ <= 8.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 17179869184)) unless on (node) ((cantaloupe:onprem_node_required_cpu_cores\
        \ <= 2.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 4294967296) or (cantaloupe:onprem_node_required_cpu_cores\
        \ <= 4.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 8589934592) or (cantaloupe:onprem_node_required_cpu_cores\
        \ <= 4.000000000) and on (node) (cantaloupe:onprem_node_required_memory_bytes <= 12884901888))) + 1), \"recommended_profile\", \"onp-large\"\
        , \"\", \"\")"
    - record: cantaloupe:onprem_node_recommended_vcpu
      expr: cantaloupe:onprem_node_recommendation_info * on (recommended_profile) group_left() cantaloupe:onprem_profile_vcpu
    - record: cantaloupe:onprem_node_recommended_memory_bytes
      expr: cantaloupe:onprem_node_recommendation_info * on (recommended_profile) group_left() cantaloupe:onprem_profile_memory_bytes
    - record: cantaloupe:onprem_node_recommended_hourly_cost
      expr: cantaloupe:onprem_node_recommendation_info * on (recommended_profile) group_left() cantaloupe:onprem_profile_hourly_cost
    - record: cantaloupe:onprem_node_potential_savings_per_hour
      expr: clamp_min(cantaloupe:onprem_node_current_profile_hourly_cost - on (node) cantaloupe:onprem_node_recommended_hourly_cost, 0)
    - record: cantaloupe:onprem_node_potential_savings_per_month
      expr: 730 * cantaloupe:onprem_node_potential_savings_per_hour
    - record: cantaloupe:onprem_node_requests_fit_recommendation
      expr: (cantaloupe:onprem_node_cpu_requests_cores <= on (node) cantaloupe:onprem_node_recommended_vcpu * 0.900000000) and on (node) (cantaloupe:onprem_node_memory_requests_bytes
        <= on (node) cantaloupe:onprem_node_recommended_memory_bytes * 0.900000000)
    - record: cantaloupe:onprem_node_recent_oom_signal
      expr: max by (node) (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[7d])  * on (namespace, pod) group_left(node)
        max by (namespace, pod, node) (kube_pod_info)) > 0
    - record: cantaloupe:onprem_node_memory_pressure
      expr: max by (node) (kube_node_status_condition{condition="MemoryPressure",status="true"} == 1) and on (node) max by (node) (kube_node_labels{label_platform="onp"})
    - record: cantaloupe:onprem_node_recommendation_safe_to_review
      expr: cantaloupe:onprem_node_requests_fit_recommendation and on (node) (cantaloupe:onprem_node_observation_hours >= 24) unless on (node)
        cantaloupe:onprem_node_recent_oom_signal unless on (node) cantaloupe:onprem_node_memory_pressure
    - alert: OnPremRightSizingBlockedByRequests
      expr: (cantaloupe:onprem_node_potential_savings_per_month > 0 and on (node) (cantaloupe:onprem_node_observation_hours >= 24)) unless on
        (node) cantaloupe:onprem_node_requests_fit_recommendation
      for: 30m
      labels:
        severity: warning
        category: finops
      annotations:
        summary: On-prem VM 축소 전에 Workload Request 조정이 필요합니다
        description: '{{ $labels.node }} 노드의 P95 기준 권장 Profile에는 현재 Pod Request 합계가 안전하게 들어가지 않습니다.'
        action: VM을 먼저 축소하지 말고 Workload Right-sizing과 재스케줄링 가능 여부를 검증하세요.
