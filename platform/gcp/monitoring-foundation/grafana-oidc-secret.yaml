# Grafana 의 OIDC 클라이언트 시크릿을 AWS Secrets Manager 에서 끌어온다.
#
# **평문이 이 리포에 없다.** 여기 적히는 것은 "어디서 가져오나"뿐이다
# → decisions/20260731_secret-access-no-fallback.md
#
# 값은 `terraform/keycloak` 이 만들어 넣는다 (01-infra-provisioning
# terraform/keycloak/secrets.tf). 클라이언트를 지우고 다시 만들면 시크릿이
# 바뀌므로, 아래 `refreshInterval` 이 그 반영 지연의 상한이다.
---
# ── SecretStore 를 monitoring 에 하나 더 둔다 ──────────────────
#
# `secops` 의 것을 재사용할 수 없다. SecretStore 는 **네임스페이스 범위**라
# 다른 네임스페이스의 ExternalSecret 이 참조하지 못한다.
#
# ⚠️ **그게 의도다.** `ClusterSecretStore` 로 하나만 두면 어느
# 네임스페이스에서 ExternalSecret 을 만들 수 있는 사람이든 Keycloak 의 DB
# 비밀번호까지 꺼낼 수 있다. ESO 는 "누가 무엇을 꺼낼 수 있나"를
# SecretStore 의 범위로만 표현하므로, 범위를 좁히는 것이 유일한 통제다
# → platform/aws/secops/keycloak/manifests/secret-store.yaml 의 같은 논지
#
# 실제 권한 경계는 여기가 아니라 **IAM** 이다. `auth:` 가 없으므로 ESO 는
# AWS SDK 기본 자격증명 체인 → IMDS → 워커 노드 Instance Profile 을 탄다.
# 그 역할이 읽을 수 있는 것은 `cntlp/oidc/*` 로 한정돼 있다
# (terraform/keycloak/secrets.tf 의 인라인 정책).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  # `dataFrom.extract` 로 통째로 가져오지 않는다. 나중에 필드를 늘렸을 때
  # 쓰지도 않는 값이 Secret 에 실리는 것을 막는다.
  data:
    - secretKey: client_id
      remoteRef:
        key: cntlp/oidc/grafana
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: cntlp/oidc/grafana
        property: client_secret
