apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  labels:
    app: fluentd
    area: logging
    platform: gcp
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      annotations:
        checksum/fluentd-config: 8737cfff0799af4de8e90abbf26434a35852f91157b481d5812eb39d8db30501
      labels:
        app: fluentd
        area: logging
        platform: gcp
    spec:
      nodeSelector:
        platform: gcp
        role: logging
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-elasticsearch7-1
        resources:
          limits:
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: config-volume
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: config-volume
        configMap:
          name: fluentd-config
