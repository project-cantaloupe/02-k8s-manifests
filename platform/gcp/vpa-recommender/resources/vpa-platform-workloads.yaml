# Cluster-wide recommendation inventory.
# A workloads are actionable review candidates. B workloads expose recommendations
# for capacity planning only and are excluded from realizable savings.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana-recommendation
  namespace: monitoring
  labels:
    cantaloupe.io/rightsizing-class: actionable
    cantaloupe.io/review-policy: standard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: "8", memory: 16Gi}
---
