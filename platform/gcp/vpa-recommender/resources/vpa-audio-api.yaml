---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: audio-ingress-recommendation
  namespace: audio-ingress
  labels:
    cantaloupe.io/rightsizing-class: actionable
    cantaloupe.io/review-policy: manual
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audio-ingress
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: "4", memory: 4Gi}
