# VPA 1.7.0: recommendation-only deployment.
admissionController:
  enabled: false

updater:
  enabled: false

recommender:
  enabled: true
  replicas: 1
  # Bootstrap the recommendation model from the retained Prometheus history,
  # then continue ingesting fresh samples from metrics.k8s.io. The project has
  # seven days of retention, so querying eight days is unnecessary.
  extraArgs:
    - --storage=prometheus
    - --prometheus-address=http://monitoring-prometheus.monitoring.svc:9090
    - --prometheus-cadvisor-job-name=kubelet
    # kube-prometheus-stack uses current Kubernetes label names rather than
    # the legacy kubernetes-cadvisor/pod_name/name convention assumed by VPA.
    - --container-name-label=container
    - --container-pod-name-label=pod
    - --container-namespace-label=namespace
    - --metric-for-pod-labels=kube_pod_labels{job="kube-state-metrics"}
    - --pod-name-label=pod
    - --pod-namespace-label=namespace
    - --pod-label-prefix=label_
    - --history-length=7d
    - --history-resolution=1h
    # The upstream defaults are 25m/250Mi. CPU stays upstream-default; memory
    # follows the smallest declared application request so low-footprint
    # workloads remain distinguishable. Recommendations are never auto-applied.
    - --pod-recommendation-min-cpu-millicores=25
    - --pod-recommendation-min-memory-mb=64
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  podDisruptionBudget:
    enabled: false
  nodeSelector:
    platform: gcp
    role: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
