# VPA 1.7.0: recommendation-only deployment.
admissionController:
  enabled: false

updater:
  enabled: false

recommender:
  enabled: true
  replicas: 1
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  podDisruptionBudget:
    enabled: false
  nodeSelector:
    platform: gcp
    role: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
