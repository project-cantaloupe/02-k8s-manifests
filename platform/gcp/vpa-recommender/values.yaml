# VPA 1.7.0: recommendation-only deployment.
admissionController:
  enabled: false

updater:
  enabled: false

recommender:
  enabled: true
  replicas: 1
  # VPA 1.7.0 checkpoint storage persists recommender samples; fresh samples
  # continue to come from metrics.k8s.io. The separate FinOps dashboard uses
  # Prometheus retention for immediate 7-day P95/P99/Max evidence.
  extraArgs:
    # The upstream defaults are 25m/250Mi. CPU stays upstream-default; memory
    # follows the smallest declared application request so low-footprint
    # workloads remain distinguishable. Recommendations are never auto-applied.
    - --pod-recommendation-min-cpu-millicores=25
    - --pod-recommendation-min-memory-mb=64
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  podDisruptionBudget:
    enabled: false
  nodeSelector:
    platform: gcp
    role: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
