# OpenSearch Dashboards 앞의 인증 게이트.
#
# **security plugin 을 켜지 않기로 한 결과물이다**
# → decisions/20260811_opensearch-sso-via-proxy.md
#
# ⚠️ **이것이 덮는 것은 5601(UI)뿐이다.** OpenSearch 자체(9200)는 여전히
# 무인증이다. 프록시를 통과한 뒤에는 전원이 같은 권한이다.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: logging
spec:
  # `auth:` 가 없으므로 AWS SDK 기본 자격증명 체인 → IMDS → 워커 노드
  # Instance Profile 을 탄다. 그 역할이 읽을 수 있는 것은 `cntlp/oidc/*`
  # 로 한정돼 있다 (01-infra-provisioning terraform/keycloak/secrets.tf).
  #
  # ⚠️ **네임스페이스 범위인 것이 통제다.** ClusterSecretStore 로 하나만
  # 두면 어느 네임스페이스에서든 Keycloak DB 비밀번호까지 꺼낼 수 있다.
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: cntlp/oidc/opensearch-dashboards, property: client_id }
    - secretKey: client-secret
      remoteRef: { key: cntlp/oidc/opensearch-dashboards, property: client_secret }
    - secretKey: cookie-secret
      remoteRef: { key: cntlp/oidc/opensearch-dashboards, property: cookie_secret }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: logging
  labels: &lbl
    app: oauth2-proxy
    area: logging
    platform: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels: *lbl
    spec:
      # **Dashboards 와 같은 노드에 둔다.** 앞선 주석은 "Cluster 정책이라
      # 어느 노드에서든 닿는다"고 적었는데, NodePort 쪽이 그렇지 않다.
      #
      # `default-deny-ingress` 가 걸린 네임스페이스에서는 크로스노드
      # NodePort 트래픽이 파드에 도착할 때 출발지가 **원격 노드 IP** 라
      # 정책에 막힌다. 실측하면 게이트 파드가 있는 노드에서만 열린다.
      #   → findings/20260811_logs-lands-on-harbor.md
      #
      # 그래서 tailscale serve 를 여는 노드와 게이트 파드가 같은 노드여야
      # 하고, Dashboards 도 여기 있으므로 홉이 하나 준다.
      nodeSelector:
        kubernetes.io/hostname: cntlp-gcp-wk-02
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.echoprism.cloud/realms/cantaloupe
            # **게이트는 루트에 마운트한다.** 서브패스(`/logs`)에 걸었더니
            # 로그인 뒤 착지가 깨졌다 — `tailscale serve --set-path` 가
            # 접두사를 벗겨서 넘기므로 프록시는 자기가 `/logs` 아래 있는
            # 것을 모르고, 착지 경로를 `/` 로 기록한다. 그리고 그 호스트의
            # `/` 는 Harbor 였다.
            #   → decisions/20260811_gate-at-root-not-subpath.md
            #   → findings/20260811_logs-lands-on-harbor.md
            #
            # ⚠️ **콜백은 멀쩡했다.** 들어오는 방향은 `--proxy-prefix` 로
            # 맞출 수 있고, 나가는 방향은 맞출 설정이 없다. 그래서 "로그인은
            # 되는데 엉뚱한 앱이 뜬다"로 나타난다.
            #
            # 루트에 두면 안팎의 좌표계가 같아져 문제가 성립하지 않는다.
            # `--redirect-url` 과 `--proxy-prefix` 가 이제 같은 좌표계다.
            - --redirect-url=https://cntlp-gcp-wk-02.tail270b85.ts.net/oauth2/callback
            - --proxy-prefix=/oauth2
            - --upstream=http://opensearch-dashboards.logging.svc.cluster.local:5601
            - --http-address=0.0.0.0:4180
            - --scope=openid profile email groups
            # 그룹으로 가른다. Keycloak 매퍼가 `groups` 클레임을 싣는다.
            # ⚠️ **`--allowed-group` 이 없으면 realm 의 누구나 들어온다.**
            - --oidc-groups-claim=groups
            - --allowed-group=platform-admin
            - --allowed-group=devops
            - --allowed-group=secops
            - --allowed-group=finops
            # 프록시 뒤 앱에 사용자를 알린다. Dashboards 는 이 헤더를
            # 쓰지 않지만, 접근 로그에 남아 "누가 봤나"가 기록된다.
            - --set-xauthrequest=true
            - --pass-access-token=false
            # PKCE. 시크릿이 있어도 인가 코드 가로채기는 막는다.
            - --code-challenge-method=S256
            # TLS 종료는 tailscale serve 가 한다. 프록시는 평문으로 받는다.
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --email-domain=*
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports:
            - containerPort: 4180
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: logging
  labels:
    app: oauth2-proxy
    area: logging
spec:
  type: NodePort
  # ⚠️ **`Local` 로 두면 파드가 있는 노드에서만 응답한다.** 지금은 그
  # 노드(onp)에서 serve 하므로 어느 쪽이든 되지만, 파드가 옮겨가도
  # 안 깨지도록 `Cluster` 로 둔다.
  externalTrafficPolicy: Cluster
  selector:
    app: oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
      nodePort: 30418
      name: http
