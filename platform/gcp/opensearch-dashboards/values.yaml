opensearchHosts: "http://opensearch-cluster-master.logging.svc.cluster.local:9200"

# The OpenSearch security plugin is disabled for the internal smoke setup.
# Disable the matching Dashboards plugin, because no login credentials exist.
extraEnvs:
  - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
    value: "true"

# OpenSearch 2.12.0과 Dashboards 메이저/마이너 버전을 맞춘다.
image:
  tag: "2.12.0"

replicaCount: 1

# ⚠️ **ClusterIP 다. NodePort 로 되돌리지 않는다.**
#
# 2026-08-11 까지 NodePort 30561 이었고, 그 주석은 "Tailscale Serve 로만
# 닿는다. 공개 로드밸런서로 노출되지 않는다" 고 적고 있었다. **뒷문장은
# 맞고 앞문장은 틀렸다** — NodePort 는 노드의 모든 인터페이스에서 열리고
# 노드는 tailnet 위에 있다. 즉 메시 참여자 누구나 인증 없이 열 수 있었다.
#
#   $ curl -o /dev/null -w '%{http_code}' http://<노드 tailnet IP>:30561/api/status
#   200        ← oauth2-proxy 를 지나지 않는다
#
# **정문(oauth2-proxy)을 세우면서 옆문을 안 닫았다.** 정문만 세우면 정문의
# 값이 0 이다 → tasks/.../015_sso-loose-ends.md A1
#
# 유일한 소비자는 같은 클러스터의 oauth2-proxy 이고 서비스 DNS 로 부른다
# (platform/gcp/logging-sso/oauth2-proxy.yaml 의 `--upstream`).
# ClusterIP 로 충분하다.
#
# ⚠️ **되돌리는 법**: 이 블록을 NodePort 30561 로 되돌리면 우회가 복원된다.
# 되돌려야 할 상황이면 그 전에 왜 프록시로 안 되는지를 먼저 적는다.
service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Cantaloupe workload identity/cost-allocation labels. The chart keeps its
# own selector labels and adds these to the Deployment pod template.
labels:
  area: logging
  platform: gcp

nodeSelector:
  platform: gcp
  role: logging
