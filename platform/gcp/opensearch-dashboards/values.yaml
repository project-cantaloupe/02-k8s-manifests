opensearchHosts: "http://opensearch-cluster-master.logging.svc.cluster.local:9200"

# The OpenSearch security plugin is disabled for the internal smoke setup.
# Disable the matching Dashboards plugin, because no login credentials exist.
extraEnvs:
  - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
    value: "true"

# OpenSearch 2.12.0과 Dashboards 메이저/마이너 버전을 맞춘다.
image:
  tag: "2.12.0"

replicaCount: 1

# Dashboards is reachable only through Tailscale Serve on the GCP logging
# node. NodePort provides the local upstream; it is not exposed by a public
# cloud load balancer.
service:
  type: NodePort
  port: 5601
  nodePort: 30561

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Cantaloupe workload identity/cost-allocation labels. The chart keeps its
# own selector labels and adds these to the Deployment pod template.
labels:
  area: logging
  platform: gcp

nodeSelector:
  platform: gcp
  role: logging
