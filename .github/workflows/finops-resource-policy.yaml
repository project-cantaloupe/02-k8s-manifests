name: FinOps resource policy

on:
  pull_request:
    paths:
      - "applications/**"
      - "apps/**"
      - "platform/**"
      - "governance/finops/**"
      - "tools/ci/**"
      - ".github/workflows/finops-resource-policy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finops-resource-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: "5.8.0"

      - name: Set up Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.18.2

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2

      - name: Render Argo CD application targets
        run: python tools/ci/render_finops_targets.py --output .rendered/finops-targets.yaml

      - name: Validate rendered resources
        run: >-
          kyverno apply governance/finops/require-resource-limits.yaml
          --resource .rendered/finops-targets.yaml

      - name: Verify that a missing resource declaration is rejected
        run: tools/ci/verify_negative_case.sh
