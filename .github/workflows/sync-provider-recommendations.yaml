name: Sync provider VM recommendations

on:
  schedule:
    # Provider recommendations are not real-time. Refresh once a day at 00:15 UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: provider-vm-recommendations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'asia-northeast3-a' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Read GCP Machine Type recommendations
        run: |
          gcloud recommender recommendations list \
            --recommender=google.compute.instance.MachineTypeRecommender \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_ZONE" \
            --format=json > "$RUNNER_TEMP/gcp-recommendations.json"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read AWS Compute Optimizer recommendations
        id: aws
        shell: bash
        run: |
          enrollment="$(aws compute-optimizer get-enrollment-status --query status --output text)"
          case "$enrollment" in
            Active) status=no-active-recommendation ;;
            Pending) status=analyzing ;;
            *) status=inactive ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          aws compute-optimizer get-ec2-instance-recommendations \
            --region "$AWS_REGION" > "$RUNNER_TEMP/aws-recommendations.json"

      - name: Normalize snapshots and generate Prometheus rules
        run: |
          python platform/gcp/opencost/sync_provider_recommendations.py \
            --gcp-json "$RUNNER_TEMP/gcp-recommendations.json" \
            --aws-json "$RUNNER_TEMP/aws-recommendations.json" \
            --aws-status "${{ steps.aws.outputs.status }}"
          python platform/gcp/opencost/generate_provider_recommendations.py
          python platform/gcp/opencost/generate_provider_recommendations.py --check

      - name: Commit refreshed non-secret recommendation cache
        shell: bash
        run: |
          if git diff --quiet -- \
            platform/gcp/opencost/provider-recommendations.yaml \
            platform/gcp/monitoring-foundation/provider-recommendation-rules.yaml; then
            echo "Provider recommendations are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            platform/gcp/opencost/provider-recommendations.yaml \
            platform/gcp/monitoring-foundation/provider-recommendation-rules.yaml
          git commit -m "chore(finops): refresh provider VM recommendations"
          git push
