# 이 파일은 root Application(main)에 등록하지 않는다. Argo CD에서 이 branch와
# smoke/logging-stack 경로를 가리키는 임시 Application으로 동기화해 검증한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-kafka
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: kafka
      targetRevision: 26.0.0
      helm:
        releaseName: kafka
        valueFiles:
          - $values/platform/gcp/kafka/values.yaml
    - repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
      targetRevision: feat/logging-stack
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
