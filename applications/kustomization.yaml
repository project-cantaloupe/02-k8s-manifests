apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ⚠️ 순서는 여기가 아니라 각 Application 의 sync-wave 가 정한다.
  # governance-namespaces(-40)가 가장 먼저, governance-policies(10)가 마지막.
  - governance-namespaces.yaml
  - governance-rbac.yaml
  - governance-policies.yaml
  # wave -5. **`secops.yaml`(wave 0)보다 반드시 먼저다.** 그 카탈로그 안의
  # `cert-manager/cluster-issuer.yaml` 이 여기서 설치되는 CRD 를 쓴다.
  # 등록 전에는 두 ClusterIssuer 가 `no matches for kind "ClusterIssuer"` 로
  # 실패해 `secops` Application 이 Failed 로 남았다. 같은 카탈로그의 Kyverno 는
  # 함께 막히지 **않는다** — ArgoCD 는 실패한 자원만 남기고 나머지는 적용한다
  # → findings/20260806_skipdryrun-does-not-cover-missing-crd.md
  # → tasks/todo/008_identity-and-sso.md
  - cert-manager.yaml
  # wave -5. `ExternalSecret` CRD 를 여기서 설치한다. 이걸 쓰는 워크로드보다
  # 먼저 서야 한다 → applications/external-secrets.yaml
  - external-secrets.yaml
  - argocd.yaml
  - harbor-helm-secrets.yaml
  - harbor-helm-storage.yaml
  - harbor-helm.yaml
  - gcp-storage.yaml
  # wave -5. AWS 워커의 영구 볼륨. 여기 없으면 `gcp-pd-*` 두 개만 남고
  # AWS 노드의 PVC 는 프로비저너가 GCP 라 조용히 Pending 에 머문다
  # → applications/aws-storage.yaml
  - aws-storage.yaml
  - logging-stack.yaml
  - logging-sso.yaml
  - istio-base.yaml
  - istiod.yaml
  # ambient 데이터플레인. 셋이 한 벌이다 → applications/istiod.yaml
  - istio-cni.yaml
  - ztunnel.yaml
  - karpenter-controller.yaml
  - kubelet-csr-approver.yaml
  - karpenter-nodepool.yaml
  - keda.yaml
  - monitoring-foundation.yaml
  # Metrics API가 먼저 준비된 뒤 VPA Recommender가 사용량을 읽는다.
  - metrics-server.yaml
  - vpa-recommender.yaml
  - monitoring-stack.yaml
  - cloudwatch-exporter-sqs.yaml
  - opencost.yaml
  - audio-ingress.yaml
  # wave -9. 게이트웨이 Envoy 안에서 도는 WAF(Coraza WasmPlugin).
  # audio-ingress(-10) 뒤, app-audio(0) 앞이다
  # → platform/aws/audio-waf/wasm-plugin.yaml
  - audio-waf.yaml
  - secops.yaml
  - app-audio.yaml
  # `audio-edge-smoke.yaml` 은 일부러 등록하지 않는다. ambient 가 실제로
  # 도는지 볼 워크로드가 필요해서 만든 것인데, 이제 `app-audio` 가 진짜
  # 워크로드를 `apps` 에 올린다. 파일은 남겨두되 배포하지 않는다
  # → tasks/doing/009_istio-governance-reconcile.md
