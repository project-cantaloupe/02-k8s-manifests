# External Secrets Operator. 외부 비밀 저장소를 감시해 Kubernetes Secret 으로
# 동기화한다. 첫 사용처는 Keycloak 의 RDS 비밀번호다
# → decisions/20260807_keycloak-database-placement.md
#
# **매니페스트에 값이 안 들어간다.** `ExternalSecret` 은 "어느 저장소의 어느
# 키" 만 적고, 실제 값은 컨트롤러가 런타임에 가져와 Secret 을 만든다. Secret 은
# 사본이고 진실은 Secrets Manager 에 남는다
# → decisions/20260731_secret-access-no-fallback.md
#
# ── 자격증명 ────────────────────────────────────────────────────
#
# cert-manager·EBS CSI 와 같은 길이다. IRSA 를 못 써서 **Node Instance Profile
# (`cntlp-aws-worker-node`)에서 IMDS 로** 가져온다. `SecretStore` 에
# `auth` 를 비워두면 AWS SDK 의 기본 자격증명 체인이 돌고 IMDS 까지 내려간다.
#
# ⚠️ **`nodeSelector` 의 `role: service` 를 빼지 않는다.** Secrets Manager 읽기
# 권한(`cntlp-aws-identity-database-node`)이 붙은 것은 `cntlp-aws-worker-node`
# 역할뿐이고, cp-01 은 `cntlp-aws-control-plane-node` 라 그 권한이 없다.
# 컨트롤러가 cp-01 로 새면 AccessDenied 로 동기화가 죽는다.
#
# ── 착지 순서 ───────────────────────────────────────────────────
#
# wave -5. cert-manager 와 같은 층이다. **`ExternalSecret` CRD 를 여기서
# 설치하므로 그걸 쓰는 워크로드(wave 0+)보다 먼저 서야 한다.** 등록을 빠뜨리면
# `no matches for kind "ExternalSecret"` 로 죽는다 — cert-manager 때 정확히
# 그렇게 겪었다 → findings/20260806_skipdryrun-does-not-cover-missing-crd.md
#
# ⚠️ 네임스페이스가 `default-deny-ingress` 제외 목록에 있어야 한다. ESO 의
# ValidatingWebhook 둘을 kube-apiserver 가 컨트롤플레인 호스트 네트워크에서
# 호출하기 때문이다 → governance/secops/generate-default-network-policies.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      releaseName: external-secrets
      values: |
        # 세 컴포넌트(controller·webhook·cert-controller) 전부에 걸린다.
        # 렌더에서 되찾아 확인한다 — helm 은 모르는 키를 조용히 무시한다.
        global:
          nodeSelector:
            platform: aws
            role: service
        # CRD 를 차트가 설치한다. 이게 꺼지면 wave -5 에 두는 의미가 없다.
        crds:
          createClusterExternalSecret: true
          createClusterSecretStore: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 192Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        # The controller exposes its actual reconciliation condition metrics
        # on :8080. Enabling this chart-managed ServiceMonitor avoids
        # synthesising ExternalSecret success/failure values in Grafana.
        serviceMonitor:
          enabled: true
          interval: 30s
        # The ServiceMonitor selects this controller metrics Service.  The
        # Service remains ClusterIP-only; it does not expose the endpoint
        # outside the cluster.
        metrics:
          service:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
