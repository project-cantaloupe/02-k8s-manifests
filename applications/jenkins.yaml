apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: main
    path: platform/onp/jenkins
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
