apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-logging  
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: feat/logging-stack
    path: platform/gcp
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true