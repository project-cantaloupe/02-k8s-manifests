# Root Application(main)이 이 파일만 동기화한다. 실제 logging 매니페스트는
# smoke 단계 동안 feat/logging-stack에서 읽는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-logging
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: feat/logging-stack
    path: smoke/logging-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
