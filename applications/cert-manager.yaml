# DNS와 Kubernetes Service Account OIDC가 준비된 뒤 Root 목록에 등록한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
        global:
          nodeSelector:
            platform: aws
            role: service
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 192Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
        startupapicheck:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        # Self-managed Kubernetes OIDC를 연결한 뒤 두 값을 실제 ARN과 경로로 교체
        extraEnv:
          - name: AWS_ROLE_ARN
            value: REPLACE_CERT_MANAGER_ROLE_ARN
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/aws-iam-token/serviceaccount-token
        volumes:
          - name: aws-iam-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: sts.amazonaws.com
                    expirationSeconds: 86400
                    path: serviceaccount-token
        volumeMounts:
          - name: aws-iam-token
            mountPath: /var/run/secrets/aws-iam-token
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
