# Route53 Hosted Zone과 cert-manager의 AWS 자격증명 경로가 확정된 뒤 Root 목록에
# 등록한다. 이 PoC는 Workload IAM(OIDC)을 채택하지 않고 AWS Service Worker의
# Node Instance Profile을 사용하므로, DNS-01에 필요한 Route53 권한을 Node Role에
# 추가할지 먼저 결정해야 한다. Node Role은 Audio 권한 합집합이므로 Route53을
# 더하면 권한 범위가 그만큼 넓어진다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
        global:
          nodeSelector:
            platform: aws
            role: service
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 192Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
        startupapicheck:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        # AWS 자격증명은 Node Instance Profile에서 IMDS로 가져온다. 별도 환경
        # 변수나 Token Volume을 두지 않는다. Calico IMDS GlobalNetworkPolicy의
        # 허용 대상에 cert-manager를 포함해야 DNS-01이 동작한다.
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
