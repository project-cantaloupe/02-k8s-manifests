# Kyverno ClusterPolicy 와 PolicyException.
#
# ⚠️ **wave 10 — Kyverno 가 선 다음이다.** Kyverno 는 `applications/secops.yaml`
# 카탈로그가 wave 0 에 배포한다. CRD 가 없으면 이 sync 는
# `no matches for kind "ClusterPolicy" in version "kyverno.io/v1"` 로 실패한다
# (2026-08-05 실서버 dry-run 에서 실제로 확인한 메시지다).
#
# **네임스페이스(wave -40)보다 늦게 오는 것은 문제가 아니다.** 생성 정책이
# `background: true` 라 Kyverno 가 이미 있는 네임스페이스를 거슬러 올라가
# NetworkPolicy 를 채운다.
#
# ⚠️ **착지 직후 PolicyReport 를 본다.** 여기 있는 정책 중 Enforce 인 것이
# 기존 워크로드를 거부할 수 있다. Harbor·Prometheus 같은 차트는
# 위반 목록을 미리 알 수 없다 → governance/README.md 의 Audit 우선 절차,
# tasks/todo/002_bootstrap-blockers.md 2번
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-policies
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # ⚠️ **아래 ServerSideApply=true 와 한 쌍이다. 하나만 켜면 영구 OutOfSync 다.**
    #
    # SSA 는 `kubectl.kubernetes.io/last-applied-configuration` 을 남기지 않는다.
    # 그 어노테이션이 ArgoCD 3-way merge 의 기준선이라, 없으면 "git 원본 vs
    # 살아있는 객체 전체"를 맞대는 2-way 비교로 떨어진다. 그러면 **CRD 스키마의
    # `default:` 로 API 서버가 채운 필드가 전부 드리프트로 보인다.**
    #
    # 2026-08-07 실측으로 ClusterPolicy 5개가 이 여섯을 기본값으로 받는다.
    #
    #     spec.admission = true
    #     spec.emitWarning = false
    #     spec.validationFailureAction = "Audit"     ← generate 정책만
    #     spec.rules[*].skipBackgroundRequests = true
    #     spec.rules[*].validate.allowExistingViolations = true
    #
    # ServerSideDiff 는 API 서버에 SSA dry-run 을 던져 "적용하면 어떻게 될지"를
    # 받고 그 예측값과 비교한다. 기본값이 양쪽에 똑같이 나타나 상쇄된다.
    #
    # `ignoreDifferences` 로 위 목록을 나열하는 길도 있으나 쓰지 않는다.
    # Kyverno 가 기본값을 하나 늘릴 때마다 깨지는 블랙리스트다
    # → decisions/20260807_argocd-server-side-diff.md
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: main
    path: governance/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      # Kyverno CRD 가 아직 없는 순간에도 sync 를 시도할 수 있게 한다.
      # 없으면 첫 배포에서 dry-run 단계부터 막힌다.
      - SkipDryRunOnMissingResource=true
