# ztunnel — ambient 의 데이터플레인. 노드당 하나의 L4 프록시가 그 노드
# 파드들의 mTLS 와 L4 권한을 대신 처리한다.
#
# **사이드카가 파드마다 먹던 자원이 노드당 하나로 줄어든다.** 사이드카는
# 파드 수만큼 늘고 앱 재시작 없이는 업그레이드도 안 됐다.
#
# ⚠️ **ztunnel 은 L4 까지다.** 집행할 수 있는 것과 없는 것이 갈린다.
#
#   된다      mTLS, `source.principals`·`namespaces`·포트 기반 AuthorizationPolicy
#   안 된다   HTTP 메서드·경로·헤더 조건, DestinationRule 트래픽 정책,
#             VirtualService 의 L7 라우팅(게이트웨이 밖에서)
#
# **안 되는 것은 에러가 아니라 무시다.** 정책 객체는 그대로 있고 아무것도
# 안 막는다. L7 이 필요한 워크로드에는 waypoint 프록시를 따로 세운다
# → decisions/20260805_istio-service-mesh.md
#
# ⚠️ **전용 네임스페이스 `ztunnel` 에 둔다.** 다른 파드의 네트워크
# 네임스페이스에 들어가야 해서 `NET_ADMIN`·`SYS_ADMIN` 과 hostPath 를 쓴다.
# istio-cni 와 같은 봉쇄 이유다 → applications/istio-cni.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: devops
  annotations:
    # istio-cni(-18) 다음. 게이트웨이(-10) 앞.
    argocd.argoproj.io/sync-wave: "-16"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.30.3
    helm:
      releaseName: ztunnel
      values: |
        # 네 차트가 같은 값이어야 한다 → applications/istiod.yaml 주석
        profile: ambient
        # ⚠️ **릴리스 네임스페이스가 `ztunnel` 이라 이 값이 필요하다.**
        # ztunnel 은 `istiod.<istioNamespace>.svc:15012` 로 xDS 를 받는다.
        # 틀리면 붙지 못하고 트래픽이 통과만 된다.
        istioNamespace: istio-system
        # 컨트롤플레인 노드에도 떠야 한다.
        tolerations:
          - operator: Exists
        # 다중 플랫폼 DaemonSet 이라 `platform` 라벨을 안 붙인다 (규약 3절).
        podLabels:
          app: ztunnel
          area: apps
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: ztunnel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
