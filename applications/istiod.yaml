# istiod — 메시 컨트롤플레인. **ambient 모드**다.
#
# ── 배치가 aws 인 이유 ──────────────────────────────────────────
#
# `CONSTRAINTS.md` 는 Kyverno 컨트롤러를 `platform=aws` 에 고정한다. 근거는
# *"어드미션 웹훅이 모든 쓰기의 동기 경로에 있어 다른 영역에 두면 WAN 을
# 왕복한다"* 이다. **istiod 도 어드미션 웹훅을 갖는다** — 검증 웹훅
# (`istio-validator-istio-system`) 이 모든 Istio CR 쓰기 경로에 있고,
# 홈랩 회선이 끊기면 `failurePolicy` 에 따라 쓰기가 막힌다.
#
# **aws 안에서도 `role=service` 가 아니라 `role=control-plane` 이다.**
# service 워커는 t3.small 2 GiB 이고 그 메모리를 FFmpeg 가 써야 한다.
# 대신 K8s 컨트롤플레인과 메시 컨트롤플레인의 장애 영역이 묶인다 —
# 아래 values 주석에 그 트레이드오프를 적어뒀다.
#
# ── ambient 인 이유 ────────────────────────────────────────────
#
# 사이드카는 `istio-init` init 컨테이너가 `NET_ADMIN`·`NET_RAW` 를 요구해서
# `apps` 의 `restricted` 를 못 지난다. ambient 는 그 특권을 노드 단위
# DaemonSet 둘로 옮긴다.
#
#   istio-cni  iptables/netns 설정. 네임스페이스 `istio-cni`
#   ztunnel    노드별 L4 프록시. 네임스페이스 `ztunnel`
#
# 둘 다 privileged 라서 **전용 네임스페이스로 봉쇄한다** — Kepler·Falco 와
# 같은 규칙이다 (00-cantaloupe-resources/k8s-labeling-convention.md 1절).
# 이 봉쇄가 ambient 의 요점이다. 특권이 앱 옆에서 노드 인프라로 내려간다.
#
# ⚠️ **L7 정책은 waypoint 프록시가 있어야 동작한다.** ztunnel 은 L4 까지다.
# `source.principals` 같은 L4 AuthorizationPolicy 는 ztunnel 이 집행하지만
# HTTP 메서드·경로 조건이나 DestinationRule 의 트래픽 정책은 waypoint 없이
# 조용히 무시된다 → decisions/20260805_istio-service-mesh.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  # Istiod가 webhook endpoint 준비 후 주입하는 CA와 차단 정책을 보존한다.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      releaseName: istiod
      values: |
        # ambient 를 켠다. `pilot.env.PILOT_ENABLE_AMBIENT` 를 세우고
        # ztunnel 이 붙을 xDS 경로를 연다. istio-cni·ztunnel 쪽 profile 과
        # **반드시 같이 켜야 한다** — 하나만 켜면 파드가 메시에 안 들어가고
        # 에러도 안 난다.
        profile: ambient
        # ⚠️ **ztunnel 을 `istio-system` 밖에 두면 이 값이 반드시 필요하다.**
        #
        # ztunnel 은 자기 인증서가 아니라 **각 워크로드의 인증서를 대신
        # 요청한다**(impersonation). 노드 하나가 그 위 모든 파드의 신원을
        # 발급받는 것이라, istiod 는 이 권한을 **명시된 계정 하나에만** 준다.
        # 그 목록이 `CA_TRUSTED_NODE_ACCOUNTS` 이고 기본값이
        # `istio-system/ztunnel` 이다.
        #
        # 우리는 PSA 봉쇄를 위해 ztunnel 을 전용 네임스페이스로 뺐다
        # (→ governance/namespaces/ztunnel.yaml). 그래서 실제 신원이
        # `spiffe://cluster.local/ns/ztunnel/sa/ztunnel` 이고 기본값과 어긋난다.
        #
        # **증상이 배치가 아니라 트래픽에서 나타난다.** DaemonSet 은 정상으로
        # 뜨고 파드 포획도 되고 15008 도 열린다. 인증서만 못 받아서 HBONE
        # 핸드셰이크가 실패하고 **게이트웨이가 503 을 낸다.**
        #
        #   ztunnel:  certificate fetch failed (signing gRPC error
        #             (The request does not have valid authentication
        #             credentials): request impersonation authentication
        #             failure) id=spiffe://cluster.local/ns/apps/sa/default
        #   gateway:  503 UC envoy://connect_originate/10.244.33.108:8080
        #
        # 2026-08-06 착지 때 실제로 겪었다
        # → findings/20260806_ztunnel-ca-trusted-node-accounts.md
        env:
          CA_TRUSTED_NODE_ACCOUNTS: "ztunnel/ztunnel"
        autoscaleEnabled: false
        replicaCount: 1
        # On-Prem은 DevOps 전용 Node이므로 Istio를 두지 않는다. istiod는 AWS
        # Audio Mesh의 mTLS에 필요하므로 삭제하지 않고 Control Plane Node로
        # 옮긴다. Service Worker는 t3.small 2 GiB이며 FFmpeg가 그 메모리를
        # 써야 하므로 대상에서 제외한다. Kubernetes Control Plane과 Istio
        # Control Plane의 장애 영역이 묶이는 것을 트레이드오프로 수용한다.
        nodeSelector:
          platform: aws
          role: control-plane
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 512Mi
        seccompProfile:
          type: RuntimeDefault
        global:
          proxy:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        meshConfig:
          accessLogFile: /dev/stdout
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
