apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  # Istiod가 webhook endpoint 준비 후 주입하는 CA와 차단 정책을 보존한다.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      releaseName: istiod
      values: |
        autoscaleEnabled: false
        replicaCount: 1
        # On-Prem은 DevOps 전용 Node이므로 Istio를 두지 않는다. istiod는 AWS
        # Audio Mesh의 mTLS에 필요하므로 삭제하지 않고 Control Plane Node로
        # 옮긴다. Service Worker는 t3.small 2 GiB이며 FFmpeg가 그 메모리를
        # 써야 하므로 대상에서 제외한다. Kubernetes Control Plane과 Istio
        # Control Plane의 장애 영역이 묶이는 것을 트레이드오프로 수용한다.
        nodeSelector:
          platform: aws
          role: control-plane
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 512Mi
        seccompProfile:
          type: RuntimeDefault
        global:
          proxy:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        meshConfig:
          accessLogFile: /dev/stdout
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
