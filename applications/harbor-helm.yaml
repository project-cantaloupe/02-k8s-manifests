apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-helm
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.2
      helm:
        releaseName: harbor-v2
        valuesObject:
          expose:
            type: nodePort
            tls:
              enabled: false
            nodePort:
              name: harbor-v2
              ports:
                http:
                  port: 80
                  nodePort: 32432
          # TLS is terminated by Tailscale Serve on the on-prem node. Harbor
          # must advertise the public HTTPS URL so Docker follows an HTTPS
          # token realm instead of the internal HTTP NodePort.
          externalURL: https://cntlp-onp-wk-01.tail270b85.ts.net
          existingSecretAdminPassword: harbor-v2-admin
          existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
          updateStrategy:
            type: Recreate
          persistence:
            enabled: true
            resourcePolicy: keep
            persistentVolumeClaim:
              registry:
                existingClaim: harbor-v2-registry
              jobservice:
                jobLog:
                  existingClaim: harbor-v2-jobservice
              database:
                existingClaim: harbor-v2-database
              redis:
                existingClaim: harbor-v2-redis
          trivy:
            enabled: true
            persistence:
              enabled: true
              existingClaim: data-harbor-v2-trivy-0
            nodeSelector: &onpNode
              platform: onp
              role: devops
            resources:
              limits:
                cpu: "1000m"
                memory: "2048Mi"
              requests:
                cpu: "200m"
                memory: "512Mi"
          portal:
            nodeSelector: *onpNode
            resources:
              requests:
                cpu: "25m"
                memory: "32Mi"
              limits:
                memory: "128Mi"
          core:
            nodeSelector: *onpNode
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                memory: "512Mi"
          jobservice:
            nodeSelector: *onpNode
            resources:
              requests:
                cpu: "25m"
                memory: "64Mi"
              limits:
                memory: "256Mi"
          registry:
            nodeSelector: *onpNode
            registry:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "256Mi"
            controller:
              resources:
                requests:
                  cpu: "25m"
                  memory: "64Mi"
                limits:
                  memory: "256Mi"
          database:
            internal:
              nodeSelector: *onpNode
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  memory: "1Gi"
              initContainer:
                permissions:
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "16Mi"
                    limits:
                      memory: "64Mi"
          redis:
            internal:
              nodeSelector: *onpNode
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  memory: "128Mi"
          nginx:
            nodeSelector: *onpNode
            resources:
              requests:
                cpu: "25m"
                memory: "32Mi"
              limits:
                memory: "128Mi"
          exporter:
            nodeSelector: *onpNode
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
