# AWS 워커에 영구 볼륨을 붙인다. Keycloak PostgreSQL 의 마지막 선행 조건이다
# → tasks/todo/008_identity-and-sso.md
#
# 여기 오기 전 StorageClass 는 `gcp-pd-sc`·`gcp-pd-retain` 둘뿐이었고 **둘 다
# 프로비저너가 `pd.csi.storage.gke.io`** 라, AWS 노드에 뜨는 파드가 PVC 를 걸면
# 파드가 영원히 Pending 에 머문다. 에러가 나지 않는 종류의 실패다.
#
# ── 자격증명 ────────────────────────────────────────────────────
#
# cert-manager 와 같은 길이다. IRSA 를 쓰지 못해 **Node Instance Profile
# (`cntlp-aws-worker-node`)에서 IMDS 로** 가져온다. 그래서 ServiceAccount 에
# `eks.amazonaws.com/role-arn` 주석을 달지 않는다
# → decisions/20260806_cert-manager-node-instance-profile.md
#
# 권한은 AWS **관리형** 정책 `AmazonEBSCSIDriverPolicy` 를 붙였다. 인라인으로
# 베끼지 않은 이유는 이 정책이 드라이버 기능을 따라 계속 바뀌기 때문이다
# (2026-08-07 기준 v15). 파괴적 동작은 드라이버가 스스로 붙이는 태그
# (`ebs.csi.aws.com/cluster`·`CSIVolumeName`)로 조건이 걸려 있다.
#
# ⚠️ **`ec2:AttachVolume`·`DetachVolume` 에는 조건이 없다.** 노드 단위
# 자격증명이라 wk-01 의 모든 파드가 이 권한을 갖고, 계정 안 아무 인스턴스에서나
# 볼륨을 뗄 수 있다. 감수하고 가는 위험이고, 컨트롤플레인 3대 확장 때 IRSA 로
# 파드 단위 권한을 만들면서 닫는다 → 위 결정문의 「대안」
#
# ── 배치 ────────────────────────────────────────────────────────
#
# ⚠️ **`node.nodeSelector` 를 반드시 준다.** 이 차트는
# `node.tolerateAllTaints: true` 가 기본이라, 안 주면 DaemonSet 이 **GCP·온프렘
# 노드까지 전부** 올라가 EBS 가 없는 곳에서 CrashLoop 한다.
#
# 컨트롤러는 AWS API 를 부르므로 인스턴스 프로파일이 붙은 `role: service`
# (= wk-01) 여야 한다. cp-01 은 역할이 달라 EBS 권한이 없다.
#
# `replicaCount` 를 1 로 내렸다. 기본값 2 인데 anti-affinity 가 soft 라 지금
# 노드 하나에 둘 다 얹힌다 — t3.small 2 GiB 에서 그냥 낭비다. AWS 워커가
# 늘면 2 로 올린다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-storage
  namespace: devops
  annotations:
    # cert-manager(-5)와 같은 층. 워크로드(wave 0+)가 PVC 를 걸기 전에 선다.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    chart: aws-ebs-csi-driver
    targetRevision: 2.63.1
    helm:
      releaseName: aws-ebs-csi-driver
      values: |
        controller:
          # 인스턴스 프로파일이 붙은 노드. 여기서 새면 AWS API 가 전부 막힌다.
          nodeSelector:
            platform: aws
            role: service
          replicaCount: 1
          # IRSA 를 안 쓰므로 role-arn 주석을 달지 않는다.
          serviceAccount:
            create: true
            name: ebs-csi-controller-sa
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              memory: 256Mi
        node:
          # ⚠️ 이걸 빼면 GCP·온프렘 노드까지 올라간다. 위 「배치」 참고.
          nodeSelector:
            platform: aws
          # 클러스터가 Linux 전용이다. 켜두면 `ebs-csi-node-windows` DaemonSet 이
          # 같이 렌더되는데, `kubernetes.io/os: windows` 라 파드는 0개인 채
          # 객체만 남아 ArgoCD 트리에 죽은 자원으로 보인다. GCP CSI 도 같은
          # 이유로 Windows 객체를 지운다 → platform/gcp/csi-driver/kustomization.yaml
          enableWindows: false
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              memory: 256Mi
        sidecars:
          provisioner:
            resources: &sidecar-resources
              requests:
                cpu: 5m
                memory: 24Mi
              limits:
                memory: 128Mi
          attacher:
            resources: *sidecar-resources
          resizer:
            resources: *sidecar-resources
          livenessProbe:
            resources: *sidecar-resources
          nodeDriverRegistrar:
            resources: *sidecar-resources
        # 차트가 딸려 보내는 e2e 테스트 훅을 끈다. 기본값이 켜져 있고
        # ServiceAccount·ConfigMap·Pod 에 **ClusterRole·ClusterRoleBinding 까지**
        # 만든다. `helm.sh/hook: test` 라 ArgoCD 가 실행하지는 않지만, 쓰지도
        # 않을 클러스터 수준 권한 객체를 남길 이유가 없다.
        helmTester:
          enabled: false
        # StorageClass 를 차트 값으로 만든다. GCP 쪽은 상류가 kustomize 라
        # `platform/gcp/csi-driver/` 에 따로 뒀지만, 이쪽은 차트가 이 값을
        # 1급으로 지원해서 드라이버와 한 파일에 두는 편이 진실이 하나다.
        storageClasses:
          # 기본값(Delete). PVC 를 지우면 EBS 볼륨도 사라진다.
          - name: aws-ebs-sc
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
            volumeBindingMode: WaitForFirstConsumer
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              type: gp3
              encrypted: "true"
          # 상태 있는 앱용(Retain). Keycloak PostgreSQL 이 이걸 쓴다.
          # PVC 를 지워도 볼륨이 남아 수동 회수 대상이 된다.
          - name: aws-ebs-retain
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
            volumeBindingMode: WaitForFirstConsumer
            reclaimPolicy: Retain
            allowVolumeExpansion: true
            parameters:
              type: gp3
              encrypted: "true"
        # ⚠️ **기본 StorageClass 를 두지 않는다.** 클러스터가 3영역이라,
        # 기본이 있으면 `storageClassName` 을 빠뜨린 PVC 가 조용히 AWS 볼륨을
        # 잡고 GCP·온프렘 파드에 붙지 못해 Pending 에 머문다. GCP 쪽도 같은
        # 이유로 둘 다 `is-default-class: "false"` 다.
        #
        # `volumeBindingMode: WaitForFirstConsumer` 도 같은 맥락이다. Immediate
        # 면 스케줄러가 노드를 고르기 **전에** 볼륨이 특정 AZ 에 생겨서, 파드가
        # 다른 AZ 로 가면 붙지 못한다.
  destination:
    server: https://kubernetes.default.svc
    # PSA 가 privileged 인 네임스페이스다. 노드 플러그인이 호스트 마운트
    # 네임스페이스를 만져야 해서 restricted 로는 못 뜬다.
    namespace: storage-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
