apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-foundation-preview
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: feat/monitoring-customization
    path: platform/gcp/monitoring-foundation-preview
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
