apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audio-ingress
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.3
    helm:
      releaseName: audio-ingress
      values: |
        name: audio-ingress
        # WAF(WasmPlugin audio-waf)가 이 파드 안에서 돈다. 그래서 replicas 는
        # 게이트웨이 가용성이자 곧 **WAF 대수**다
        # → platform/aws/audio-waf/wasm-plugin.yaml
        #
        # ⚠️ 2 로 올렸다가 1 로 되돌렸다. 2026-08-11 에 wk-02 를 죽였다.
        #
        # WAF 를 얹으면 파드가 44Mi → 270Mi 가 된다(실측). NLB 타겟 노드는
        # wk-01·wk-02 둘뿐이고 wk-02 는 Keycloak·CloudWatch exporter 2 개가
        # 올라간 79% 노드였다. 거기에 270Mi 를 더하니 kubelet 이 굶어
        # 노드가 NotReady 로 떨어졌다.
        #
        # **CONSTRAINTS.md 를 어긴 것이다** — "인터넷 노출 게이트웨이는
        # Keycloak 워커에 합치지 않는다" → decisions/20260806_aws-node-placement.md
        # podAntiAffinity 로 흩으면 후보가 그 두 대뿐이라 자동으로 위반된다.
        #
        # 2 로 되돌리려면 **NLB 타겟이면서 Keycloak 이 없는 노드**가 한 대
        # 더 있어야 한다 → findings/20260811_waf-memory-killed-wk-02.md
        replicaCount: 1
        autoscaling:
          enabled: false

        # replicas 1 에서는 새 파드를 먼저 띄우고 옛 파드를 지운다.
        # 반대로 하면(maxSurge 0) 롤아웃마다 게이트웨이가 0 대가 되는 공백이
        # 생긴다 — 지금은 대체할 파드가 없다.
        #
        # ⚠️ **replicas 를 2 로 되돌릴 때는 maxSurge 를 0 으로 바꿔야 한다.**
        # required podAntiAffinity + 후보 노드 2 대 조합에서 maxSurge 1 은
        # 세 번째 파드를 만들려다 Pending 에 머물고 롤아웃이 안 끝난다.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0

        # replicas 1 에서는 차트가 PDB 를 렌더링하지 않는다(replicaCount > 1
        # 조건). 2 로 되돌리면 이 값이 다시 살아난다
        podDisruptionBudget:
          minAvailable: 1

        serviceAccount:
          create: true
          name: audio-ingress
        service:
          type: NodePort
          # ⚠️ Local 이다. Cluster 로 되돌리지 않는다.
          #
          # Cluster 는 NodePort 로 들어온 패킷을 kube-proxy 가 SNAT 해서
          # 넘긴다. Envoy 가 보는 소스 IP 가 항상 노드 IP 가 되어 WAF 의
          # IP 차단·rate limit·geo 룰이 전부 무의미해진다. NLB 는 L4 라
          # X-Forwarded-For 도 안 붙인다(그건 ALB 의 일이다).
          # NLB 타겟그룹은 preserve_client_ip = true 로 이미 실어 보내고 있다
          # → repos/01-infra-provisioning/terraform/aws/edge/edge.tf
          #
          # 같은 SNAT 성질을 다른 각도에서 밟은 기록
          # → tasks/done/019_opensearch-gate-at-root.md
          externalTrafficPolicy: Local
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
              nodePort: 32021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
              nodePort: 30080
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443
              nodePort: 30443
        labels:
          app: audio-ingress
          area: apps
          platform: aws
        podAnnotations:
          proxy.istio.io/config: |
            accessLogFile: /dev/stdout
            accessLogEncoding: JSON
            accessLogFormat: |
              {"level":"info","message":"ingress request completed","event_type":"ingress_request_completed","status":"%RESPONSE_CODE_DETAILS%","request_id":"%REQ(X-REQUEST-ID)%","http_status":"%RESPONSE_CODE%","http_method":"%REQ(:METHOD)%","http_route":"%ROUTE_NAME%","processing_duration_ms":"%DURATION%","upstream_service":"%UPSTREAM_CLUSTER%"}
        nodeSelector:
          platform: aws
          role: service

        # ⚠️ externalTrafficPolicy: Local 과 한 벌이다. 따로 떼지 않는다.
        #
        # role=service 노드는 세 대인데 NLB 타겟그룹에는 **두 대만** 있다.
        # wk-99 는 Karpenter 가 만든 노드라 terraform 이 모르고, 따라서
        # 타겟으로 등록되지 않는다. Local 정책에서 파드가 wk-99 에 뜨면
        # 그 파드는 외부 트래픽을 0건 받는다 — Running 이고 Ready 라서
        # 겉으로는 정상으로 보인다.
        #
        #   cntlp-aws-wk-01  terraform  → NLB 타겟 ✓
        #   cntlp-aws-wk-02  terraform  → NLB 타겟 ✓
        #   cntlp-aws-wk-99  Karpenter  → 타겟 아님 ✗  (karpenter.sh/nodepool 보유)
        #
        # 노드 이름이 아니라 `karpenter.sh/nodepool` 유무로 가른다.
        # terraform 이 워커를 늘리면 그 노드는 타겟그룹에 자동 등록되고
        # 이 조건도 자동으로 통과한다 — 이름을 박으면 그게 안 된다.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/nodepool
                      operator: DoesNotExist
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              # WAF 를 서로 다른 노드에 흩는다. 한 노드에 몰리면 replicas 2 가
              # 노드 장애에 아무 소용이 없다 (지금은 replicas 1 이라 무효)
              - labelSelector:
                  matchLabels:
                    app: audio-ingress
                topologyKey: kubernetes.io/hostname

              # ⚠️ **Keycloak 과 같은 노드에 뜨지 않는다.** 규약을 주석이
              # 아니라 스케줄러가 강제하게 한다 — 2026-08-11 에 이걸 주석으로만
              # 알고 있다가 wk-02 를 죽였다.
              #
              # "인터넷 노출 게이트웨이는 Keycloak 워커에 합치지 않는다"
              # → decisions/20260806_aws-node-placement.md, CONSTRAINTS.md
              #
              # 이유는 배치 취향이 아니라 메모리다. Keycloak(JVM)+CloudWatch
              # exporter 2 개가 올라간 t3.small 은 79% 다. WAF 를 얹은
              # 게이트웨이는 270Mi 를 쓴다(실측). 합치면 kubelet 이 굶는다.
              #
              # 라벨로 거는 것이 노드 이름으로 거는 것보다 낫다 — Keycloak 이
              # 옮겨가면 게이트웨이의 후보 노드도 따라서 바뀐다
              - labelSelector:
                  matchLabels:
                    app: keycloak
                namespaces:
                  - secops
                topologyKey: kubernetes.io/hostname

        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1337
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # WAF 를 얹으면서 올렸다. 128Mi 는 Coraza 이전 실측(44Mi)에 맞춘 값이라
        # 그대로 두면 **스케줄러가 노드 여유를 과대평가**한다.
        # 압축 해제된 WASM 모듈만 18.5MB 이고 Envoy 가 이걸 V8 에 로드해
        # 컴파일한다. CRS 4.14.0 룰의 정규식 상태가 여기 더해진다.
        #
        # 이 숫자는 추정이다. 탐지 단계의 실측으로 확정한다 → 020 「완료 조건」
        # wk-02 는 이미 메모리 77% 예약 상태라 여유가 크지 않다.
        #
        # CPU limit 은 여기 안 적지만 **없는 게 아니다** — 차트 기본값
        # 2000m 이 깊은 병합으로 남는다(helm template 으로 확인). t3.small 이
        # 2 vCPU 라 노드 전체와 같아서 사실상 스로틀이 안 걸린다.
        # 낮추지 않는다 — WAF 는 모든 요청의 동기 경로에 있어서 CFS 스로틀이
        # 걸리면 에러가 아니라 지연으로 나타나고, 그게 훨씬 찾기 어렵다
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: audio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # 네임스페이스는 governance/namespaces/ 가 만든다.
      # 여기서 만들면 Pod Security Admission 라벨이 안 붙는다.
      - CreateNamespace=false
      - ServerSideApply=true
