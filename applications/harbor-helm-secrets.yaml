apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-helm-secrets
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # ServerSideApply=true 와 한 쌍이다. 하나만 켜면 영구 OutOfSync 가 된다.
    # ServerSideDiff 는 API 서버에 SSA dry-run 을 던져 기본값 포함 여부를 비교한다.
    # → decisions/20260807_argocd-server-side-diff.md
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/project-cantaloupe/02-k8s-manifests.git
    targetRevision: main
    path: platform/onp/harbor-helm/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
