apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-demo-before
  namespace: finops-demo
  labels:
    app.kubernetes.io/name: finops-demo
    finops.cantaloupe.io/experiment: before
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-demo
      finops.cantaloupe.io/experiment: before
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finops-demo
        finops.cantaloupe.io/experiment: before
    spec:
      nodeSelector:
        platform: aws
        role: service
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 800m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi

