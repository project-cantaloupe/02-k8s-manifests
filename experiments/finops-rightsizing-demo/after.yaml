apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-demo-after
  namespace: finops-demo
  labels:
    app.kubernetes.io/name: finops-demo
    finops.cantaloupe.io/experiment: after
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-demo
      finops.cantaloupe.io/experiment: after
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finops-demo
        finops.cantaloupe.io/experiment: after
    spec:
      nodeSelector:
        platform: aws
        role: service
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

